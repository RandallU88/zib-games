<body><main>
<div class="top-nav"><a class="hs-home hs-home--inline" href="../../" data-hs-home aria-label="Urwin Homeschool home"><svg class="hs-home-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 3.2 2.8 11.2a1 1 0 0 0 1.3 1.52L5.2 11.7V20a1 1 0 0 0 1 1h4.3v-5.5h3V21h4.3a1 1 0 0 0 1-1v-8.3l1.1 1.02A1 1 0 1 0 21.2 11L12 3.2z"/></svg><span class="hs-home-label">Home</span></a><a class="back" href="../">&#8249; Parents</a></div>
<div class="hdr"><img src="../../urwin-logo.png" srcset="../../urwin-logo.png 1x, ../../urwin-logo@2x.png 2x" alt="Urwin Homeschool" width="200" height="112">
<h1>Progress and Answers</h1><p class="sub">What Logan and Savannah turned in</p></div>
<div class="rule"></div>
<section id="lock" class="card lock">
<span class="kick">Password locked</span><h2>Parent passcode</h2>
<p>Enter the parent passcode to see submissions, the kids' answers and the correct answers.</p>
<form id="f" autocomplete="on"><input type="text" name="username" value="parent" autocomplete="username" hidden>
<label>Passcode<input id="pw" type="password" autocomplete="current-password" aria-label="Parent passcode" required></label>
<button id="go" type="submit">Unlock</button></form>
<p id="err" class="err" hidden></p>
</section>
<section id="app" hidden>
<div class="tbar"><button type="button" id="refresh" class="ghost">Refresh</button><button type="button" id="lockbtn" class="ghost">Lock</button><span id="asof" class="asof"></span></div>
<div id="totals" class="totals"></div>
<div id="detail" class="answers">
<div id="picker" data-testid="picker"></div>
<div id="review" data-testid="review" hidden></div>
</div>
<div id="gridcard" class="card"><h2>Lesson grid</h2><div class="gridwrap"><table id="grid" class="pgrid"></table></div></div>
</section>
</main><script src="progress.js?v=6"></script><script src="../../hs-home.js?v=1" defer></script>
