<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pumpkin Quest">
<meta name="theme-color" content="#140b24">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="pumpkin-icon-180.png">
<link rel="icon" href="pumpkin-icon-180.png">
<title>Pumpkin Patch Quest</title>
<style>
:root{
  --text:#eef1ff; --muted:#aab2da; --line:rgba(255,255,255,.14);
  --card:rgba(34,20,58,.66); --card2:rgba(255,255,255,.06);
  --green:#5ef0a0; --orange:#ff9a4a; --violet:#b69cff; --gold:#ffd166; --pink:#ff86bd; --sky:#7cc8ff;
  --accent:var(--orange); --accent-ink:#3a1600;
  --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --cursive: "Snell Roundhand", "Apple Chancery", "Dancing Script", "Brush Script MT", "Segoe Script", cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#140b24;overscroll-behavior:none}
html{touch-action:manipulation}
button,a,[data-k],.pumpkin,.basket,.w{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:var(--font);color:var(--text);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden;-webkit-text-size-adjust:100%}
body.kid-savannah{--accent:var(--violet);--accent-ink:#1c0f45}
button{font-family:inherit;color:inherit}
textarea{-webkit-user-select:text;user-select:text}

/* ---------- background ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(ellipse 90% 50% at 50% 105%,rgba(255,140,60,.32) 0%,transparent 60%),
             linear-gradient(180deg,#0d0820 0%,#1b1036 40%,#2c1840 75%,#43203f 100%)}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.95}}
#moon{position:absolute;top:5%;right:7%;opacity:.22;transition:opacity .6s;width:min(13vw,96px);height:min(13vw,96px);border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fffdf0 0%,#f6e7b8 55%,#dcc68a 100%);box-shadow:0 0 70px 14px rgba(255,236,170,.22)}
body.home #moon{opacity:1}
#moon::after{content:"";position:absolute;width:22%;height:22%;left:55%;top:52%;border-radius:50%;background:rgba(180,150,90,.25)}
.bat{position:absolute;left:-12%;width:54px;opacity:0;animation:batfly 16s linear infinite}
.bat svg{width:100%;display:block;animation:flap .35s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes batfly{0%{opacity:0;transform:translate(0,0)}3%{opacity:.85}45%{transform:translate(60vw,-6vh)}55%{opacity:.85}60%{opacity:0;transform:translate(125vw,4vh)}100%{opacity:0;transform:translate(125vw,4vh)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
#land{position:absolute;left:0;right:0;bottom:0;width:100%;height:26vh;min-height:130px}

#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.screen{display:flex;flex-direction:column;gap:16px;flex:1;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.btn{appearance:none;border:0;font-weight:800;font-size:20px;color:var(--accent-ink);background:var(--accent);border-radius:18px;
  padding:14px 24px;min-height:58px;min-width:58px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.28),0 10px 22px rgba(0,0,0,.25);
  transition:transform .08s,box-shadow .08s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn.ghost{background:rgba(52,32,84,.92);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:17px;min-height:48px;padding:10px 16px;border-radius:14px}
.btn.gold{background:var(--gold);color:#3a2600}
.btn[disabled]{opacity:.38;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}.row.center{justify-content:center}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
  background:rgba(255,209,102,.16);color:var(--gold);border:1px solid rgba(255,209,102,.35);vertical-align:middle}
.tag.req{background:rgba(94,240,160,.12);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.iconbtn{appearance:none;border:1px solid var(--line);background:rgba(52,32,84,.92);border-radius:14px;width:52px;height:52px;font-size:24px;cursor:pointer}
h1,h2,h3{margin:0}
.stars{color:var(--gold);letter-spacing:2px}
.stars .off{color:rgba(255,255,255,.18)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:50;pointer-events:none;
  background:rgba(14,20,52,.94);border:1px solid var(--line);color:var(--text);font-weight:800;font-size:22px;padding:14px 26px;border-radius:999px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);transition:transform .25s ease;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.good{border-color:var(--green);color:var(--green)}
#toast.nudge{border-color:var(--gold);color:var(--gold)}

/* ---------- start ---------- */
.topright{display:flex;justify-content:flex-end;gap:10px}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:-6px}
.hero-art{width:min(300px,62vw)}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h1{font-size:clamp(40px,7vw,68px);font-weight:900;letter-spacing:-.02em;line-height:1;
  background:linear-gradient(90deg,#ffb35c,#ffe08a 50%,#d6a6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,150,60,.3))}
.lede{max-width:640px;font-size:clamp(17px,2.2vw,20px);line-height:1.45;color:#d5dbff;margin:4px 0 0}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:8px}
.kidcard{appearance:none;text-align:left;cursor:pointer;border-radius:28px;padding:22px;border:1px solid var(--line);color:var(--text);
  display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:18px;row-gap:6px;align-items:center;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 40px rgba(0,0,0,.3);transition:transform .1s}
.kidcard:active{transform:scale(.98)}
.kidcard.logan{background:linear-gradient(140deg,rgba(255,154,74,.26),rgba(30,18,52,.75) 60%)}
.kidcard.savannah{background:linear-gradient(140deg,rgba(182,156,255,.26),rgba(30,18,52,.75) 60%)}
.kc-avatar{grid-row:1/4;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:900;color:#0a0f24}
.logan .kc-avatar{background:radial-gradient(circle at 35% 30%,#ffd9b0,#f07f2a);box-shadow:0 0 0 4px rgba(255,154,74,.25),0 0 30px rgba(255,154,74,.35)}
.savannah .kc-avatar{background:radial-gradient(circle at 35% 30%,#ece4ff,#8f6cf5);box-shadow:0 0 0 4px rgba(182,156,255,.25),0 0 30px rgba(182,156,255,.35)}
.kc-name{font-size:30px;font-weight:900}
.kc-sub{font-size:16px;color:var(--muted);font-weight:600}
.kc-meta{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-size:16px;color:#dfe4ff}
.kc-meta .stars{letter-spacing:0}
.parent-row{display:flex;justify-content:center;margin-top:auto;padding-top:18px}
.hold{position:relative;overflow:hidden;appearance:none;border:1px solid var(--line);background:rgba(10,14,40,.6);color:var(--muted);
  border-radius:999px;padding:12px 22px;min-height:50px;font-size:15px;font-weight:700;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,209,102,.3)}
.hold.holding .fill{width:100%;transition:width 2s linear}
.hold .lbl{position:relative}

/* ---------- hub ---------- */
.hubhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hubhead .who{display:flex;align-items:center;gap:14px;flex:1;min-width:220px}
.hubhead .kc-avatar{width:62px;height:62px;font-size:30px;grid-row:auto}
.hubhead h2{font-size:30px;font-weight:900}
.hubhead .sub{color:var(--muted);font-weight:700}
.repair{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:20px;align-items:center}
.repair h3{font-size:22px;margin-bottom:6px}
.pbar{height:16px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .6s}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:15px;font-weight:700;padding:7px 12px;border-radius:999px;border:1px dashed rgba(255,255,255,.25);color:var(--muted)}
.chip.on{border-style:solid;border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.sect{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.sect h3{font-size:24px;font-weight:900}
.sect p{margin:0;color:var(--muted);font-weight:600;flex-basis:100%}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{appearance:none;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:flex-start;position:relative;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;min-height:120px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .1s}
.mcard:active{transform:scale(.98)}
.mcard.done{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.mcard.locked{opacity:.5}
.mcard.adv{background:linear-gradient(140deg,rgba(255,209,102,.10),var(--card) 55%)}
.mc-icon{font-size:34px;width:58px;height:58px;flex:none;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.mc-title{font-size:20px;font-weight:900;margin-bottom:4px}
.mc-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:14px;background:var(--accent);color:var(--accent-ink);margin-right:8px;vertical-align:2px}
.mc-blurb{font-size:16px;color:#cfd5f7;line-height:1.35}
.mc-stars{margin-top:8px;font-size:20px}
.mc-check{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);font-weight:800;font-size:15px}
.badge .bi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,209,102,.2);font-size:19px}
.badge.lockedb{opacity:.35;filter:grayscale(1)}

/* ---------- mission ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mtitle{font-size:22px;font-weight:900;flex:1;min-width:200px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;min-width:170px}
.prog .pbar{width:130px;margin:0;height:12px}
.prog .count{font-weight:800;color:var(--muted);min-width:44px}
.stage{flex:1;display:flex;flex-direction:column;gap:16px}
.qwrap{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-aspect-ratio:5/4) and (min-width:800px){
  .qwrap{grid-template-columns:1.2fr 1fr}
  .qwrap.wide{grid-template-columns:1fr}
}
.qpanel{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.qlabel{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.prompt{font-size:clamp(20px,2.6vw,25px);line-height:1.4;font-weight:700;margin:0;max-width:640px}
.bigq{font-size:clamp(54px,9vw,84px);font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.ans{min-width:150px;min-height:78px;padding:6px 18px;border-radius:18px;border:3px dashed color-mix(in srgb,var(--accent) 60%,transparent);
  font-size:52px;font-weight:900;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.18)}
.ans.ok,.slot.ok{border-style:solid;border-color:var(--green);color:var(--green);background:rgba(94,240,160,.1)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hint{display:none;font-size:20px;line-height:1.45;font-weight:600;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);color:#ffe9b0;
  border-radius:16px;padding:12px 16px;max-width:600px;text-align:left}
.hint.show{display:block;animation:fadein .3s}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;margin:0 auto}
.key{appearance:none;border:1px solid var(--line);background:rgba(56,34,88,.92);border-radius:18px;font-size:32px;font-weight:800;
  height:clamp(60px,9.4vh,82px);cursor:pointer;transition:transform .06s,background .1s}
.key:active{transform:scale(.95);background:rgba(70,80,150,.95)}
.key.fn{font-size:26px;color:var(--muted)}
.key.go{background:var(--accent);color:var(--accent-ink);font-size:22px;border:0}
.choices{display:grid;grid-template-columns:1fr;gap:12px}
.choice{appearance:none;border:1px solid var(--line);background:rgba(56,34,88,.92);border-radius:18px;font-size:22px;font-weight:800;
  min-height:68px;padding:12px 18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px}
.choice:active{transform:scale(.98)}
.choice.right{background:rgba(94,240,160,.18);border-color:var(--green)}
.choice.dim{opacity:.35}

/* vertical math */
.vert{display:grid;grid-template-columns:auto auto;column-gap:16px;font-size:clamp(54px,8.5vw,78px);font-weight:900;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:.12em;justify-content:center;align-items:center}
.vert .num{text-align:right}
.vert .op{color:var(--accent)}
.vert .vline{grid-column:1/-1;height:6px;border-radius:3px;background:var(--text);margin:6px 0}
.vert .slot{min-height:1.15em;min-width:3.2ch;border:3px dashed color-mix(in srgb,var(--accent) 60%,transparent);border-radius:14px;padding:0 8px}

/* shop */
.snack{display:flex;align-items:center;gap:16px;justify-content:center}
.snack .em{font-size:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.pricetag{font-size:32px;font-weight:900;background:var(--gold);color:#3a2600;padding:6px 16px;border-radius:12px;transform:rotate(-3deg)}
.tray{width:100%;min-height:96px;border-radius:18px;border:2px dashed rgba(255,255,255,.22);background:rgba(0,0,0,.2);padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;justify-content:center}
.tray .empty{color:var(--muted);font-weight:700;align-self:center;font-size:17px}
.wallet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mbtn{appearance:none;border:1px solid var(--line);background:rgba(56,34,88,.92);border-radius:18px;min-height:96px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:16px;padding:8px}
.mbtn:active{transform:scale(.95)}
.coin{border-radius:50%;display:grid;place-items:center;font-weight:900;color:#1e1e1e;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 0 0 3px rgba(255,255,255,.25)}
.coin.penny{width:46px;height:46px;background:radial-gradient(circle at 35% 30%,#f2b48a,#b8673b);font-size:15px}
.coin.nickel{width:52px;height:52px;background:radial-gradient(circle at 35% 30%,#f4f6fa,#a6adb9);font-size:15px}
.coin.dime{width:42px;height:42px;background:radial-gradient(circle at 35% 30%,#f7f8fb,#b4bac6);font-size:14px}
.coin.quarter{width:58px;height:58px;background:radial-gradient(circle at 35% 30%,#f7f8fb,#9aa2b0);font-size:16px}
.bill{width:84px;height:44px;border-radius:7px;background:linear-gradient(135deg,#bfe8c0,#7cc28a);color:#14361b;display:grid;place-items:center;
  font-weight:900;font-size:20px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 0 0 6px rgba(20,54,27,.25)}
.bill.five{background:linear-gradient(135deg,#d8e7c0,#a3c27c)}
.tray .coin,.tray .bill{cursor:pointer;animation:pop .2s}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}

/* skip counting */
.cells{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cell{position:relative;min-width:92px;height:118px;border-radius:16px;display:grid;place-items:center;font-size:38px;font-weight:900;
  background:linear-gradient(180deg,rgba(255,170,70,.38),rgba(255,120,40,.10));border:2px solid rgba(255,170,70,.75);font-variant-numeric:tabular-nums;padding:0 8px;box-shadow:0 0 22px rgba(255,150,60,.25)}
.cell::before{content:"";position:absolute;top:-10px;left:50%;width:30px;height:10px;transform:translateX(-50%);border-radius:5px 5px 0 0;background:#3a2a1a}
.cell.blank{background:rgba(0,0,0,.25);border:3px dashed rgba(255,255,255,.35);cursor:pointer}
.cell.blank::before{background:rgba(255,255,255,.3)}
.cell.active{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,209,102,.25),0 0 24px rgba(255,209,102,.35)}
.cell.filled{border-style:solid;border-color:var(--green);background:rgba(94,240,160,.2)}

/* pumpkins */
.patch{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.pumpkin{appearance:none;border:0;background:rgba(255,255,255,.05);border-radius:20px;padding:8px;cursor:pointer;transition:transform .15s,opacity .3s;min-height:96px}
.pumpkin svg{width:100%;max-width:110px;height:auto;display:block;margin:0 auto}
.pumpkin.sel{background:rgba(255,209,102,.18);box-shadow:0 0 0 3px var(--gold);transform:scale(1.05)}
.pumpkin.gone{opacity:0;pointer-events:none;transform:scale(.6)}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.basket{appearance:none;cursor:pointer;border-radius:24px;border:2px solid var(--line);background:rgba(255,255,255,.07);min-height:150px;padding:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.basket .bl{font-size:30px;font-weight:900;letter-spacing:.08em}
.basket .bc{font-size:22px;letter-spacing:2px;min-height:30px}
.basket.even{border-color:rgba(124,200,255,.55);background:linear-gradient(180deg,rgba(40,70,130,.95),rgba(24,34,80,.95))}
.basket.odd{border-color:rgba(255,134,189,.55);background:linear-gradient(180deg,rgba(110,44,96,.95),rgba(40,26,78,.95))}
.basket:active{transform:scale(.98)}

/* reading */
.story{font-size:clamp(28px,3.6vw,36px);line-height:1.6;font-weight:700;text-align:left;max-width:760px;margin:0 auto}
.story .w{padding:0 2px;border-radius:8px;cursor:pointer}
.story .w.said{background:rgba(255,209,102,.3)}
.pagepic{font-size:64px;text-align:center;letter-spacing:8px}
.pagedots{display:flex;gap:8px;justify-content:center}
.pagedots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2)}
.pagedots i.on{background:var(--accent)}

/* multiplication dots */
.dots{display:inline-grid;gap:6px;padding:12px;border-radius:14px;background:rgba(0,0,0,.2);margin-top:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--violet);display:block}
.dots i.g{margin-left:8px}
.gauge{width:100%;max-width:420px;height:20px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink),var(--gold));transition:width .5s}

/* writing */
.paper{position:relative;width:100%;height:clamp(240px,42vh,380px);border-radius:22px;background:#fbf7ee;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 14px 30px rgba(0,0,0,.3);touch-action:none}
.paper.tall{height:clamp(280px,46vh,420px)}
.paper canvas{position:absolute;inset:0;touch-action:none}
.model{font-family:var(--cursive);font-size:clamp(34px,5vw,50px);color:#fff;text-align:center;line-height:1.3;padding:6px 10px}
.wtools{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
textarea.log{width:100%;min-height:230px;border-radius:18px;border:1px solid var(--line);background:rgba(6,10,30,.6);color:var(--text);
  font:600 20px/1.55 var(--font);padding:16px;resize:vertical;outline:none}
textarea.log:focus{border-color:var(--accent)}
.counter{font-weight:800;color:var(--muted)}
.counter.ok{color:var(--green)}
details.saved{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:8px}
details.saved summary{font-weight:800;cursor:pointer;min-height:36px;display:flex;align-items:center}
details.saved p{white-space:pre-wrap;line-height:1.5;-webkit-user-select:text;user-select:text}
.switch{display:flex;align-items:center;gap:14px;font-weight:800;font-size:20px;cursor:pointer;background:none;border:0;padding:8px 0;min-height:56px;text-align:left}
.switch .tr{width:66px;height:38px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex:none}
.switch .tr::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on .tr{background:var(--accent)}
.switch.on .tr::after{left:32px}
.timer{font-weight:900;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}

/* results */
.results{align-items:center;text-align:center;justify-content:center}
.results .bigstars{font-size:72px;letter-spacing:8px}
.results .bigstars span{display:inline-block;animation:starin .5s backwards}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.results h2{font-size:clamp(36px,5vw,48px);font-weight:900}
.results .lines{font-size:20px;line-height:1.6;max-width:640px}
.unlock{background:linear-gradient(120deg,rgba(255,209,102,.18),rgba(94,240,160,.14));border:1px solid rgba(255,209,102,.5);border-radius:20px;padding:16px 20px;font-weight:700;font-size:19px;max-width:640px}
.confetti{position:fixed;top:-40px;z-index:40;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* parent */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,5,16,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:auto;padding:max(18px,env(safe-area-inset-top)) 16px 30px}
.overlay .inner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
table.pt{width:100%;border-collapse:collapse;font-size:16px}
table.pt td,table.pt th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.pt th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.btn.danger{background:#ff8a8a;color:#3a0b0b}
.guide{width:86px;flex:none}
.speech{display:flex;gap:14px;align-items:center}
.speech .bubble{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:700;font-size:18px;line-height:1.4}
@media (max-width:640px){
  .repair{grid-template-columns:1fr}
  .patch{grid-template-columns:repeat(4,1fr)}
  .wallet{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function progressOf(k){ var s=load(k), M=MISSIONS[k], stars=0, std=0, adv=0;

/* Number answer with a keypad. opts: html, answer, hints[], maxLen, label */
function askNumber(ctx,opts,done){
  var w=el('<div class="qwrap"><div class="card qpanel">'+(opts.label?'<div class="qlabel">'+opts.label+'</div>':'')+opts.html+
    '<div class="ansrow"><div class="ans"><span class="val"></span></div></div><div class="hint"></div></div><div class="apanel"></div></div>');

  $('.apanel',w).appendChild(numpadEl(function(k){
    if(locked) return;
    if(k==='del'){ val=val.slice(0,-1); upd(); return; }
    if(k==='ok'){ if(!val){ toast('Tap the numbers to type an answer'); return; } check(); return; }
    if(val.length<maxLen){ val+=k; upd(); }
  }));
  function check(){
    if(parseInt(val,10)===opts.answer){ locked=true; box.classList.add('ok'); sfx.good(); toast(pick(PRAISE),'good'); ctx.record(tries===0); setTimeout(done,1000); }
    else{ tries++; sfx.soft(); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      var hs=opts.hints||[]; hintEl.innerHTML='💡 '+(tries<=hs.length?hs[tries-1]:revealText(opts.answer)); hintEl.classList.add('show');
      toast(pick(NUDGE),'nudge'); val=''; upd(); }
  }

var SNACKS=[['Caramel Apple','🍎'],['Candy Corn Bag','🍬'],['Pumpkin Bread','🍞'],['Lollipop','🍭'],['Kettle Corn','🍿'],['Apple Cider','🧃'],['Pumpkin Pie Slice','🥧'],['Cider Donut','🍩'],['Hot Cocoa','☕'],['Ghost Cookie','🍪'],['Pumpkin Muffin','🧁'],['Soft Pretzel','🥨']];

function moneyBits(d){ return d.v>=100 ? '<div class="'+d.k+'">'+d.lab+'</div>' : '<div class="'+d.k+'">'+d.lab+'</div>'; }
function breakdown(c,denoms){ var out=[]; denoms.slice().sort(function(a,b){return b.v-a.v;}).forEach(function(d){ var n=Math.floor(c/d.v); if(n){ c-=n*d.v; out.push(n+' '+(d.v>=100?d.name+(n>1?'s':''):(n>1?(d.name==='penny'?'pennies':d.name+'s'):d.name))); } }); return out.join(', '); }

function runShop(ctx,adv){
  var types = adv ? ['ch5','ch5','ch5','ch10','ch10'] : shuffle(['pay','pay','change','change','dollars','dollars']);
  var used=shuffle(SNACKS);
  series(ctx,types.length,function(i,done){
    var t=types[i], sn=used[i%used.length], price, paid=0, target, prompt, denoms;
    if(t==='pay'){ price=rand(11,99); target=price; denoms=DENOMS.slice(0,4); prompt='Midnight the cat wants a <b>'+sn[0]+'</b>. Tap coins to pay exactly <b>'+money(price)+'</b>.'; }
    else if(t==='change'){ price=5*rand(3,19); paid=100; target=paid-price; denoms=DENOMS.slice(0,4); prompt='Hazel buys a <b>'+sn[0]+'</b> for <b>'+money(price)+'</b> and pays with a <b>$1 bill</b>. Tap coins to give Hazel the change.'; }
    else if(t==='dollars'){ price=100*rand(1,3)+5*rand(1,19); target=price; denoms=DENOMS.slice(0,5); prompt='A <b>'+sn[0]+'</b> costs <b>'+money(price)+'</b>. Tap bills and coins to pay exactly.'; }
    else { paid=t==='ch5'?500:1000; price=t==='ch5'?rand(101,489):rand(512,949); target=paid-price; denoms=DENOMS.slice(0,6);
      prompt='The Trading Post sells a <b>'+sn[0]+'</b> for <b>'+money(price)+'</b>. Boo the ghost pays with a <b>'+money(paid).replace('.00','')+' bill</b>. Give Boo the exact change.'; }
    T.answer=target; T.denoms=denoms.map(function(d){return d.v;});
    var tray=[], tries=0, locked=false;
    var w=el('<div class="qwrap"><div class="card qpanel"><div class="qlabel">'+(paid?'Make change':'Pay the shopkeeper')+'</div>'+
      '<div class="snack"><span class="em">'+sn[1]+'</span><span class="pricetag">'+money(price)+'</span></div><p class="prompt">'+prompt+'</p>'+
      '<div class="tray" aria-label="Your tray"></div><div class="hint"></div></div>'+
      '<div><div class="wallet"></div><div class="row center" style="margin-top:14px"><button class="btn ghost" data-act="clear">Clear tray</button><button class="btn" data-act="check">Check</button></div></div></div>');
    var trayEl=$('.tray',w), hintEl=$('.hint',w);

      tray.forEach(function(d,idx){ var m=el(moneyBits(d)); m.addEventListener('click',function(){ if(locked) return; tray.splice(idx,1); sfx.tap(); drawTray(); }); trayEl.appendChild(m); }); }
    denoms.forEach(function(d){ var b=el('<button class="mbtn" data-v="'+d.v+'">'+moneyBits(d)+'<span>'+d.name+'</span></button>');
      b.addEventListener('click',function(){ if(locked) return; if(tray.length>=30){ toast('The tray is full'); return; } sfx.tap(); tray.push(d); drawTray(); }); $('.wallet',w).appendChild(b); });
    $('[data-act=clear]',w).addEventListener('click',function(){ if(locked) return; tray=[]; drawTray(); hintEl.classList.remove('show'); });
    $('[data-act=check]',w).addEventListener('click',function(){ if(locked) return;
      var total=tray.reduce(function(a,d){return a+d.v;},0);
      if(!tray.length){ toast('Tap some money first'); return; }
      if(total===target){ locked=true; trayEl.style.borderColor='var(--green)'; sfx.good(); toast(pick(PRAISE),'good'); ctx.record(tries===0); setTimeout(done,1100); return; }
      tries++; sfx.soft(); toast(pick(NUDGE),'nudge');

                          : 'You put in <b>'+money(total)+'</b>. That is <b>'+money(total-target)+'</b> too much. Tap money in the tray to take some back.';
      if(paid && tries===1) h+='<br>Change means: '+money(paid)+' minus '+money(price)+'. Count up from '+money(price)+' to '+money(paid)+'.';
      if(tries>=2) h+='<br>One way: '+breakdown(target,denoms)+'.';

function makePad(holder,opts){

      c.setLineDash([]); c.lineWidth=2; c.strokeStyle='rgba(84,120,200,.55)'; line(top); line(base);
      c.setLineDash([10,9]); c.lineWidth=1.6; c.strokeStyle='rgba(230,90,140,.5)'; line(mid);

    var font=function(sz){ return sz+'px "Snell Roundhand","Apple Chancery","Dancing Script","Brush Script MT","Segoe Script",cursive'; };
    c.font=font(size); var mw=c.measureText(guide).width; if(mw>W*.9){ size=size*W*.9/mw; c.font=font(size); mw=c.measureText(guide).width; }
    c.textAlign='center'; c.textBaseline='alphabetic';
    c.fillStyle='rgba(90,70,160,.13)'; c.fillText(guide,W/2,base);
    c.setLineDash([2,5]); c.lineWidth=Math.max(1.6,size/45); c.strokeStyle='rgba(90,70,160,.6)'; c.strokeText(guide,W/2,base); c.setLineDash([]); }

function runTrace(ctx){
  var groups=shuffle(['a  c  d','e  l  b','m  n  u','o  w  v','g  q  y','t  i  r','h  k  f']).slice(0,2);
  var words=shuffle(['pumpkin','ghost','witch','broom','cider','harvest','lantern','autumn','candy','acorn','maple','cauldron','owl','hayride','cozy','moonlight']).slice(0,4);
  var items=groups.concat(words), idx=0, traced=0, tracedThis=false;
  var w=el('<div class="qwrap wide"><div class="card qpanel" style="align-items:stretch"><div class="row"><div class="qlabel" style="flex:1;text-align:left">Trace the dotted cursive</div><span class="counter"></span></div>'+
    '<p class="prompt" style="text-align:left;max-width:none">Use your finger or Apple Pencil to trace over the dotted letters. Take your time and enjoy the curves.</p><div class="padhold"></div>'+
    '<div class="wtools"><button class="btn ghost" data-act="clear">Clear</button><div class="row"><button class="btn ghost" data-act="done">Done</button><button class="btn" data-act="next">Next ›</button></div></div></div></div>');
  var pad=makePad($('.padhold',w),{guide:items[0],lines:1,onStroke:function(){ tracedThis=true; }});
  function upd(){ $('.counter',w).textContent=(idx+1)+' of '+items.length; ctx.progress(idx,items.length); $('[data-act=next]',w).textContent=idx===items.length-1?'Finish ›':'Next ›'; }
  function finish(){ var n=traced; ctx.finish({stars:3, summary:'You traced '+n+' cursive '+(n===1?'item':'items')+'. '+pick(INK_PRAISE)}); }
  $('[data-act=clear]',w).addEventListener('click',function(){ sfx.tap(); pad.clear(); tracedThis=false; });
  $('[data-act=next]',w).addEventListener('click',function(){
    if(!pad.count()){ toast('Give it a try first. Trace the dotted letters.'); return; }
    traced++; tracedThis=false; sfx.good(); toast(pick(INK_PRAISE),'good');
    if(idx>=items.length-1){ setTimeout(finish,600); return; }
    idx++; pad.setGuide(items[idx]); upd(); });
  $('[data-act=done]',w).addEventListener('click',function(){ if(pad.count()) traced++; if(!traced){ toast('Trace at least one, then tap Done.'); return; } finish(); });
  upd(); ctx.stage.replaceChildren(w);
}

var SENTENCES=['The moon glows over the pumpkin patch.','Hazel flew home on her broom.','Pumpkins shine in the cool fall night.','A black cat naps on the porch swing.','A friendly ghost hums a quiet song.','Bats swoop over the old red barn.'];
function runCopy(ctx){
  var list=shuffle(SENTENCES).slice(0,3), idx=0, copied=0;
  var w=el('<div class="qwrap wide"><div class="card qpanel" style="align-items:stretch"><div class="row"><div class="qlabel" style="flex:1;text-align:left">Copy the sentence in cursive</div><span class="counter"></span></div>'+
    '<div class="model"></div><div class="padhold"></div>'+
    '<div class="wtools"><button class="btn ghost" data-act="clear">Clear</button><div class="row"><button class="btn ghost" data-act="done">Done</button><button class="btn" data-act="next">Next sentence ›</button></div></div></div></div>');
  var pad=makePad($('.padhold',w),{lines:2,tall:true});
  function upd(){ $('.model',w).textContent=list[idx]; $('.counter',w).textContent=(idx+1)+' of '+list.length; ctx.progress(idx,list.length); $('[data-act=next]',w).textContent=idx===list.length-1?'Finish ›':'Next sentence ›'; }
  function finish(){ ctx.finish({stars:3, summary:'You copied '+copied+' sentence'+(copied===1?'':'s')+' in cursive. '+pick(INK_PRAISE)}); }
  $('[data-act=clear]',w).addEventListener('click',function(){ sfx.tap(); pad.clear(); });
  $('[data-act=next]',w).addEventListener('click',function(){ if(!pad.count()){ toast('Write the sentence on the lines first.'); return; }
    copied++; sfx.good(); toast(pick(INK_PRAISE),'good'); if(idx>=list.length-1){ setTimeout(finish,600); return; } idx++; pad.clear(); upd(); });
  $('[data-act=done]',w).addEventListener('click',function(){ if(pad.count()) copied++; if(!copied){ toast('Write one sentence, then tap Done.'); return; } finish(); });
  upd(); ctx.stage.replaceChildren(w);
}

var PROMPTS=[
 'Hazel\u2019s spellbook has a blank page called \u201cThe Night the Pumpkins Glowed.\u201d Write that story. What did you see, hear, and smell?',
 'A friendly ghost has lived in the old farmhouse for 100 years. Write the story of the night you first met and what you talked about.',
 'Hazel\u2019s broom refuses to fly on the night of the Harvest Festival. Write the story of how the problem gets solved.',
 'Midnight the black cat wanders into the corn maze and finds something no one expected. Write the story from Midnight\u2019s point of view.',
 'Write the story of the best Harvest Festival ever: the hayride, the treats, the costumes, and one surprise.',
 'A family of bats asks Hazel for help getting ready for winter. Write the spellbook page that tells what happened.'
];
function countSentences(t){ return t.split(/[.!?]+(?:["\u201d\u2019')\]]*)(?:\s+|$)/).filter(function(x){ return x.trim().split(/\s+/).filter(Boolean).length>=2; }).length; }
function runLog(ctx){
  var s=load('savannah'), MIN=3;
  var pi = s.draftPrompt!=null ? s.draftPrompt : rand(0,PROMPTS.length-1);
  var w=el('<div class="qwrap wide"><div class="card qpanel" style="align-items:stretch;text-align:left"><div class="qlabel">Spellbook story prompt</div>'+
    '<div class="speech">'+guideSvg()+'<div class="bubble prm"></div></div>'+
    '<div class="row"><button class="btn ghost small" data-act="newp">↻ Different prompt</button></div>'+
    '<textarea class="log" placeholder="Once upon a crisp fall night... Write at least '+MIN+' sentences." autocapitalize="sentences" spellcheck="true"></textarea>'+
    '<div class="wtools"><span class="counter"></span><div class="row"><button class="btn ghost" data-act="copy">Copy text</button><button class="btn ghost" data-act="save">Save story</button><button class="btn" data-act="finish" disabled>Finish story ›</button></div></div>'+
    '<div class="savedlist"></div></div></div>');
  var ta=$('textarea',w), cnt=$('.counter',w), fin=$('[data-act=finish]',w), lastSaved=null;
  ta.value=s.draft||'';
  function setPrompt(){ $('.prm',w).textContent=PROMPTS[pi]; }
  function upd(){ var n=countSentences(ta.value), words=ta.value.split(/\s+/).filter(Boolean).length;
    cnt.textContent='Sentences: '+n+' of '+MIN+' · Words: '+words; cnt.classList.toggle('ok',n>=MIN); fin.disabled=n<MIN;
    s.draft=ta.value; s.draftPrompt=pi; save('savannah'); }
  function savedList(){ var L=$('.savedlist',w); L.innerHTML= s.logs.length?'<div class="qlabel" style="margin-top:6px">Saved stories</div>':'';
    s.logs.slice(-5).reverse().forEach(function(l){ L.appendChild(el('<details class="saved"><summary>'+new Date(l.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+esc(l.text.slice(0,40))+'...</summary><p>'+esc(l.text)+'</p></details>')); }); }
  function doSave(){ var t=ta.value.trim(); if(!t){ toast('Write something first'); return false; } if(t===lastSaved) return true;
    s.logs.push({t:Date.now(), prompt:PROMPTS[pi], text:t}); if(s.logs.length>40) s.logs.shift(); lastSaved=t; save('savannah'); savedList(); return true; }
  ta.addEventListener('input',upd);
  $('[data-act=newp]',w).addEventListener('click',function(){ sfx.tap(); var o=pi; while(pi===o) pi=rand(0,PROMPTS.length-1); setPrompt(); upd(); });
  $('[data-act=save]',w).addEventListener('click',function(){ if(doSave()){ sfx.good(); toast('Story saved in the spellbook','good'); } });
  $('[data-act=copy]',w).addEventListener('click',function(){ if(!ta.value.trim()){ toast('Write something first'); return; } copyText(ta.value).then(function(ok){ toast(ok?'Copied! Paste it anywhere.':'Press and hold the text to copy it', ok?'good':''); }); });
  fin.addEventListener('click',function(){ if(countSentences(ta.value)<MIN) return; doSave(); var words=ta.value.split(/\s+/).filter(Boolean).length;
    s.draft=''; s.draftPrompt=null; save('savannah'); ctx.finish({stars:3, summary:'Your '+words+'-word spellbook story is saved. What a story!'}); });
  setPrompt(); upd(); savedList(); ctx.progress(0,1); $('.prog .count',ctx.view).textContent='';
  ctx.stage.replaceChildren(w);
}

/* ================= go ================= */
T.go={start:renderStart, hub:renderHub, mission:function(k,id){ var f=findMission(k,id); startMission(k,f[0],f[1]); }};
renderStart();
})();
</script>
<script>
/* Stop iPad and iPhone zoom: no pinch, no double-tap zoom. Rapid taps on buttons still count. Text boxes keep their normal behavior. */
(function(){var nf={passive:false},last=0,sx=0,sy=0,moved=false;
  function el(t){return t&&t.closest?t:(t&&t.parentElement)||null;}
  function typing(t){t=el(t);return !!(t&&t.closest('textarea,input,select,[contenteditable="true"]'));}
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},nf);});
  document.addEventListener('dblclick',function(e){if(!typing(e.target))e.preventDefault();},nf);
  document.addEventListener('touchstart',function(e){var t=e.touches[0];if(t){sx=t.clientX;sy=t.clientY;}moved=false;if(e.touches.length>1)e.preventDefault();},nf);
  document.addEventListener('touchmove',function(e){var t=e.touches[0];if(t&&Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy)>10)moved=true;if(e.touches.length>1)e.preventDefault();},nf);
  document.addEventListener('touchend',function(e){var now=Date.now();
    if(now-last<400&&!moved&&e.touches.length===0&&!typing(e.target)){e.preventDefault();var t=el(e.target);
      if(t&&!t.closest('canvas'))t.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));}
    last=now;},nf);
})();
</script>
