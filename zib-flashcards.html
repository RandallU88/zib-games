<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b1f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Zib's Flashcards</title>
<style>
:root{--text:#eef1ff;--muted:#aab2da;--line:rgba(255,255,255,.16);--green:#5ef0a0;--violet:#b69cff;--gold:#ffd166;--ink:#06210f;
  --font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#070b1f}
body{font-family:var(--font);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none;
  background:radial-gradient(ellipse 90% 45% at 50% 105%,rgba(255,140,80,.28),transparent 60%),linear-gradient(180deg,#050817,#0b1233 42%,#1d1745 78%,#33204d);background-attachment:fixed}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.st{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.95}}
.moon{position:fixed;top:5%;right:7%;width:min(14vw,80px);height:min(14vw,80px);border-radius:50%;z-index:0;background:radial-gradient(circle at 36% 34%,#fffdf0,#f6e7b8 55%,#dcc68a);box-shadow:0 0 60px 12px rgba(255,236,170,.2)}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(32px,6vw,52px);font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,#ffe08a,#ffab6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:#d5dbff;font-weight:600;line-height:1.4;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;font:inherit;font-weight:800;font-size:18px;min-height:56px;padding:12px 18px;border-radius:16px;cursor:pointer;color:var(--ink);background:var(--gold);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:rgba(32,40,90,.92);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.good{background:var(--green)}
.btn.soft{background:var(--violet);color:#1c0f45}
.btn.danger{background:#ff8a8a;color:#3a0b0b}
.btn[disabled]{opacity:.4;pointer-events:none}
.sect{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.deck{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:22px;padding:16px;border:1px solid var(--line);background:rgba(16,22,58,.84);min-height:110px}
.deck:active{transform:scale(.98)}
.deck b{display:block;font-size:20px;margin:4px 0}
.deck span{color:var(--muted);font-weight:700}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h2{flex:1;font-size:26px;font-weight:900;min-width:180px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(14,20,52,.85);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800}
.scene{perspective:1400px;width:100%;flex:1;min-height:240px}
.flip{width:100%;height:clamp(240px,42vh,380px);position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;
  background:linear-gradient(160deg,rgba(40,48,110,.95),rgba(16,22,58,.95));box-shadow:0 18px 40px rgba(0,0,0,.35)}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(70,48,20,.95),rgba(28,22,58,.95))}
.kicker{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.term{font-size:clamp(32px,6vw,56px);font-weight:900;line-height:1.15}
.hinttap{color:var(--muted);font-weight:700}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:720px){.controls{grid-template-columns:repeat(4,1fr)}}
.hold{position:relative;overflow:hidden;appearance:none;border:1px solid var(--line);background:rgba(10,14,40,.6);color:var(--muted);border-radius:999px;padding:12px 20px;min-height:50px;font-weight:700;cursor:pointer}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,209,102,.28)}
.hold.holding .fill{width:100%;transition:width 2s linear}
.hold .lbl{position:relative}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(3,5,16,.86);overflow:auto;padding:max(16px,env(safe-area-inset-top)) 14px 28px}
.inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.cardbox{background:rgba(16,22,58,.9);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
input,textarea{font:inherit;font-weight:650;font-size:18px;color:var(--text);background:rgba(6,10,30,.7);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;min-height:52px;-webkit-user-select:text;user-select:text}
textarea{min-height:120px}
label{font-weight:800;font-size:14px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
@media(max-width:640px){.pair{grid-template-columns:1fr}}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
.big{font-size:64px;font-weight:900}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:rgba(14,20,52,.95);border:1px solid var(--line);border-radius:999px;padding:12px 18px;font-weight:800;z-index:30;transition:transform .2s}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="sky"></div><div class="moon"></div>
<div id="app"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
function el(h){var t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'd'+Math.random().toString(36).slice(2,9);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var KEY='zibFlashcards.v1';
function loadCustom(){try{var s=JSON.parse(localStorage.getItem(KEY));return (s&&s.decks)||[];}catch(e){return [];}}
function saveCustom(decks){localStorage.setItem(KEY,JSON.stringify({decks:decks}));}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},1600);}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(function(){return true;},function(){return false;});return Promise.resolve(false);}
var sky=document.getElementById('sky');
for(var i=0;i<70;i++){var d=document.createElement('div');d.className='st';var z=Math.random()<.8?1:2;d.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*70)+'%;animation-delay:'+(Math.random()*4).toFixed(2)+'s';sky.appendChild(d);}

var C=function(t,d){return {term:t,def:d};};
var BUILTIN=[
 {id:'even',who:'Logan',title:'Even and odd',blurb:'Which numbers are even, and which are odd.',cards:[
  C('Is 8 even or odd?','Even. It ends in 8.'),C('Is 7 even or odd?','Odd. It ends in 7.'),
  C('Is 30 even or odd?','Even. It ends in 0.'),C('Is 45 even or odd?','Odd. It ends in 5.'),
  C('Is 14 even or odd?','Even. It ends in 4.'),C('Is 21 even or odd?','Odd. It ends in 1.'),
  C('Is 100 even or odd?','Even. It ends in 0.'),C('Is 9 even or odd?','Odd. It ends in 9.'),
  C('Even numbers end in...','0, 2, 4, 6, or 8.'),C('Odd numbers end in...','1, 3, 5, 7, or 9.')]},
 {id:'place',who:'Logan',title:'Place value words',blurb:'Ones, tens, hundreds, and what a digit is worth.',cards:[
  C('Ones place','The first digit from the right.'),C('Tens place','Groups of ten. The second digit from the right.'),
  C('Hundreds place','Groups of one hundred.'),C('What is a digit?','One number symbol, from 0 to 9.'),
  C('47','4 tens and 7 ones.'),C('305','3 hundreds, 0 tens, and 5 ones.'),
  C('The 6 in 62','It is worth 60, or 6 tens.'),C('The 4 in 405','It is worth 400, or 4 hundreds.'),
  C('10 ones','Make 1 ten.'),C('10 tens','Make 1 hundred.')]},
 {id:'coins',who:'Logan',title:'Coin values',blurb:'Pennies, nickels, dimes, quarters, and a dollar.',cards:[
  C('Penny','1 cent'),C('Nickel','5 cents'),C('Dime','10 cents'),C('Quarter','25 cents'),
  C('1 dollar bill','100 cents'),C('2 quarters','50 cents'),C('4 quarters','1 dollar, or 100 cents'),
  C('1 dime and 1 nickel','15 cents'),C('3 dimes','30 cents'),C('A quarter and a dime','35 cents')]},
 {id:'words',who:'Logan',title:'Space and harvest words',blurb:'Short words from Zib\'s desert stories.',cards:[
  C('alien','A being from another world.'),C('desert','Dry land with little rain.'),
  C('harvest','Picking crops when they are ripe.'),C('pumpkin','A round orange fall fruit.'),
  C('mesa','A hill with a flat top.'),C('orbit','The path a ship takes around a world.'),
  C('glow','To shine with a soft light.'),C('crater','A bowl shaped hole in the ground.'),
  C('fuel','What a ship uses so it can fly.'),C('saucer','Zib\'s round flying ship.')]},
 {id:'setb',who:'Savannah',title:'Set B facts',blurb:'The multiplication facts you are practicing. No division.',cards:[
  C('4 × 4','16'),C('4 × 5','20'),C('7 × 3','21'),C('7 × 4','28'),C('8 × 5','40'),C('8 × 7','56'),
  C('9 × 3','27'),C('9 × 4','36'),C('9 × 5','45'),C('5 × 4','20'),C('3 × 7','21'),C('4 × 7','28'),
  C('5 × 8','40'),C('7 × 8','56'),C('3 × 9','27'),C('4 × 9','36'),C('5 × 9','45')]},
 {id:'vocab',who:'Savannah',title:'Word lab',blurb:'Science and world words for a strong reader.',cards:[
  C('atmosphere','The layer of gases around a planet.'),C('gravity','The pull that keeps us on the ground.'),
  C('ecosystem','Living things and the place they share.'),C('predator','An animal that hunts other animals.'),
  C('prey','An animal that is hunted.'),C('hypothesis','A careful guess you can test.'),
  C('evidence','Facts that support an idea.'),C('continent','One of the big land areas of Earth.'),
  C('equator','The imaginary line around the middle of Earth.'),C('climate','The usual weather of a place over many years.'),
  C('constellation','A pattern of stars in the sky.'),C('orbit','A curved path around a planet or star.')]},
 {id:'states',who:'Savannah',title:'States and capitals',blurb:'A few states and the city where the leaders meet.',cards:[
  C('New Mexico','Santa Fe'),C('Ohio','Columbus'),C('Texas','Austin'),C('California','Sacramento'),
  C('New York','Albany'),C('Florida','Tallahassee'),C('Colorado','Denver'),C('Arizona','Phoenix'),
  C('Capital','The city where a state\'s leaders meet.'),C('Santa Fe is the capital of...','New Mexico')]}
];

var app=$('#app');
function home(){
  var custom=loadCustom();
  function cards(list){return list.map(function(d){return '<button class="deck" data-id="'+d.id+'"><span class="sect">'+esc(d.who||'My deck')+'</span><b>'+esc(d.title)+'</b><span>'+d.cards.length+' cards</span></button>';}).join('');}
  app.innerHTML='<div class="top"><a class="btn ghost" href="index.html">‹ Games</a></div><h1>Zib\'s Flashcards</h1><p class="lede">Tap a card to flip it. Mark Got it when you know it, or Study again to see it later.</p>'+
    '<div class="sect">Logan</div><div class="grid">'+cards(BUILTIN.filter(function(d){return d.who==='Logan';}))+'</div>'+
    '<div class="sect">Savannah</div><div class="grid">'+cards(BUILTIN.filter(function(d){return d.who==='Savannah';}))+'</div>'+
    (custom.length?'<div class="sect">My decks</div><div class="grid">'+cards(custom)+'</div>':'')+
    '<div class="row" style="justify-content:center;margin-top:8px"><button class="hold" id="hold"><span class="fill"></span><span class="lbl">Parents: press and hold 2 seconds</span></button></div>';
  [].forEach.call(app.querySelectorAll('.deck'),function(b){b.addEventListener('click',function(){var id=b.dataset.id;var d=findDeck(id);if(d)study(JSON.parse(JSON.stringify(d)));});});
  hold($('#hold'),parentHome);
}
function findDeck(id){var all=BUILTIN.concat(loadCustom());for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i];return null;}
function hold(btn,fn){var t=null;function start(e){e.preventDefault();btn.classList.add('holding');clearTimeout(t);t=setTimeout(function(){btn.classList.remove('holding');fn();},2000);}function stop(){clearTimeout(t);btn.classList.remove('holding');}
  btn.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(function(ev){btn.addEventListener(ev,stop);});btn.addEventListener('contextmenu',function(e){e.preventDefault();});}

var S=null;
function study(deck){
  S={deck:deck,queue:deck.cards.map(function(_,i){return i;}),i:0,got:[],again:[],flipped:false};
  drawStudy();
}
function drawStudy(){
  if(!S.queue.length){return doneStudy();}
  var idx=S.queue[S.i];var card=S.deck.cards[idx];
  app.innerHTML='<div class="top"><button class="btn ghost" id="back">‹ Decks</button><h2>'+esc(S.deck.title)+'</h2></div>'+
    '<div class="stats"><span class="pill">Card '+(S.i+1)+' of '+S.queue.length+'</span><span class="pill">Got it '+S.got.length+'</span><span class="pill">Study again '+S.again.length+'</span></div>'+
    '<div class="scene"><div class="flip'+(S.flipped?' on':'')+'" id="flip"><div class="face"><div class="kicker">Term</div><div class="term">'+esc(card.term)+'</div><div class="hinttap">Tap to flip</div></div><div class="face back"><div class="kicker">Definition</div><div class="term">'+esc(card.def)+'</div><div class="hinttap">Tap to flip back</div></div></div></div>'+
    '<div class="controls"><button class="btn ghost" id="prev">‹ Previous</button><button class="btn ghost" id="next">Next ›</button><button class="btn soft" id="shuf">Shuffle</button><button class="btn good" id="got">Got it</button><button class="btn" id="again" style="grid-column:1 / -1">Study again</button></div>';
  $('#flip').addEventListener('click',function(){S.flipped=!S.flipped;this.classList.toggle('on',S.flipped);});
  $('#back').addEventListener('click',home);
  $('#prev').addEventListener('click',function(){S.i=(S.i-1+S.queue.length)%S.queue.length;S.flipped=false;drawStudy();});
  $('#next').addEventListener('click',function(){S.i=(S.i+1)%S.queue.length;S.flipped=false;drawStudy();});
  $('#shuf').addEventListener('click',function(){var cur=S.queue[S.i];S.queue=shuffle(S.queue);S.i=Math.max(0,S.queue.indexOf(cur));S.flipped=false;toast('Shuffled');drawStudy();});
  $('#got').addEventListener('click',function(){var id=S.queue.splice(S.i,1)[0];S.got.push(id);if(S.i>=S.queue.length)S.i=0;S.flipped=false;toast('Got it!');drawStudy();});
  $('#again').addEventListener('click',function(){var id=S.queue.splice(S.i,1)[0];S.queue.push(id);S.again.push(id);if(S.i>=S.queue.length)S.i=0;S.flipped=false;toast('We will see it again');drawStudy();});
}
function doneStudy(){
  app.innerHTML='<div class="done"><div class="big">'+S.got.length+'</div><h2>Cards you got</h2><p class="lede">'+S.again.length+' went to Study again. You can run that pile next, or pick a new deck.</p>'+
    '<div class="row" style="justify-content:center"><button class="btn" id="pile"'+(S.again.length?'':' disabled')+'>Study the again pile</button><button class="btn ghost" id="home">All decks</button></div></div>';
  $('#home').addEventListener('click',home);
  var p=$('#pile');if(p)p.addEventListener('click',function(){var ids=[];S.again.forEach(function(id){if(ids.indexOf(id)<0)ids.push(id);});S.queue=ids;S.i=0;S.got=[];S.again=[];S.flipped=false;drawStudy();});
}

function parentHome(){
  var custom=loadCustom();
  app.innerHTML='<div class="top"><button class="btn ghost" id="close">Close</button><h2>Parent decks</h2></div><p class="lede">Built in decks stay as they are. Add your own decks here. They save on this iPad.</p>'+
    '<div class="row"><button class="btn" id="add">New deck</button><button class="btn ghost" id="exp">Export</button><button class="btn ghost" id="imp">Import</button></div>'+
    '<div class="grid" id="list"></div><div id="box"></div>';
  function paint(){custom=loadCustom();$('#list').innerHTML=custom.length?custom.map(function(d){return '<button class="deck" data-id="'+d.id+'"><span class="sect">Custom</span><b>'+esc(d.title)+'</b><span>'+d.cards.length+' cards · tap to edit</span></button>';}).join(''):'<p class="lede">No custom decks yet.</p>';
    [].forEach.call($('#list').querySelectorAll('.deck'),function(b){b.addEventListener('click',function(){editDeck(b.dataset.id);});});}
  paint();
  $('#close').addEventListener('click',home);
  $('#add').addEventListener('click',function(){editDeck(null);});
  $('#exp').addEventListener('click',function(){var text=JSON.stringify({decks:loadCustom()},null,2);$('#box').innerHTML='<div class="cardbox"><label>Copy this text to move decks to another iPad</label><textarea id="ex" readonly></textarea><button class="btn" id="copy">Copy</button></div>';$('#ex').value=text;$('#copy').addEventListener('click',function(){copyText(text).then(function(ok){toast(ok?'Copied':'Press and hold the text, then copy');});});});
  $('#imp').addEventListener('click',function(){$('#box').innerHTML='<div class="cardbox"><label>Paste deck JSON here</label><textarea id="im" placeholder=\'{"decks":[{"title":"My deck","cards":[{"term":"star","def":"a sun"}]}]}\'></textarea><button class="btn" id="doimp">Add these decks</button></div>';
    $('#doimp').addEventListener('click',function(){var data;try{data=JSON.parse($('#im').value);}catch(e){toast('That text is not JSON');return;}var decks=data.decks||data;if(!Array.isArray(decks)){toast('Need a decks list');return;}var cur=loadCustom(),n=0;decks.forEach(function(d){if(!d||!d.title||!Array.isArray(d.cards))return;var cards=d.cards.filter(function(c){return c&&String(c.term||'').trim()&&String(c.def||c.definition||'').trim();}).map(function(c){return {term:String(c.term).trim(),def:String(c.def||c.definition).trim()};});if(!cards.length)return;cur.push({id:uid(),who:'My deck',title:String(d.title).trim(),cards:cards});n++;});saveCustom(cur);toast(n?('Added '+n+' deck'+(n>1?'s':'')):'No decks found');paint();});});
}
function editDeck(id){
  var custom=loadCustom();var deck=id?custom.filter(function(d){return d.id===id;})[0]:{id:uid(),who:'My deck',title:'',cards:[{term:'',def:''}]};
  if(!deck){parentHome();return;}
  var copy=JSON.parse(JSON.stringify(deck));
  function paint(){
    app.innerHTML='<div class="top"><button class="btn ghost" id="backp">‹ Decks</button><h2>'+(id?'Edit deck':'New deck')+'</h2></div>'+
      '<div class="cardbox"><label>Deck title</label><input id="title" value="'+esc(copy.title)+'"></div><div id="cards"></div>'+
      '<div class="row"><button class="btn ghost" id="addc">Add card</button><button class="btn" id="save">Save deck</button>'+(id?'<button class="btn danger" id="del">Delete deck</button>':'')+'</div>';
    var box=$('#cards');copy.cards.forEach(function(c,i){var row=el('<div class="pair cardbox"><div><label>Term</label><input data-k="term" data-i="'+i+'" value="'+esc(c.term)+'"></div><div><label>Definition</label><input data-k="def" data-i="'+i+'" value="'+esc(c.def)+'"></div><button class="btn ghost" data-x="'+i+'">Remove</button></div>');box.appendChild(row);});
    [].forEach.call(box.querySelectorAll('input'),function(inp){inp.addEventListener('input',function(){copy.cards[+inp.dataset.i][inp.dataset.k]=inp.value;});});
    [].forEach.call(box.querySelectorAll('[data-x]'),function(b){b.addEventListener('click',function(){copy.cards.splice(+b.dataset.x,1);if(!copy.cards.length)copy.cards.push({term:'',def:''});paint();});});
    $('#title').addEventListener('input',function(){copy.title=this.value;});
    $('#addc').addEventListener('click',function(){copy.title=$('#title').value;copy.cards.push({term:'',def:''});paint();});
    $('#backp').addEventListener('click',parentHome);
    $('#save').addEventListener('click',function(){copy.title=$('#title').value.trim();copy.cards=copy.cards.filter(function(c){return c.term.trim()&&c.def.trim();}).map(function(c){return {term:c.term.trim(),def:c.def.trim()};});if(!copy.title||!copy.cards.length){toast('Add a title and at least one card');return;}var all=loadCustom();var found=false;all=all.map(function(d){if(d.id===copy.id){found=true;return copy;}return d;});if(!found)all.push(copy);saveCustom(all);toast('Saved');parentHome();});
    var del=$('#del');if(del)del.addEventListener('click',function(){if(del.dataset.arm!=='1'){del.dataset.arm='1';del.textContent='Tap again to delete';return;}saveCustom(loadCustom().filter(function(d){return d.id!==copy.id;}));toast('Deck deleted');parentHome();});
  }
  paint();
}
window.__cards={builtin:BUILTIN,load:loadCustom,home:home,study:study};
home();
})();
</script>
</body>
</html>
