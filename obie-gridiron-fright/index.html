<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111014">
<title>OBIE: Gridiron Fright</title>
<style>
@font-face{font-family:Bungee;src:url(fonts/Bungee-Regular.ttf)}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(fonts/BarlowCondensed-Bold.ttf)}
@font-face{font-family:Inter;font-weight:100 900;src:url(fonts/Inter.ttf)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;background:#111014;overflow:hidden;overscroll-behavior:none;touch-action:none;position:fixed;inset:0}
#game{position:fixed;inset:0;touch-action:none}
#game canvas{touch-action:none;display:block}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#2B1F4A,#111014 70%);color:#F3EBDD;
 font-family:"Barlow Condensed",sans-serif;font-weight:700;text-align:center;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#rotate .ph{width:70px;height:116px;border:6px solid #FF7A1A;border-radius:14px;animation:rot 2s ease-in-out infinite}
#rotate h1{font-family:Bungee,sans-serif;font-weight:400;font-size:30px;margin:0;color:#FF7A1A}
#rotate p{font-size:22px;margin:0;opacity:.85;max-width:80vw}
@keyframes rot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#FF7A1A;font:700 28px "Barlow Condensed",sans-serif;z-index:5;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<div id="loading">LOADING...</div>
<div id="rotate"><div class="ph"></div><h1>TURN IT SIDEWAYS</h1><p>Rotate your device to landscape to play Obie: Gridiron Fright.</p></div>
<script>
// Block Safari double-tap and pinch zoom
['gesturestart','gesturechange','gestureend','dblclick'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
var lastTouch=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n;},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
</script>
<script src="vendor/phaser.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/propmeta.js"></script>
<script src="js/data.js"></script>
<script src="js/scenes-menu.js"></script>
<script src="js/scene-game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
