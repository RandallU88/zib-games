elve-year-old Nora Kessler stood behind the cider table, watching her breath puff in the cold air. Her family pressed apples into cider every fall, and this year they had an extra problem: a late frost had damaged a third of the trees.", "Chapter 2 - Two Plans. That night, Nora's older cousin Eli spread a notebook on the kitchen table. \"We sell every barrel now,\" he said. \"Prices are high because everyone wants cider for Thanksgiving. We'd make the most money this week.\" Nora's mother tapped a different page. \"Or we keep back the best barrels and use them to buy new young trees from the Amish nursery down the road. The nursery wants cider, not cash, for its winter workers.\"", "Chapter 3 - The Hidden Cost. Nora thought it over while she fed the goats. If they sold everything, they would have cash now, but nothing to trade for new trees. Without new trees, the frost-damaged orchard would produce even less next fall. \"Every choice costs something,\" her grandmother had always said. \"The cost is the thing you give up.\"", "Chapter 4 - Nora's Proposal. At breakfast, Nora shared her idea. \"What if we do both? We sell some barrels for Thanksgiving, and we trade the rest to the nursery. The nursery gets cider it wants, and we get trees we need. Both sides win.\" Eli frowned, then slowly nodded. \"Trading something we have for something we need more. That's smarter than chasing the biggest number this week.\"", "Chapter 5 - Spring Promise. By Thanksgiving, twenty young apple trees stood in neat rows where the frost had hit hardest. They were thin and bare, but Nora knew that in three or four years they would bloom. At dinner, her grandmother raised a glass of cider. \"To the people who plant trees they won't pick from this year,\" she said, and Nora felt proud."], "art": {"id": "S1", "label": "Story pictures"}, "banner": "S1", "panels": ["S1-1", "S1-2", "S1-3", "S1-4", "S1-5"], "questions": [{"id": "S1-q1", "type": "multiple_choice", "prompt": "What problem did the
