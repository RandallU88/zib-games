<p class="sub">Savannah&#x27;s Lessons</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Savannah", "grade": 5, "title": "Savannah and the Thanksgiving Quiz Bowl", "theme_word": "GRATITUDE", "subjects": ["Bible (verse, read aloud)", "Reading", "Science review (simple machines, thermometers)", "American history review (Mayflower Compact, Wampanoag, Squanto)", "Math (multiplication facts, add/subtract)"], "est_minutes": "15-25", "teacher_box": {"who": "Savannah, Grade 5, working on her own on the iPad (taps only today). REVIEW DAY: no writing and no cursive today; every answer is a tap, a match, or a number. This lesson stays on the iPad; no real baking or crafts. Virtue of the week: GRATITUDE. Today's verse: Genesis 8:22 (KJV). Verse of the week Psalm 107:1 is still said from memory on Friday (out loud).", "materials": ["iPad (Safari, Urwin Homeschool page)", "Finger (no Apple Pencil needed today)", "Optional, with Mom or Dad: a real outdoor thermometer to read at breakfast and again at lunch (not in the kitchen)"], "steps": ["Tap the chore boxes as you finish them.", "Verse Card (2-3 min): read Genesis 8:22 out loud twice and answer 3 tap questions.", "Read 'Savannah and the Thanksgiving Quiz Bowl' (4 short chapters).", "Answer 4 tap questions about the story.", "Quiz Round 1, Simple Machines: match 6 machines, then 5 quick questions.", "Quiz Round 2, Thermometers: read 3 thermometers and answer 4 questions. Take your time; count the small lines.", "Quiz Round 3, Pilgrims: 6 tap questions and 1 matching set.", "Lightning Round: 8 math facts and equations.", "Optional: Advanced stretch.", "Together, optional: read a real outdoor thermometer at breakfast and at lunch, and find the difference."], "done_looks_like": "Chores checked, verse read aloud twice with 3 answers, story read with 4 answers, all 6 machines matched plus 5 answers, 3 thermometers read plus 4 answers, 7 history answers, 8 Lightning Round answers. Nothing written today. Advanced is optional.", "standard_check": "Names all six simple machines from real things, says what a fulcrum is, reads a thermometer between labels by first finding what each small line counts by, finds a warmer/colder difference, tells what the Mayflower Compact was and why 'just and equal laws' matters, says who Squanto and Massasoit were, and gets the Set A/B facts right without rushing.", "advanced_stretch": "The meaning of 'civil body politic' and 'the general good,' finding what each small space counts by when only the labels are given, a temperature difference, and where the load sits on a wheelbarrow lever."}, "chores": [{"id": "chore-1", "label": "Pick up room (a little more than yesterday)"}, {"id": "chore-2", "label": "Brush teeth"}, {"id": "chore-3", "label": "Clean up spot at the table"}, {"id": "chore-4", "label": "Ask Mom if she needs help with anything"}, {"id": "chore-5", "label": "Take out recycling and trash if needed"}, {"id": "chore-6", "label": "Bring Down Water Cups"}], "sections": [{"id": "SF", "title": "Verse Card: Genesis 8:22", "tag": "STANDARD", "kind": "faith", "verse": {"text": "While the earth remaineth, seedtime and harvest, and cold and heat, and summer and winter, and day and night shall not cease.", "ref": "Genesis 8:22", "version": "KJV", "speak": "While the earth remaineth, seedtime and harvest, and cold and heat, and summer and winter, and day and night shall not cease. Genesis 8, verse 22."}, "helper": "Helper (not the Bible): \"Remaineth\" means continues or is still here. God spoke this promise after the flood: as long as the earth lasts, the seasons will keep their order.", "card_lines": [{"label": "Read it:", "text": "Read the verse out loud two times. No copywork today."}, {"label": "Tie-in:", "text": "In today's story the family reads a cold thermometer in the morning and enjoys a harvest table at night. This verse says God keeps cold and heat, seedtime and harvest, coming every year."}, {"label": "Friday:", "text": "Say the verse of the week, Psalm 107:1, from memory to Mom or Dad (out loud)."}], "art": {"id": "SF", "label": "Verse card"}, "banner": null, "questions": [{"id": "SF-q1", "type": "multiple_choice", "prompt": "In this verse, \"remaineth\" means...", "options": ["gets smaller", "continues or is still here", "goes away", "turns cold"]}, {"id": "SF-q2", "type": "multiple_choice", "prompt": "Which pair is NOT in the verse?", "options": ["Cold and heat", "Summer and winter", "Rain and snow", "Day and night"]}, {"id": "SF-q3", "type": "multiple_choice", "prompt": "What does this promise tell us about God?", "options": ["He forgets the seasons", "He is faithful and keeps His word", "He only cares about summer", "He made the seasons by accident"]}]}, {"id": "S1", "title": "Read: Savannah and the Thanksgiving Quiz Bowl", "tag": "STANDARD", "kind": "reading", "pages": ["Chapter 1 - Cold Morning, Warm House. Thanksgiving morning was frosty when the family pulled into Grandma Tina and Grandpa Duane's driveway. Savannah's breath made little clouds. On the porch post hung Grandpa Duane's old outdoor thermometer. \"Read it for me?\" he asked. Savannah's stomach did a small flip. Thermometers used to feel tricky. Then she remembered her plan: find the nearest label below the red line, figure out what each small line counts by, and count up. She counted carefully and told him the number. \"Exactly right,\" Grandpa Duane said with a wink. \"Good thing you brought a hat.\" Inside, Mom Katie hung up the coats, and the house was warm and smelled like turkey and rolls. Uncle Nick, in his black-and-orange striped sweater, was rolling a hand truck stacked with folding chairs up the board ramp by the back steps. Aunt Mackenzie waved a stack of cards. \"After dinner,\" she announced, \"the Great Thanksgiving Quiz Bowl: machines, thermometers, and Pilgrims. Pick your teams!\"", "Chapter 2 - Machines All Around. Before dinner, everyone had a job. Grandpa Duane needed the big folding table from the high shelf in the garage. He had hung a rope over a pulley wheel on the rafter, so when he pulled down on one end, the table rose off the shelf, and he could lower it slowly to Uncle Michael. Aunt Abby slid a rubber doorstop under the back door so it would stay open for the chairs. \"That doorstop is a wedge,\" Uncle Michael said. \"Thick on one end, thin on the other.\" Out in the yard, Logan and Grandpa Randy bounced on the old wooden seesaw. \"A seesaw is a lever,\" Grandpa Randy called. \"The middle is the fulcrum.\" Savannah helped Dad Randall tighten the table legs, and each one turned on a long screw. She grinned. \"This whole house is a simple machines museum.\"", "Chapter 3 - The Quiz Bowl. After dinner, Aunt Mackenzie read the cards like a game-show host. Savannah, Grandma Lana and Uncle Michael were Team Mayflower; Logan, Grandpa Randy and Aunt Abby were Team Plymouth. The history round was Savannah's favorite. \"Before anyone went ashore to settle, 41 men signed an agreement on the ship in November 1620. What was it called?\" Savannah's hand shot up. \"The Mayflower Compact! It starts, 'In the name of God, Amen.'\" Grandma Lana asked the next one: \"What did they promise to make?\" \"'Just and equal laws,'\" Savannah said, \"and they promised to obey them. They agreed to govern themselves.\" Then Grandpa Randy told about Tisquantum, called Squanto, who spoke English and showed the Pilgrims how to plant corn with a fish in each hill. He told about Massasoit, the Wampanoag leader, who made a peace agreement with the Pilgrims in the spring of 1621 that lasted more than fifty years. That fall, Massasoit and about ninety of his men came to the harvest gathering, and they ate together for three days.", "Chapter 4 - The Final Question. The score was tied. Aunt Mackenzie held up the last card. \"Grandpa Duane's porch thermometer said one number at sunrise and another at noon. How many degrees warmer was it at noon?\" Savannah ran to the window, read the red line between the labels, and counted up from the morning number to the noon number. Team Mayflower won by one point, and Uncle Nick declared that everyone had won pie. Before the pie, Grandpa Duane opened his Bible. \"God made this promise to Noah after the flood,\" he said, and he read: \"While the earth remaineth, seedtime and harvest, and cold and heat, and summer and winter, and day and night shall not cease.\" Savannah thought of the frosty morning, the warm house, and the full table. Cold and heat, seedtime and harvest: God had kept His word again this year, just as He did for the Pilgrims in 1621. Dad Randall prayed, and the whole family said, \"Amen.\""], "art": {"id": "S1", "label": "Story pictures"}, "banner": "S1", "panels": ["S1-1", "S1-2", "S1-3", "S1-4"], "questions": [{"id": "S1-q1", "type": "multiple_choice", "prompt": "Who hosted the Great Thanksgiving Quiz Bowl?", "options": ["Grandma Tina", "Uncle Nick", "Aunt Mackenzie", "Dad Randall"]}, {"id": "S1-q2", "type": "multiple_choice", "prompt": "How did Grandpa Duane get the big table off the high shelf?", "options": ["He climbed a ladder and carried it", "He pulled down on a rope over a pulley", "Logan pushed it up a ramp", "He used a screw"]}, {"id": "S1-q3", "type": "multiple_choice", "prompt": "What was Savannah's plan for reading a thermometer?", "options": ["Guess the closest big number", "Read only the top label", "Find the nearest label below the red line, see what each small line counts by, and count up", "Ask Logan"]}, {"id": "S1-q4", "type": "multiple_choice", "prompt": "Why did Grandpa Duane's verse fit the day so well?", "options": ["It is about pie", "It names cold and heat and seedtime and harvest, and God kept that promise again", "It is about a quiz game", "It was the shortest verse he knew"]}]}, {"id": "S2", "title": "Quiz Round 1: Simple Machines", "tag": "STANDARD", "kind": "activity", "art": {"id": "L2", "label": "Sort cards"}, "banner": "L2", "questions": [{"id": "S2-q1", "type": "tap_to_sort", "prompt": "Match each thing from Grandma's house to its simple machine.", "buckets": ["Lever", "Pulley", "Wedge", "Inclined plane", "Wheel and axle", "Screw"], "items": ["The rubber doorstop under the back door", "The long twisting bolt in each table leg", "Grandpa's rope and wheel on the garage rafter", "The old wooden seesaw", "The board ramp over the back steps", "The hand truck's wheels and rod"]}, {"id": "S2-q2", "type": "multiple_choice", "prompt": "On a lever, the point the bar turns on is called the...", "options": ["axle", "fulcrum", "wedge", "handle"]}, {"id": "S2-q3", "type": "multiple_choice", "prompt": "Grandpa Randy slides the fulcrum closer to a heavy load. What happens?", "options": ["The load gets heavier", "The load is easier to lift, but you push the bar farther", "The lever stops working", "The load floats"]}, {"id": "S2-q4", "type": "multiple_choice", "prompt": "A single fixed pulley like Grandpa Duane's helps mostly by...", "options": ["making the table lighter", "changing the direction: you pull down and the load goes up", "turning the rope into a ramp", "holding the door open"]}, {"id": "S2-q5", "type": "multiple_choice", "tf": true, "prompt": "True or false: A screw is an inclined plane wrapped around a post.", "options": ["True", "False"]}, {"id": "S2-q6", "type": "multiple_choice", "tf": true, "prompt": "True or false: A wedge is thick on both ends.", "options": ["True", "False"]}]}, {"id": "S3", "title": "Quiz Round 2: Thermometer Practice", "tag": "STANDARD", "kind": "practice", "encouragement": "You already know how to count by 2s and 5s, and that is all a thermometer asks. Go slowly. Find the label just below the red line, check what each small line counts by, then count up. Getting it right matters more than going fast.", "hint": "Two labels next to each other, like 20 and 30, are 10 degrees apart. Count the small spaces between them: 5 spaces means each one counts by 2.", "art": {"id": "S3", "label": "Practice art"}, "banner": null, "questions": [{"id": "S3-q1", "type": "number_typed", "prompt": "Thermometer A is Grandpa Duane's porch thermometer at sunrise. Each small line counts by 2. What temperature does it show (°F)?", "figure": {"src": "S3-thermo-a.svg", "alt": "Porch thermometer at sunrise", "kind": "thermo"}}, {"id": "S3-q2", "type": "number_typed", "prompt": "Thermometer B is the same porch thermometer at noon. What temperature does it show (°F)?", "figure": {"src": "S3-thermo-b.svg", "alt": "Porch thermometer at noon", "kind": "thermo"}}, {"id": "S3-q3", "type": "number_typed", "prompt": "How many degrees warmer was noon than sunrise? Use your answers to A and B. (Tip: count up from A to B.)"}, {"id": "S3-q4", "type": "multiple_choice", "prompt": "Water freezes at 32°F. At sunrise (Thermometer A), was the porch above or below freezing?", "options": ["Above freezing", "Below freezing", "Exactly freezing"]}, {"id": "S3-q5", "type": "multiple_choice", "prompt": "Look at Thermometer C. Its labels go up by 20s. What does each small line count by?", "options": ["1 degree", "2 degrees", "5 degrees", "10 degrees"]}, {"id": "S3-q6", "type": "number_typed", "prompt": "Now read Thermometer C, the living room thermometer. What temperature does it show (°F)?", "figure": {"src": "S3-thermo-c.svg", "alt": "Living room thermometer", "kind": "thermo"}}, {"id": "S3-q7", "type": "multiple_choice", "prompt": "Which thermometer shows the warmest temperature?", "options": ["A (porch at sunrise)", "B (porch at noon)", "C (living room)"]}], "layout": "thermo"}, {"id": "S4", "title": "Quiz Round 3: Pilgrims, Wampanoag and the Compact", "tag": "STANDARD", "kind": "activity", "art": {"id": "S4", "label": "Sort cards"}, "banner": null, "questions": [{"id": "S4-q1", "type": "multiple_choice", "prompt": "Where were the 41 men when they signed the Mayflower Compact in November 1620?", "options": ["In a church in England", "On the ship, before going ashore to settle", "At the 1621 harvest feast", "In Boston"]}, {"id": "S4-q2", "type": "multiple_choice", "prompt": "The Compact begins, \"In the name of God, Amen.\" What does that opening show?", "options": ["They were in a hurry", "They began their new government by calling on God", "They did not want any laws", "The king wrote it for them"]}, {"id": "S4-q3", "type": "multiple_choice", "prompt": "The signers promised to make \"just and equal laws\" and to obey them. This is an early American example of...", "options": ["a king ruling alone", "self-government: people agreeing together on fair laws", "a ship's menu", "a peace treaty with the Wampanoag"]}, {"id": "S4-q4", "type": "multiple_choice", "prompt": "Who was Squanto (Tisquantum)?", "options": ["The captain of the Mayflower", "A Native man who spoke English and taught the Pilgrims to plant corn", "The governor of Plymouth", "A king of England"]}, {"id": "S4-q5", "type": "multiple_choice", "prompt": "In the spring of 1621, Massasoit and the Pilgrims made a peace agreement. About how long did that peace last?", "options": ["One week", "One winter", "More than fifty years", "It never started"]}, {"id": "S4-q6", "type": "multiple_choice", "tf": true, "prompt": "True or false: About half of the Mayflower passengers died during the first hard winter.", "options": ["True", "False"]}, {"id": "S4-q7", "type": "tap_to_sort", "prompt": "Match each person to the right fact.", "buckets": ["William Bradford", "Edward Winslow", "Squanto", "Massasoit"], "items": ["Wrote a 1621 letter home about the harvest gathering", "Wampanoag leader who came to the harvest with about ninety men", "Governor of Plymouth who wrote Of Plymouth Plantation", "Showed the Pilgrims how to plant corn with a fish in each hill"]}]}, {"id": "S5", "title": "Lightning Round", "tag": "STANDARD", "kind": "math", "hint": "8 × 8 = (8 × 4) + (8 × 4).", "art": {"id": "S5", "label": "Math art"}, "banner": null, "questions": [{"id": "S5-q1", "type": "number_typed", "prompt": "6 × 4 = ?"}, {"id": "S5-q2", "type": "number_typed", "prompt": "9 × 3 = ?"}, {"id": "S5-q3", "type": "number_typed", "prompt": "7 × 3 = ?"}, {"id": "S5-q4", "type": "number_typed", "prompt": "8 × 7 = ?"}, {"id": "S5-q5", "type": "number_typed", "prompt": "9 × 9 = ?"}, {"id": "S5-q6", "type": "number_typed", "prompt": "4 × 9 = ?"}, {"id": "S5-q7", "type": "number_typed", "prompt": "(6 × 6) + (7 × 3) = ?"}, {"id": "S5-q8", "type": "number_typed", "prompt": "653 + 278 = ?"}]}, {"id": "SA", "title": "ADVANCED • OPTIONAL: Bonus Round", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "art": {"id": "SA", "label": "Challenge art"}, "banner": null, "questions": [{"id": "SA-q1", "type": "multiple_choice", "prompt": "The Compact joined the signers into a \"civil body politic.\" What does that mean?", "options": ["A ship's crew", "A group of people who agree to govern themselves together under fair laws", "A doctor's office", "A church choir"]}, {"id": "SA-q2", "type": "multiple_choice", "prompt": "The Compact says the laws were \"for the general good of the Colony.\" Why does that matter?", "options": ["Only the governor had to obey", "Laws were meant to serve everyone, not just the leaders", "The laws were only for the ship", "It means there were no laws"]}, {"id": "SA-q3", "type": "number_typed", "prompt": "No picture: a thermometer has labels at 40 and 50, with 4 small lines between them (5 equal spaces). How many degrees does each space count?"}, {"id": "SA-q4", "type": "number_typed", "prompt": "At 6 AM it was 27°F. At 3 PM it was 52°F. How many degrees warmer was it at 3 PM? 52 - 27 = ?"}, {"id": "SA-q5", "type": "multiple_choice", "prompt": "A wheelbarrow is a lever. The wheel is the fulcrum, the load sits in the middle, and you lift the handles. Where is the load?", "options": ["Outside the fulcrum", "Between the fulcrum and your hands", "On top of your hands", "Under the wheel"]}]}], "lesson_id": "lesson-06", "date": "2026-11-17", "art_dir": "../assets/lesson-06/", "theme_class": "theme-grandmas-thanksgiving", "theme_recipe": "Grandma's Thanksgiving", "review_day": true, "no_writing": true}</script><script src="../assets/hs-submit.js?v=6"></script><script src="../assets/lesson.js?v=6"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
