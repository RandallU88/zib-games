 "label": "Brush teeth"}, {"id": "chore-3", "label": "Clean up spot at the table"}, {"id": "chore-4", "label": "Ask Mom if she needs help with anything"}, {"id": "chore-5", "label": "Take out recycling and trash if needed"}, {"id": "chore-6", "label": "Bring Down Water Cups"}], "sections": [{"id": "S1", "title": "Read: June and the Eleventh Hour", "tag": "STANDARD", "kind": "reading", "pages": ["Chapter 1 - A Chilly Assignment. On the Monday before Veterans Day, June sat in the Massillon library with her notebook. Her teacher had asked for a short report: Why do we have Veterans Day on November 11? Outside, a cold wind blew the last brown leaves down Main Street. June's brother Milo was already talking about helping with the flag at the town square on Wednesday. June wanted her facts straight first.", "Chapter 2 - The Eleventh Hour. June's book said that World War I ended in 1918. The fighting stopped on the 11th hour of the 11th day of the 11th month, November 11, 1918. That agreement was called the Armistice. A year later, people in the United States began to honor the day as Armistice Day. They remembered the end of the war and the people who had served in it. June wrote a note about the eleventh hour and underlined it.", "Chapter 3 - A New Name. As she read on, June learned that the day changed in 1954. After later wars, many more people had served. President Eisenhower signed a law that changed Armistice Day to Veterans Day, so the day would honor all who have served in the armed forces, not only those who served in World War I. June tapped her pencil. \"So November 11 started as a day about one war ending, and then it became a day to thank all veterans.\"", "Chapter 4 - The Flagpole Crew. On Wednesday morning the sky was cloudy and the air was chilly. June met Milo, Grandpa Joe, and Mr. Hayes at the square. Mr. Hayes, who had served in the Army, showed them the pulley at the top of the flagpole. \"Pull down, and the flag goes up,\" he said. They rolled chairs up a ramp and used a long board as a lever to lift a crate. June sketched the pulley in her notebook and wrote, \"Tools can help a small crew do a big job.\"", "Chapter 5 - Two Minutes of Quiet. At eleven o'clock the flag reached the top and the square went still. Mr. Hayes said, \"We keep this hour so we don't forget.\" June added a last line to her report: \"We stop at the eleventh hour to give thanks for the people who have protected others.\" Afterward she stood with Milo in the wind, cocoa warming her hands, and watched the flag snap against the gray November sky."], "art": {"id": "S1", "label": "Story pictures"}, "banner": "S1", "panels": ["S1-1", "S1-2", "S1-3", "S1-4", "S1-5"], "questions": [{"id": "S1-q1", "type": "multiple_choice", "prompt": "Why is Veterans Day on November 11?", "options": ["Because it is the first day of winter", "Because it is Grandpa Joe's birthday", "Because World War I fighting stopped on November 11, 1918", "Because the Tigers play that day"]}, {"id": "S1-q2", "type": "multiple_choice", "prompt": "What changed in 1954?", "options": ["The flag colors changed", "The ceremony moved to Monday", "Armistice Day was renamed Veterans Day to honor all who have served", "Towns stopped raising flags"]}, {"id": "S1-q3", "type": "multiple_choice", "prompt": "What tool did the flag crew use to lift the flag?", "options": ["A wedge", "A screw", "A pulley", "A thermometer"]}, {"id": "S1-q4", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Summary: In 2-3 sentences, tell the most important things that happen in the story. Include ONE short quote from the story in quotation marks."}, {"id": "S1-q5", "type": "multiple_choice", "prompt": "Which sentence best states the THEME of the story?", "options": ["Cocoa tastes best in November", "Flagpoles should be shorter", "We set aside a day to remember and thank the people who have served and protected others", "Weather always stops a parade"]}, {"id": "S1-q6", "type": "multiple_choice", "prompt": "AUTHOR'S PURPOSE: Why did the author include both 1918 and 1954 in June's report?", "options": ["To teach how to use a pulley", "To explain football scores", "To show how November 11 grew from Armistice Day into a day to thank all veterans", "To describe only the weather"]}]}, {"id": "S2", "title": "Write: A Thank-You Letter", "tag": "STANDARD", "kind": "writing", "art": {"id": "S2", "label": "Writing paper"}, "banner": null, "notebook": "S2", "questions": [{"id": "S2-q1", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Write a short thank-you letter to a veteran (someone you know, or a veteran in the story such as Mr. Hayes). Include a greeting and a closing. Paragraph 1 (3-4 sentences): thank them and tell what you respect about their service or about protecting others. Paragraph 2 (3-4 sentences): use one idea from the story (the eleventh hour, the flag, the 1954 change, or the crew working together) and explain why it matters to you."}]}, {"id": "S3", "title": "Cursive Copy Line", "tag": "STANDARD", "kind": "cursive", "art": {"id": "S3", "label": "Cursive guide lines"}, "banner": null, "guide": "S3.svg", "questions": [{"id": "S3-q1", "type": "pencil_write", "prompt": "Copy in cursive: Thank you for your service.", "model_text": "Thank you for your service."}]}, {"id": "S4", "title": "Honor Square Math", "tag": "STANDARD", "kind": "math", "hint": "8 × 7 = (8 × 5) + (8 × 2).", "art": {"id": "S4", "label": "Math art"}, "banner": "S4", "questions": [{"id": "S4-q1", "type": "number_typed", "prompt": "8 × 8 = ?"}, {"id": "S4-q2", "type": "number_typed", "prompt": "4 × 9 = ?"}, {"id": "S4-q3", "type": "number_typed", "prompt": "7 × 3 = ?"}, {"id": "S4-q4", "type": "number_typed", "prompt": "9 × 4 = ?"}, {"id": "S4-q5", "type": "number_typed", "prompt": "3 × 3 = ?"}, {"id": "S4-q6", "type": "number_typed", "prompt": "4 × 8 = ?"}, {"id": "S4-q7", "type": "number_typed", "prompt": "9 × 5 = ?"}, {"id": "S4-q8", "type": "number_typed", "prompt": "4 × 6 =  1954. Then give ONE piece of evidence from the story about 1918 and ONE about 1954, with one sentence explaining each."}]}], "lesson_id": "lesson-03", "date": "2026-11-11", "art_dir": "../assets/lesson-03/", "theme_class": "theme-honor-square", "theme_recipe": "Honor Square"}</script><script src="../assets/hs-submit.js?v=4"></script><script src="../assets/lesson.js?v=4"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
