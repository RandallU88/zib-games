<p class="sub">Savannah&#x27;s Lessons</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Savannah", "grade": 5, "title": "Savannah and the Great Pie Rescue", "theme_word": "FORGIVENESS", "subjects": ["Bible (verse read aloud, Psalm 107:1 cursive copywork)", "Reading (comic story: summary, theme, point of view)", "Math (multiplication facts, add and subtract)", "Rounding money", "Map skills (directions)", "Science review (reading a thermometer)"], "est_minutes": "15-25", "teacher_box": {"who": "Savannah, Grade 5, working on her own on the iPad. FUN REVIEW DAY: everything is a tap or a number except 3 short lines of cursive copywork (Apple Pencil). This lesson stays on the iPad; the pies are only in the story (no baking or kitchen work). Virtues: HONESTY and FORGIVENESS. Today's verse: Ephesians 4:32 (KJV). Verse of the week Psalm 107:1 is copied in cursive today and said from memory on Friday (out loud).", "materials": ["iPad (Safari, Urwin Homeschool page)", "Apple Pencil for the 3 cursive lines", "Finger for everything else"], "steps": ["Tap the chore boxes as you finish them.", "Verse Card (3-5 min): read Ephesians 4:32 out loud twice, copy Psalm 107:1 in cursive (3 short lines), and answer 1 tap question.", "Read 'Savannah and the Great Pie Rescue' (4 short chapters).", "Answer 4 tap questions: summary, theme, point of view, and a detail.", "Clue Equations: 9 math facts and equations.", "Bakery Rounding: 2 money rounding clues. Take your time.", "Map Clue: use the town map to answer 3 direction questions.", "Porch Thermometer: read 1 thermometer and answer 1 question. Count the small lines.", "Optional: Advanced stretch."], "done_looks_like": "Chores checked, verse read aloud twice, Psalm 107:1 in 3 neat cursive lines, 1 verse answer, story read with 4 answers, 9 equation answers, 2 rounding answers, 3 map answers, 2 thermometer answers. Advanced is optional. Friday: says Psalm 107:1 from memory.", "standard_check": "Gives a one-sentence summary and the theme (truth and forgiveness), names the point of view, gets the Set A/B facts and the add/subtract equations right without rushing, rounds a price to the nearest dollar by looking at the cents, follows north/south/east/west on a map, reads a thermometer between labels, and writes Psalm 107:1 in neat cursive.", "advanced_stretch": "Estimating a total by rounding two prices, a two-step map route, a mixed fact equation, a line from Uncle Nick's point of view, and a true-or-false about forgiveness."}, "chores": [{"id": "chore-1", "label": "Pick up room (a little more than yesterday)"}, {"id": "chore-2", "label": "Brush teeth"}, {"id": "chore-3", "label": "Clean up spot at the table"}, {"id": "chore-4", "label": "Ask Mom if she needs help with anything"}, {"id": "chore-5", "label": "Take out recycling and trash if needed"}, {"id": "chore-6", "label": "Bring Down Water Cups"}], "sections": [{"id": "SF", "title": "Verse Card and Copywork", "tag": "STANDARD", "kind": "faith", "verse": {"text": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.", "ref": "Ephesians 4:32", "version": "KJV", "speak": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you. Ephesians 4, verse 32."}, "helper": "Helper (not the Bible): \"Tenderhearted\" means having a soft, caring heart. We forgive others because God, for Christ's sake, has forgiven us.", "card_lines": [{"label": "Read it:", "text": "Read Ephesians 4:32 out loud two times."}, {"label": "Copywork:", "text": "Copy the verse of the week, Psalm 107:1, in cursive below, one short line at a time: \"O give thanks unto the Lord, for he is good: for his mercy endureth for ever.\""}, {"label": "Friday:", "text": "Say Psalm 107:1 from memory to Mom or Dad (out loud)."}], "guide": "../lesson-05/SF.svg", "art": {"id": "SF", "label": "Verse card"}, "banner": null, "questions": [{"id": "SF-q1", "type": "pencil_write", "prompt": "Copy line 1 of 3 in cursive: O give thanks unto the Lord,", "model_text": "O give thanks unto the Lord,"}, {"id": "SF-q2", "type": "pencil_write", "prompt": "Copy line 2 of 3 in cursive: for he is good: for his mercy", "model_text": "for he is good: for his mercy"}, {"id": "SF-q3", "type": "pencil_write", "prompt": "Copy line 3 of 3 in cursive: endureth for ever.", "model_text": "endureth for ever."}, {"id": "SF-q4", "type": "multiple_choice", "prompt": "Why does Ephesians 4:32 say we should forgive one another?", "options": ["Because the other person earned it", "Because God for Christ's sake has forgiven us", "Because it is a holiday", "So we never have to talk about it"]}]}, {"id": "S1", "title": "Comic Story: Savannah and the Great Pie Rescue", "tag": "STANDARD", "kind": "reading", "pages": ["Chapter 1 - The Empty Porch Table. The Wednesday before Thanksgiving was cold and bright in Massillon. Grandma Tina had baked four pies, pumpkin, apple, pecan and cherry, and set them on the little porch table to cool while she rested her feet. When Savannah and Logan came up the steps with Mom Katie and Dad Randall, Grandma Tina was standing beside an empty table with her hand over her mouth. \"Four pies,\" she said, \"and not a crumb of them left.\" That was not quite true. Savannah pushed up her pink glasses and knelt down. There were crumbs on the steps, a trail of them, and next to the trail, one very large boot print. Grandpa Duane tapped his old porch thermometer. \"Cold enough to cool a pie fast,\" he said, \"and cold enough to keep a trail fresh.\" Savannah opened her little notebook. \"Then let's follow it.\"", "Chapter 2 - Clues Around Town. The trail ended at the driveway, so the family drove downtown to the bakery with the striped awning. The baker remembered a tall man who had bought one pie box that afternoon and paid with a handful of coins. Savannah looked at the price tag on the counter and rounded it in her head to the nearest dollar, the way she had practiced. A month ago that would have scared her. Now she just took a breath, looked at the cents, and decided. Grandpa Duane unfolded his paper map of town. \"If a man had a pie box,\" he said, \"where would he go to eat in peace?\" Savannah traced the streets with her finger, counted the blocks, and checked the compass rose. \"The park,\" she said. \"It is only a few blocks from here.\"", "Chapter 3 - The Striped Thread. Under the bench by the gazebo, Grandpa Duane found a pie tin, licked clean. Caught on its edge was a single thread, black and orange, like a tiger stripe. Savannah's face went hot. She knew exactly who wore black and orange every day of the year. \"He ruined Grandma's surprise,\" she said. \"That's not fair.\" Mom Katie put an arm around her. \"You're right that it was wrong,\" she said quietly. \"But let's hear him out before we decide what's in our hearts.\" Savannah thought about that the whole drive back. She wanted the truth to come out. She was not sure she wanted to forgive.", "Chapter 4 - The Confession. Uncle Nick's pickup was parked in Grandma Tina's driveway. He climbed out and held up three pies, safe in a new pie box, plus one empty tin. \"I wanted to taste-test,\" he said, turning red. \"One taste turned into a whole pecan pie. I should have asked, and I should have told you right away. I'm sorry.\" He handed Grandma Tina a bag from the bakery. He had bought a new pecan pie with his own money to make it right. Grandma Tina hugged him tight. \"I forgive you,\" she said. \"Thank you for telling the truth.\" Grandpa Duane read from his Bible: \"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.\" Savannah looked at Uncle Nick, sheepish in his tiger-stripe sweater, and felt the hot feeling melt away. \"I forgive you too,\" she said, \"but next year, I'm guarding the pies.\" Everyone laughed, and Dad Randall prayed, thanking God for family, for pies, and for mercy that endures for ever."], "art": {"id": "S1", "label": "Story pictures"}, "banner": "S1", "panels": ["S1-1", "S1-2", "S1-3", "S1-4"], "questions": [{"id": "S1-q1", "type": "multiple_choice", "prompt": "Which sentence is the best SUMMARY of the story?", "options": ["Grandma Tina bakes four pies and rests her feet.", "The family follows clues to find Grandma's missing pies, Uncle Nick confesses, and he is forgiven.", "Savannah rounds a price at the bakery.", "Uncle Nick wears a black-and-orange sweater."]}, {"id": "S1-q2", "type": "multiple_choice", "prompt": "What is the THEME (the big lesson) of the story?", "options": ["Always guard your pies", "Telling the truth and forgiving each other mends what was broken", "Maps are useful", "Bakeries are fun"]}, {"id": "S1-q3", "type": "multiple_choice", "prompt": "From what POINT OF VIEW is the story told?", "options": ["First person, by Uncle Nick", "Third person, mostly following Savannah's thoughts and feelings", "First person, by Grandma Tina", "Second person, talking to the reader"]}, {"id": "S1-q4", "type": "multiple_choice", "tf": true, "prompt": "True or false: Uncle Nick bought a new pecan pie with his own money to make it right.", "options": ["True", "False"]}]}, {"id": "S2", "title": "Clue Equations", "tag": "STANDARD", "kind": "math", "hint": "8 × 8 = (8 × 4) + (8 × 4).", "art": {"id": "S2", "label": "Math art"}, "banner": null, "questions": [{"id": "S2-q1", "type": "number_typed", "prompt": "7 × 4 = ?"}, {"id": "S2-q2", "type": "number_typed", "prompt": "9 × 5 = ?"}, {"id": "S2-q3", "type": "number_typed", "prompt": "8 × 7 = ?"}, {"id": "S2-q4", "type": "number_typed", "prompt": "6 × 6 = ?"}, {"id": "S2-q5", "type": "number_typed", "prompt": "3 × 9 = ?"}, {"id": "S2-q6", "type": "number_typed", "prompt": "4 × 8 = ?"}, {"id": "S2-q7", "type": "number_typed", "prompt": "(5 × 5) + (3 × 7) = ?"}, {"id": "S2-q8", "type": "number_typed", "prompt": "472 + 359 = ?"}, {"id": "S2-q9", "type": "number_typed", "prompt": "805 - 268 = ?"}]}, {"id": "S3", "title": "Bakery Rounding", "tag": "STANDARD", "kind": "practice", "encouragement": "You have practiced this, and you can do it. Rounding to the nearest dollar only asks one question: are the cents 50 or more? If yes, go up to the next dollar. If not, keep the same dollar. Slow and sure wins.", "hint": "Look only at the cents. 50 cents or more rounds up. 49 cents or less stays.", "art": {"id": "S3", "label": "Practice art"}, "banner": null, "questions": [{"id": "S3-q1", "type": "multiple_choice", "prompt": "The pie box price tag says $7.89. Round it to the nearest dollar.", "options": ["$7.00", "$8.00", "$7.90", "$9.00"]}, {"id": "S3-q2", "type": "multiple_choice", "prompt": "A loaf of bread costs $12.35. Round it to the nearest dollar.", "options": ["$13.00", "$12.40", "$12.00", "$11.00"]}]}, {"id": "S4", "title": "Map Clue", "tag": "STANDARD", "kind": "practice", "hint": "Find the compass rose first. North is up, south is down, east is right, west is left. Count one block at a time.", "art": {"id": "S4", "label": "Practice art"}, "banner": null, "questions": [{"id": "S4-q1", "type": "multiple_choice", "prompt": "Start at the Bakery. Go 2 blocks north, then 1 block west. Where are you?", "options": ["Library", "Park", "Church", "Post Office"], "figure": {"src": "S4-map.svg", "alt": "Town map", "kind": "map"}}, {"id": "S4-q2", "type": "multiple_choice", "prompt": "Use the map. In which direction is the Park from Grandma's House?", "options": ["Southwest", "Northeast", "Northwest", "Southeast"]}, {"id": "S4-q3", "type": "multiple_choice", "prompt": "Use the map. Which place is straight north of Grandma's House?", "options": ["Post Office", "Library", "Church", "Fire Station"]}]}, {"id": "S5", "title": "Porch Thermometer", "tag": "STANDARD", "kind": "practice", "encouragement": "Thermometers are just counting. You already know how to count by 2s. Find the label just below the red line, then count the small lines up. Getting it right matters more than going fast.", "hint": "Two labels next to each other are 10 degrees apart. 5 small spaces between them means each one counts by 2.", "art": {"id": "S5", "label": "Practice art"}, "banner": null, "questions": [{"id": "S5-q1", "type": "number_typed", "prompt": "Grandpa Duane's porch thermometer on the day of the mystery. Each small line counts by 2. What temperature does it show (°F)?", "figure": {"src": "S5-thermo.svg", "alt": "Porch thermometer", "kind": "thermo"}}, {"id": "S5-q2", "type": "multiple_choice", "prompt": "Water freezes at 32°F. Was the porch above or below freezing?", "options": ["Below freezing", "Above freezing", "Exactly freezing"]}], "layout": "thermo"}, {"id": "SA", "title": "ADVANCED • OPTIONAL: Detective Bonus", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "art": {"id": "SA", "label": "Challenge art"}, "banner": null, "questions": [{"id": "SA-q1", "type": "multiple_choice", "prompt": "Uncle Nick's new pie costs $8.45 and a pie box costs $1.30. Round each to the nearest dollar, then add. About how much?", "options": ["$11.00", "$9.00", "$10.00", "$8.00"]}, {"id": "SA-q2", "type": "number_typed", "prompt": "(9 × 4) + (8 × 5) = ?"}, {"id": "SA-q3", "type": "multiple_choice", "prompt": "Use the map. Start at the Church. Go 2 blocks east, then 2 blocks south. Where are you?", "options": ["Bakery", "Fire Station", "Post Office", "Grandma's House"]}, {"id": "SA-q4", "type": "multiple_choice", "prompt": "If Uncle Nick told this story in FIRST PERSON, which line would fit?", "options": ["Savannah felt her face go hot.", "I only meant to taste one slice, but I ate the whole pecan pie.", "Uncle Nick climbed out of his truck.", "The family drove downtown."]}, {"id": "SA-q5", "type": "multiple_choice", "tf": true, "prompt": "True or false: Forgiving someone means pretending the wrong never happened.", "options": ["True", "False"]}]}], "lesson_id": "lesson-07", "date": "2026-11-18", "art_dir": "../assets/lesson-07/", "theme_class": "theme-great-pie-rescue", "theme_recipe": "The Great Pie Rescue", "review_day": true}</script><script src="../assets/hs-submit.js?v=6"></script><script src="../assets/lesson.js?v=6"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
