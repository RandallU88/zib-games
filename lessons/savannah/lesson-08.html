nd": "reading", "pages": ["Snow falls on Massillon. It is Thanksgiving Day! Stomp, stomp, stomp! The whole family comes to Grandma Tina's house. \"Happy Thanksgiving!\" says Grandpa Duane.", "Uncle Nick guards the pie table. He gives a big, silly salute. \"Pie guard duty!\" he says. \"No pie goes missing this year!\" Logan asks, \"Is it pie time yet?\"", "Mom Katie and Grandma Tina cook the big turkey. Logan and Savannah sit on stools and watch. Sizzle, pop, sizzle! \"Is it pie time yet?\" asks Logan. \"Not yet!\" says Grandma Tina with a wink.", "Grandpa Duane sits with the kids by the fire. \"Long ago, the Pilgrims had a harvest feast,\" he says. \"They thanked God for food and friends.\" Savannah nods and smiles. \"We still thank God today!\" she says.", "Then Grandma Tina gasps. \"Where is the Thankful Jar?\" Each year the family fills it with thank-you notes. They read the notes before pie. Now the jar is gone!", "\"No jar means no pie?\" cries Logan. Thump, thump! He checks under the couch. Savannah checks the closet. \"Not me this time!\" says Uncle Nick.", "Savannah thinks hard. \"Who went outside today?\" she asks. Grandpa Duane rubs his chin. \"I got chairs from the garage,\" he says. \"Let's go look!\" says Savannah.", "Crunch, crunch, crunch! Dad Randall and Uncle Nick search by the garage. Logan zooms all over the yard. Whoosh! His snowball hits Uncle Nick's coat.", "\"Slow down, buddy,\" says Dad Randall. \"Slow eyes see more.\" Logan stops and takes a big breath. He looks slowly at the porch. Hmm!", "There is a funny lump of snow on the rail. It is shaped like a jar! Logan brushes off the snow. Swish, swish! \"I found it!\" he yells.", "Savannah holds up the Thankful Jar. \"I set it down to carry chairs!\" laughs Grandpa Duane. Inside, all four pies are safe. But Uncle Nick has whipped cream on his nose! \"Just a tiny taste test,\" he says.", "The family sits at the long table. Everyone holds hands and bows. Dad Randall prays. \"Thank you, God, for food, family, and snow. Amen!\"", "After dinner they read the notes from the jar. Savannah is thankful for her family. Uncle Nick is thankful for whipped cream! Logan is thankful for snow, family, and God. \"And pie can wait,\" he says.", "Uncle Nick's mouth drops open. \"Pie can wait?\" he gasps. Grandpa Duane reads Psalm 107:1 from his Bible. \"O give thanks unto the Lord, for he is good: for his mercy endureth for ever.\" At last, it is pie time. Yum, yum, yum!"], "art": {"id": "S1", "label": "Story pictures"}, "banner": "S1", "panels": ["P-1", "P-2", "P-3", "P-4", "P-5", "P-6", "P-7", "P-8", "P-9", "P-10", "P-11", "P-12", "P-13", "P-14"], "questions": []}, {"id": "SF", "title": "Verse Card: Psalm 107:1", "tag": "STANDARD", "kind": "faith", "verse": {"text": "O give thanks unto the Lord, for he is good: for his mercy endureth for ever.", "ref": "Psalm 107:1", "version": "KJV", "speak": "O give thanks unto the Lord, for he is good: for his mercy endureth for ever. Psalm 107, verse 1."}, "helper": "Helper (not the Bible): \"His mercy endureth for ever\" means God's kind, faithful love never runs out.", "card_lines": [{"label": "Read it:", "text": "Read the verse out loud, then tap Hear it."}, {"label": "Pray (out loud):", "text": "Dear God, thank you for my family, my home and Your mercy. Help me be thankful every day. Amen."}], "art": {"id": "SF", "label": "Verse card"}, "banner": null, "questions": []}], "lesson_id": "lesson-08", "date": "2026-11-19", "art_dir": "../assets/lesson-08/", "theme_class": "theme-snowy-thankful-jar", "theme_recipe": "The Snowy Thankful Jar", "review_day": true, "no_writing": true, "storybook": true}</script><script src="../assets/hs-submit.js?v=6"></script><script src="../assets/lesson.js?v=6"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
