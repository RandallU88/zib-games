<p class="sub">Savannah&#x27;s Lessons</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Savannah", "grade": 5, "title": "Savannah and the Mayflower Promise", "theme_word": "GRATITUDE", "subjects": ["Bible (verse copywork)", "Reading (primary sources, summary, theme)", "Writing (two paragraphs)", "Cursive", "American history (Mayflower, Plymouth 1620-1623)", "Math (multiplication facts, add/subtract)", "Rounding money"], "est_minutes": "20-35", "teacher_box": {"who": "Savannah, Grade 5, working on her own on the iPad (Apple Pencil for cursive and writing). This lesson stays on the iPad; no real baking or crafts. Virtue of the week: GRATITUDE. Verse of the week: Psalm 107:1 (KJV), recited to Mom or Dad on Friday.", "materials": ["iPad (Safari, Urwin Homeschool page)", "Apple Pencil"], "steps": ["Tap the chore boxes as you finish them.", "Verse and Copywork (2-4 min): read Psalm 107:1, copy it in cursive (3 short lines), and write one prayer line.", "Read 'Savannah and the Mayflower Promise' (6 short chapters, with real quotes from 1620-1623).", "Answer the reading questions (primary sources, the Compact, cause and effect, summary with a quote, theme).", "Write two paragraphs about giving thanks in hard times and good times.", "Copy the cursive line from the Mayflower Compact.", "Do Harvest Math (Set A/B facts plus adding and subtracting).", "Rounding Money: round prices to the nearest dollar, then estimate.", "Optional: Advanced stretch.", "This week (together, optional): sing 'Come, Ye Thankful People, Come' and study Jennie Brownscombe's 'The First Thanksgiving at Plymouth' (1914): look 3-4 minutes, hide it, tell it back. Parent note: the 1621 accounts are written from the English colonists' side (Pilgrim Hall Museum)."], "done_looks_like": "Chores checked, verse copied in 3 neat cursive lines with a prayer line, story read, 7 reading questions answered (summary includes a quote), two complete paragraphs written, one neat cursive line, 14 math answers, 6 rounding answers. Advanced is optional. Friday: says Psalm 107:1 from memory.", "standard_check": "Tells what a primary source is, finds the Pilgrims' stated reason in the Compact, explains one cause and effect (1623 family fields), writes a summary with a real quote, rounds prices to the nearest dollar before subtracting, and gets the Set A/B facts right without rushing.", "advanced_stretch": "A thesis with two pieces of evidence answering 'Is this a good reason?' about Bradford's 1623 change, plus a three-price rounding estimate."}, "chores": [{"id": "chore-1", "label": "Pick up room (a little more than yesterday)"}, {"id": "chore-2", "label": "Brush teeth"}, {"id": "chore-3", "label": "Clean up spot at the table"}, {"id": "chore-4", "label": "Ask Mom if she needs help with anything"}, {"id": "chore-5", "label": "Take out recycling and trash if needed"}, {"id": "chore-6", "label": "Bring Down Water Cups"}], "sections": [{"id": "SF", "title": "Verse and Copywork: Psalm 107:1", "tag": "STANDARD", "kind": "faith", "verse": {"text": "O give thanks unto the Lord, for he is good: for his mercy endureth for ever.", "ref": "Psalm 107:1", "version": "KJV", "speak": "O give thanks unto the Lord, for he is good: for his mercy endureth for ever. Psalm 107, verse 1."}, "helper": "Helper (not the Bible): \"Mercy\" here means God's faithful, steady kindness. \"Endureth for ever\" means it never runs out.", "card_lines": [{"label": "Tie-in:", "text": "In today's story, the Pilgrims thank God after a hard voyage and again at harvest. This verse gives the reason to give thanks in both: the Lord is good, all the time."}, {"label": "Friday:", "text": "Say this verse from memory to Mom or Dad."}], "art": {"id": "SF", "label": "Verse card"}, "banner": null, "guide": "SF.svg", "questions": [{"id": "SF-q1", "type": "pencil_write", "prompt": "Copy line 1 of 3 in cursive: O give thanks unto the Lord,", "model_text": "O give thanks unto the Lord,"}, {"id": "SF-q2", "type": "pencil_write", "prompt": "Copy line 2 of 3 in cursive: for he is good: for his mercy", "model_text": "for he is good: for his mercy"}, {"id": "SF-q3", "type": "pencil_write", "prompt": "Copy line 3 of 3 in cursive: endureth for ever.", "model_text": "endureth for ever."}, {"id": "SF-q4", "type": "short_typed", "prompt": "Pray or journal (one line): Lord, help me to give thanks when ____."}]}, {"id": "S1", "title": "Read: Savannah and the Mayflower Promise", "tag": "STANDARD", "kind": "reading", "pages": ["Chapter 1 - The Model Ship. Harvest Sunday at church smelled like apples and corn bread. In the corner of the fellowship room, Uncle Nick set a wooden ship on a small table. He had spent all fall building it from a kit, down to the tiny ropes. \"The Mayflower,\" he said proudly. \"She left Plymouth, England, in September 1620 with about one hundred passengers, and she was at sea for more than two months.\" Mom Katie handed Savannah a stack of note cards. \"The little kids will have questions,\" she said. \"Will you help Uncle Nick answer them?\" Savannah said yes, and she started reading.", "Chapter 2 - Why They Came. Beside the ship, Uncle Nick had framed a printed copy of the Mayflower Compact. \"The ship reached Cape Cod in November 1620,\" he said, \"and 41 men signed this before anyone went ashore to settle.\" Savannah read the first line out loud: \"In the name of God, Amen.\" Then she found the reason for the whole trip: \"for the glory of God, and advancement of the Christian faith, and honor of our King and Country.\" The men promised to make \"just and equal laws\" together and to obey them. \"So they chose their own government,\" Savannah said slowly, \"and then they promised to keep the rules.\" Uncle Nick nodded. \"Freedom and duty, side by side.\"", "Chapter 3 - Thankful on the Shore. Grandma Tina pulled up a chair and opened her old library book. \"Governor William Bradford wrote down what happened,\" she said. \"When they landed, they fell upon their knees and blessed the God of Heaven who had brought them over the vast and furious ocean.\" Savannah looked at the tiny ship. More than two months at sea, and their first act on land was to thank God. Grandma Tina's voice grew soft. \"That first winter was very hard. About half of the passengers died.\" Savannah was quiet for a moment. \"And they still gave thanks,\" she said. In the spring, a man named Tisquantum helped them plant corn. He spoke English because, years before, he had been taken across the ocean to Europe.", "Chapter 4 - The Harvest of 1621. Grandpa Duane tapped a page in Grandma Tina's book. \"That fall, they brought in their first harvest,\" he said. \"Edward Winslow wrote a letter home about it.\" The Wampanoag leader Massasoit came with about ninety men. For three days they ate together, and the guests went hunting and brought five deer as gifts. Savannah read Winslow's words twice: \"by the goodness of God, we are so far from want, that we often wish you partakers of our plenty.\" \"Partakers means sharers,\" Grandpa Duane explained. \"They had so much, they wished their friends in England could share it.\"", "Chapter 5 - A Field of Their Own. \"Here's a part most people skip,\" Grandpa Duane said. \"At first, the colony farmed shared fields, and the corn went into one common store. The harvests were small, and many people were discouraged. In 1623, Governor Bradford gave each family its own piece of land to plant.\" He read Bradford's words: \"This had very good success, for it made all hands very industrious.\" Savannah thought about it. \"When the field was your family's own, you worked harder to take care of it,\" she said. \"But they still helped each other, and they still thanked God for the harvest.\" Grandpa Duane smiled. \"Owning something means taking good care of it.\"", "Chapter 6 - The Thankful Tree. Before the baskets went out, Mom Katie handed Savannah a paper leaf for the Thankful Tree. Savannah wrote in her best cursive: \"For a God who is good, and a family who tells the true story.\" Then Mom Katie started the old harvest hymn, \"Come, Ye Thankful People, Come,\" and the whole room sang. Dad Randall and Logan carried the last basket to the van. Savannah looked at the ship, the baskets, and the full paper tree, and the verse of the week came to her mind: \"O give thanks unto the Lord, for he is good: for his mercy endureth for ever.\""], "art": {"id": "S1", "label": "Story pictures"}, "banner": "S1", "panels": ["S1-1", "S1-2", "S1-3", "S1-4", "S1-5", "S1-6"], "questions": [{"id": "S1-q1", "type": "multiple_choice", "prompt": "Who built the model of the Mayflower?", "options": ["Grandpa Duane", "Uncle Nick", "Dad Randall", "Grandma Tina"]}, {"id": "S1-q2", "type": "multiple_choice", "prompt": "PRIMARY SOURCE: A primary source was written or made by someone who was there. Which one is a primary source?", "options": ["Uncle Nick's model ship", "A picture book about the Pilgrims printed last year", "Edward Winslow's letter from 1621", "A movie about the Mayflower"]}, {"id": "S1-q3", "type": "multiple_choice", "prompt": "According to the Mayflower Compact, why did the Pilgrims make the voyage?", "options": ["To look for gold and silver", "To start a fishing business", "For the glory of God, and advancement of the Christian faith, and honor of their King and Country", "To get away from a storm at sea"]}, {"id": "S1-q4", "type": "multiple_choice", "prompt": "WORD STUDY: The Compact joins the passengers into a \"civil body politic.\" What does that mean?", "options": ["A ship's crew", "A group of people who agree to govern themselves together under fair laws", "A church choir", "A doctor's office"]}, {"id": "S1-q5", "type": "multiple_choice", "prompt": "CAUSE AND EFFECT: What happened after Governor Bradford gave each family its own land to plant in 1623?", "options": ["Everyone stopped farming", "The Pilgrims sailed back to England", "Much more corn was planted", "The fields were sold to the king"]}, {"id": "S1-q6", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Summary: In 2-3 sentences, tell the most important things Savannah learns at Harvest Sunday. Include ONE short quote from a primary source in quotation marks."}, {"id": "S1-q7", "type": "multiple_choice", "prompt": "Which sentence best states the THEME of the story?", "options": ["Model ships are hard to build", "The Pilgrims had an easy trip", "Gratitude to God fits hard times and good times, and true history helps us remember why", "Harvest Day is only for little kids"]}]}, {"id": "S2", "title": "Write: Thankful in Hard Times and Good Times", "tag": "STANDARD", "kind": "writing", "art": {"id": "S2", "label": "Writing paper"}, "banner": null, "notebook": "S2", "questions": [{"id": "S2-q1", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Write two paragraphs. Paragraph 1 (3-4 sentences): explain how the Pilgrims showed gratitude in a hard time AND in a good time. Use one quote from the story. Paragraph 2 (3-4 sentences): connect Psalm 107:1 to your own life. Name one thing you thank God for and one person you want to thank this week."}]}, {"id": "S3", "title": "Cursive Copy Line", "tag": "STANDARD", "kind": "cursive", "art": {"id": "S3", "label": "Cursive guide lines"}, "banner": null, "guide": "S3.svg", "questions": [{"id": "S3-q1", "type": "pencil_write", "prompt": "Copy in cursive the first words of the Mayflower Compact (1620): In the name of God, Amen.", "model_text": "In the name of God, Amen."}]}, {"id": "S4", "title": "Harvest Math", "tag": "STANDARD", "kind": "math", "hint": "7 × 8 = (7 × 4) + (7 × 4).", "art": {"id": "S4", "label": "Math art"}, "banner": "S4", "questions": [{"id": "S4-q1", "type": "number_typed", "prompt": "4 × 8 = ?"}, {"id": "S4-q2", "type": "number_typed", "prompt": "9 × 4 = ?"}, {"id": "S4-q3", "type": "number_typed", "prompt": "3 × 7 = ?"}, {"id": "S4-q4", "type": "number_typed", "prompt": "5 × 8 = ?"}, {"id": "S4-q5", "type": "number_typed", "prompt": "6 × 6 = ?"}, {"id": "S4-q6", "type": "number_typed", "prompt": "8 × 5 = ?"}, {"id": "S4-q7", "type": "number_typed", "prompt": "9 × 9 = ?"}, {"id": "S4-q8", "type": "number_typed", "prompt": "4 × 6 = ?"}, {"id": "S4-q9", "type": "number_typed", "prompt": "3 × 9 = ?"}, {"id": "S4-q10", "type": "number_typed", "prompt": "7 × 3 = ?"}, {"id": "S4-q11", "type": "number_typed", "prompt": "(8 × 4) + (9 × 3) = ?"}, {"id": "S4-q12", "type": "number_typed", "prompt": "(9 × 5) - (5 × 5) = ?"}, {"id": "S4-q13", "type": "number_typed", "prompt": "576 + 248 = ?"}, {"id": "S4-q14", "type": "number_typed", "prompt": "724 - 358 = ?"}]}, {"id": "S5", "title": "Rounding Money at the Basket Table", "tag": "STANDARD", "kind": "practice", "encouragement": "You are good with money, and this is just one new step. Look only at the cents first. Round, then do the easy math with whole dollars.", "hint": "Look at the cents. 50 cents or more: round up to the next dollar. 49 cents or less: keep the same dollar.", "art": {"id": "S5", "label": "Practice art"}, "banner": null, "questions": [{"id": "S5-q1", "type": "multiple_choice", "prompt": "Mom Katie's basket list: a can of cranberry sauce is $2.39. Round it to the nearest dollar.", "options": ["$3.00", "$2.00", "$2.40", "$2.30"]}, {"id": "S5-q2", "type": "multiple_choice", "prompt": "A box of corn bread mix is $1.85. Round it to the nearest dollar.", "options": ["$1.00", "$1.90", "$2.00", "$1.80"]}, {"id": "S5-q3", "type": "multiple_choice", "prompt": "A bag of apples is $4.50. Round it to the nearest dollar.", "options": ["$4.00", "$4.50", "$5.00", "$4.60"]}, {"id": "S5-q4", "type": "multiple_choice", "prompt": "A can of pumpkin is $3.49. Round it to the nearest dollar.", "options": ["$4.00", "$3.50", "$3.40", "$3.00"]}, {"id": "S5-q5", "type": "number_typed", "prompt": "Round both prices to the nearest dollar, then subtract: $6.79 - $2.15. Type the whole dollars."}, {"id": "S5-q6", "type": "number_typed", "prompt": "Round both prices to the nearest dollar, then subtract: $9.62 - $4.38. Type the whole dollars."}]}, {"id": "SA", "title": "ADVANCED • OPTIONAL: Is This a Good Reason?", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "art": {"id": "SA", "label": "Challenge art"}, "banner": "SA", "notebook": "S2", "questions": [{"id": "SA-q1", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Governor Bradford wrote that giving each family its own land \"This had very good success, for it made all hands very industrious.\" Is that a good reason to give each family its own field? Write a thesis sentence, then two reasons from the story. Add one sentence about what each family still owed to others."}, {"id": "SA-q2", "type": "number_typed", "prompt": "Estimate: round each price to the nearest dollar, then add: $2.39 + $1.85 + $4.50. Type the whole dollars."}]}], "lesson_id": "lesson-05", "date": "2026-11-16", "art_dir": "../assets/lesson-05/", "theme_class": "theme-harvest-postcard", "theme_recipe": "Harvest Postcard"}</script><script src="../assets/hs-submit.js?v=6"></script><script src="../assets/lesson.js?v=6"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
