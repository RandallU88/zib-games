<p class="sub">Savannah&#x27;s Lessons</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Savannah", "grade": 5, "title": "Savannah and the Recipe Card", "theme_word": "PRECISION", "subjects": ["Reading (summary, theme, author's purpose, point of view)", "Writing (explanation, two paragraphs)", "Cursive", "Science (temperature, thermometers)", "Measurement (US and metric units)", "Math (multiplication facts, add/subtract)", "Rounding money"], "est_minutes": "20-35", "teacher_box": {"who": "Savannah, Grade 5, working on her own on the iPad (Apple Pencil for writing and cursive). This lesson stays on the iPad; no real kitchen tools.", "materials": ["iPad (Safari, Urwin Homeschool page)", "Apple Pencil"], "steps": ["Tap the chore boxes as you finish them.", "Read 'Savannah and the Recipe Card' (5 short chapters).", "Answer the reading questions (summary with a quote, theme, author's purpose, point of view).", "Write two paragraphs about why careful measuring matters.", "Copy the cursive line.", "Do Kitchen Math (Set A/B facts plus adding and subtracting).", "Read the Unit Chart and answer the measuring, units, and rounding questions.", "Read the three thermometers and answer the questions.", "Optional: Advanced stretch."], "done_looks_like": "Chores checked, story read, 6 reading questions answered (summary includes a quote), two complete paragraphs written, one neat cursive line, 14 math answers, 10 measuring/units/rounding answers, 5 thermometer answers. Advanced is optional.", "standard_check": "Writes a summary with a real quote, names the theme, reads the Unit Chart to compare °F and °C, mL and grams, rounds prices correctly, reads oven and outdoor thermometers by counting the small lines, and gets the Set A/B facts right without rushing.", "advanced_stretch": "A thesis sentence with two pieces of evidence about why units and careful measuring matter, plus a multi-step milliliter conversion from the Unit Chart."}, "chores": [{"id": "chore-1", "label": "Pick up room (a little more than yesterday)"}, {"id": "chore-2", "label": "Brush teeth"}, {"id": "chore-3", "label": "Clean up spot at the table"}, {"id": "chore-4", "label": "Ask Mom if she needs help with anything"}, {"id": "chore-5", "label": "Take out recycling and trash if needed"}, {"id": "chore-6", "label": "Bring Down Water Cups"}], "sections": [{"id": "S1", "title": "Read: Savannah and the Recipe Card", "tag": "STANDARD", "kind": "reading", "pages": ["Chapter 1 - A Card in Cursive. On a gray Thursday in November, Savannah found Grandma Tina's pumpkin bread card in the old recipe box. The card was written in neat, slanted cursive, and Savannah read it slowly, proud that she could. It listed 2 cups of flour, 1 cup of pumpkin, 1/2 cup of milk, and 2 tablespoons of melted butter, and it ended with \"Bake at 350°F.\" At the bottom, Grandma Tina had written one more line: \"Measure with care and the bread will rise.\"", "Chapter 2 - Cups and Spoons. Mom Katie set out the tools for Savannah. \"Dry things go in these cups, and we level them with a knife,\" she said. \"Milk goes in the glass cup, and we read it at eye level, not from above.\" She held up a tablespoon. \"There are 16 tablespoons in 1 cup, so 2 cups would be 2 × 16, or 32 tablespoons.\" Savannah leveled the flour twice, just to be sure. Her little brother Logan watched and said, \"That's how Grandma Lana does it too.\"", "Chapter 3 - The Back of the Card. When Savannah turned the card over, she found a second note in Grandma Tina's cursive: \"For Mackenzie's kitchen scale: 1 cup flour is about 120 grams. 1 cup milk is about 240 mL. 350°F is about 180°C.\" Aunt Mackenzie, who had stopped by with a bag of cinnamon sticks, laughed. \"Most of the world bakes in grams, milliliters, and degrees Celsius,\" she said. \"Here we use cups, tablespoons, and degrees Fahrenheit. Same bread, different units.\" Savannah copied the numbers into a small chart so she would not mix them up.", "Chapter 4 - Reading the Heat. Mom Katie turned the oven on, and Grandpa Duane arrived with a small round oven thermometer. \"This old oven runs hot,\" he said. \"The dial says one thing, but the thermometer tells the truth. Read the little lines between the numbers.\" Only Mom Katie opened the hot oven to hang the thermometer inside. Savannah read it through the window: first the needle was still too low, and later it had climbed past the line the recipe needed, so Mom Katie turned the dial down a little. Out on the porch, the outdoor thermometer showed a cold afternoon, which was why the extra pumpkins were waiting in the chilly garage.", "Chapter 5 - Golden and Even. When the pumpkin bread came out, it was golden and even, and a toothpick came out clean. It cooled on the rack while the kitchen smelled of cinnamon. Uncle Nick called to ask if he could have the first slice. Savannah smiled at her careful work. Savannah took a fresh card and wrote in her best cursive, \"Measure twice, then bake with care.\" She tucked it behind Grandma Tina's card. When Grandma Tina saw it, she smiled and said, \"Careful hands make good bread, and good bread brings everyone home.\""], "art": {"id": "S1", "label": "Story pictures"}, "banner": "S1", "panels": ["S1-1", "S1-2", "S1-3", "S1-4", "S1-5"], "questions": [{"id": "S1-q1", "type": "multiple_choice", "prompt": "Whose recipe card does Savannah find?", "options": ["Grandma Lana's", "Aunt Mackenzie's", "Grandma Tina's", "Mom Katie's"]}, {"id": "S1-q2", "type": "multiple_choice", "prompt": "Why did Grandpa Duane bring an oven thermometer?", "options": ["To measure the flour", "To check the weather on the porch", "Because the old oven can run hotter than the dial says", "To time the bread"]}, {"id": "S1-q3", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Summary: In 2-3 sentences, tell the most important things that happen in the story. Include ONE short quote from the story in quotation marks."}, {"id": "S1-q4", "type": "multiple_choice", "prompt": "Which sentence best states the THEME of the story?", "options": ["Pumpkin bread is better than apple crisp", "Old ovens should be thrown away", "Care and precision, passed down in a family, turn a recipe into something everyone can share", "Cooking is only for grown-ups"]}, {"id": "S1-q5", "type": "multiple_choice", "prompt": "AUTHOR'S PURPOSE: Why did the author include the note on the back of the card?", "options": ["To show that Grandma Tina's cursive is messy", "To explain how to grow pumpkins", "To show that the same recipe can be measured in US units or metric units", "To describe Uncle Nick's phone call"]}, {"id": "S1-q6", "type": "multiple_choice", "prompt": "POINT OF VIEW: The story is told in third person. How can you tell?", "options": ["The narrator says 'I' and 'me'", "The narrator talks to the reader as 'you'", "The narrator uses 'she' and 'Savannah' to tell what happens", "Grandma Tina tells the whole story"]}]}, {"id": "S2", "title": "Write: Why Careful Measuring Matters", "tag": "STANDARD", "kind": "writing", "art": {"id": "S2", "label": "Writing paper"}, "banner": null, "notebook": "S2", "questions": [{"id": "S2-q1", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Write two paragraphs. Paragraph 1 (3-4 sentences): explain why careful measuring matters when you bake. Paragraph 2 (3-4 sentences): use one example from the story (leveling the flour, reading the glass cup at eye level, the metric note, or the oven thermometer) and explain what could go wrong without it."}]}, {"id": "S3", "title": "Cursive Copy Line", "tag": "STANDARD", "kind": "cursive", "art": {"id": "S3", "label": "Cursive guide lines"}, "banner": null, "guide": "S3.svg", "questions": [{"id": "S3-q1", "type": "pencil_write", "prompt": "Copy in cursive: Measure twice, then bake with care.", "model_text": "Measure twice, then bake with care."}]}, {"id": "S4", "title": "Kitchen Math", "tag": "STANDARD", "kind": "math", "hint": "8 × 8 = (8 × 4) + (8 × 4).", "art": {"id": "S4", "label": "Math art"}, "banner": "S4", "questions": [{"id": "S4-q1", "type": "number_typed", "prompt": "6 × 6 = ?"}, {"id": "S4-q2", "type": "number_typed", "prompt": "8 × 4 = ?"}, {"id": "S4-q3", "type": "number_typed", "prompt": "7 × 8 = ?"}, {"id": "S4-q4", "type": "number_typed", "prompt": "9 × 3 = ?"}, {"id": "S4-q5", "type": "number_typed", "prompt": "5 × 5 = ?"}, {"id": "S4-q6", "type": "number_typed", "prompt": "4 × 7 = ?"}, {"id": "S4-q7", "type": "number_typed", "prompt": "5 × 9 = ?"}, {"id": "S4-q8", "type": "number_typed", "prompt": "3 × 9 = ?"}, {"id": "S4-q9", "type": "number_typed", "prompt": "6 × 4 = ?"}, {"id": "S4-q10", "type": "number_typed", "prompt": "9 × 9 = ?"}, {"id": "S4-q11", "type": "number_typed", "prompt": "(7 × 4) + (5 × 3) = ?"}, {"id": "S4-q12", "type": "number_typed", "prompt": "(9 × 5) - (4 × 4) = ?"}, {"id": "S4-q13", "type": "number_typed", "prompt": "468 + 357 = ?"}, {"id": "S4-q14", "type": "number_typed", "prompt": "903 - 476 = ?"}]}, {"id": "S5", "title": "Measuring, Units, and Market Rounding", "tag": "STANDARD", "kind": "reading", "pages": ["Unit Chart (US and metric). Volume: 1 cup = 16 tablespoons · 1 tablespoon = 3 teaspoons · 1 cup is about 240 mL · 1/2 cup is about 120 mL. Weight: 1 cup of flour is about 120 grams. Temperature: water freezes at 32°F = 0°C · a warm room is about 70°F = 21°C · water boils at 212°F = 100°C · a baking oven at 350°F is about 180°C.", "Reading the units. US kitchens measure volume in cups, tablespoons, and teaspoons, and temperature in degrees Fahrenheit (°F). The metric system measures volume in milliliters (mL), weight in grams (g), and temperature in degrees Celsius (°C). The same temperature has two different numbers on the two scales, so always check the little letter after the degree sign. A dry measuring cup is filled and leveled. A glass measuring cup is read at eye level. Market tip for rounding money: look at the digit just to the right of the place you are rounding to. If it is 5 or more, round up. If it is 4 or less, keep the digit the same."], "encouragement": "Take it one unit at a time. Check the little letter after the degree sign, and use the chart. You can go back to it as many times as you want.", "art": {"id": "S5", "label": "Story pictures"}, "banner": "S5", "panels": ["S5-1", "S5-2"], "questions": [{"id": "S5-q1", "type": "multiple_choice", "prompt": "Which one is a METRIC unit?", "options": ["Cup", "Tablespoon", "Milliliter", "Degree Fahrenheit"]}, {"id": "S5-q2", "type": "multiple_choice", "prompt": "Which unit tells how HEAVY the flour is?", "options": ["Milliliters", "Degrees Celsius", "Grams", "Tablespoons"]}, {"id": "S5-q3", "type": "number_typed", "prompt": "Use the Unit Chart. Water freezes at 32°F. What is that temperature in °C?"}, {"id": "S5-q4", "type": "number_typed", "prompt": "Use the Unit Chart. A baking oven at 350°F is about how many °C?"}, {"id": "S5-q5", "type": "multiple_choice", "prompt": "Use the Unit Chart. Grandma Tina's card says 1 cup of milk. About how much is that in metric?", "options": ["24 mL", "2 mL", "240 mL", "2,400 mL"]}, {"id": "S5-q6", "type": "multiple_choice", "prompt": "Look at the glass measuring cup. Savannah poured 1/2 cup of milk, then 1/4 cup more. How full is the cup now?", "options": ["1/4 cup", "1 cup", "3/4 cup", "1/3 cup"], "figure": {"src": "S5-measure-a.svg", "alt": "A glass measuring cup with milk", "kind": "chart"}}, {"id": "S5-q7", "type": "multiple_choice", "prompt": "Use the Unit Chart. Which is warmer: 21°C or 50°F?", "options": ["50°F", "They are the same", "21°C"]}, {"id": "S5-q8", "type": "multiple_choice", "prompt": "Market tag: a can of pumpkin is $2.79. Round it to the nearest dollar.", "options": ["$2.00", "$2.70", "$3.00", "$2.80"]}, {"id": "S5-q9", "type": "multiple_choice", "prompt": "Market tag: a jar of cinnamon is $4.36. Round it to the nearest ten cents.", "options": ["$4.30", "$4.00", "$4.40", "$5.00"]}, {"id": "S5-q10", "type": "multiple_choice", "prompt": "Market tag: a bag of flour is $5.52. Round it to the nearest dollar.", "options": ["$5.00", "$5.50", "$6.00", "$5.60"]}]}, {"id": "S6", "title": "Reading Thermometers", "tag": "STANDARD", "kind": "practice", "encouragement": "You've got this! Find the big labeled numbers first, then count the little lines one at a time. Check what each little line counts by before you count. Take your time.", "art": {"id": "S6", "label": "Practice art"}, "banner": null, "layout": "thermo", "questions": [{"id": "S6-q1", "type": "number_typed", "prompt": "Oven thermometer A (right after the oven turns on, still heating). Each little line counts by 10. What temperature does the needle show (°F)?", "figure": {"src": "S6-thermometer-a.svg", "alt": "Oven thermometer showing a temperature", "kind": "thermo"}}, {"id": "S6-q2", "type": "number_typed", "prompt": "Oven thermometer B (a little later). Each little line counts by 10. What temperature does the needle show (°F)?", "figure": {"src": "S6-thermometer-b.svg", "alt": "Oven thermometer showing a temperature", "kind": "thermo"}}, {"id": "S6-q3", "type": "multiple_choice", "prompt": "The recipe needs 350°F. Compare thermometer B to 350°F.", "options": ["B is below 350°F", "B is exactly 350°F", "B is above 350°F"]}, {"id": "S6-q4", "type": "number_typed", "prompt": "Porch thermometer. Each little line counts by 2. What temperature is it outside (°F)?", "figure": {"src": "S6-thermometer-c.svg", "alt": "Outdoor thermometer showing a temperature", "kind": "thermo"}}, {"id": "S6-q5", "type": "multiple_choice", "prompt": "Water freezes at 32°F. Is the porch temperature above or below freezing?", "options": ["Below freezing", "Exactly freezing", "Above freezing"]}]}, {"id": "SA", "title": "ADVANCED • OPTIONAL: Units Matter", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "art": {"id": "SA", "label": "Challenge art"}, "banner": "SA", "notebook": "S2", "questions": [{"id": "SA-q1", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Write a thesis sentence that tells why units and careful measuring matter in a kitchen. Then give TWO pieces of evidence from the story, with one sentence explaining each."}, {"id": "SA-q2", "type": "number_typed", "prompt": "Use the Unit Chart: 1 cup is about 240 mL and 1/2 cup is about 120 mL. A double batch needs 1 1/2 cups of milk. About how many mL is that?"}]}], "lesson_id": "lesson-04", "date": "2026-11-12", "art_dir": "../assets/lesson-04/", "theme_class": "theme-butter-kitchen", "theme_recipe": "Butter Kitchen"}</script><script src="../assets/hs-submit.js?v=5"></script><script src="../assets/lesson.js?v=5"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
