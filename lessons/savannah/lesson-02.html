ing Down Water Cups"}], "sections": [{"id": "S1", "title": "Read: June and the Long Table", "tag": "STANDARD", "kind": "reading", "pages": ["Chapter 1 - The Menu Problem. On the Monday before Thanksgiving, June sat at Grandma Rose's long farm table outside Massillon with a pencil and a very long list. Fourteen people were coming for dinner, and Grandma had put June in charge of the menu. In the next room, her brother Milo was replaying Tigers playoff highlights for the third time. June tapped her pencil. Turkey, stuffing, rolls, potatoes, green beans, and three kinds of pie, and Grandma's farmhouse had only one oven.", "Chapter 2 - One Oven, Many Cooks. June's first plan was simple: Grandma cooks everything. Then she thought about the timing. The turkey alone needed the oven for most of the day. \"There's no way,\" June said. Grandma Rose laughed. \"Then don't make one person do it all. Aunt Tess makes the best pies in Stark County. Uncle Ray smokes a turkey outside every year. Mrs. Patel next door bakes rolls on Wednesdays.\" June's eyes lit up. \"So each cook makes the dish they do best, and we trade.\" Mrs. Patel agreed to bake extra rolls in exchange for one of Aunt Tess's pumpkin pies.", "Chapter 3 - A Harvest Long Ago. That night June worked on her history report about the 1621 harvest celebration at Plymouth. Her book said the colonists' first winter in their new home had been very hard. In the spring, a Wampanoag man named Tisquantum, who spoke English, showed them how to plant corn the Wampanoag way, with small fish buried in each hill to feed the soil. By fall, the colonists had their first good harvest.", "Chapter 4 - Three Days of Sharing. A colonist named Edward Winslow wrote a letter about the celebration. He said the colonists went out hunting birds for the meal. Then the Wampanoag leader Massasoit arrived with about ninety men, and they brought five deer. The celebration lasted three days. June underlined one sentence in her notes: \"Each group brought something the other did not have.\"", "Chapter 5 - The Long Table. On Thanksgiving afternoon, sunlight poured across Grandma Rose's long table. Uncle Ray's smoked turkey sat in the middle, surrounded by Mrs. Patel's rolls and Aunt Tess's pies. Nobody was worn out, and nothing was burned. Grandma raised her glass of cider. \"No one at this table made the whole dinner,\" she said. \"Everyone made the part they do best.\" June smiled and wrote the last line of her report: \"In 1621 and today, people do better when they share what they are good at.\""], "art": {"id": "S1", "label": "Story pictures"}, "banner": "S1", "panels": ["S1-1", "S1-2", "S1-3", "S1-4", "S1-5"], "questions": [{"id": "S1-q1", "type": "multiple_choice", "prompt": "What was June's main problem in Chapter 1?", "options": ["She did not like turkey", "Fourteen guests, a long menu, and only one oven", "Milo lost the menu", "The Tigers game was at dinnertime"]}, {"id": "S1-q2", "type": "multiple_choice", "prompt": "Who showed the colonists how to plant corn with small fish in each hill?", "options": ["Edward Winslow", "Massasoit", "Tisquantum", "Uncle Ray"]}, {"id": "S1-q3", "type": "multiple_choice", "prompt": "What did Mrs. Patel get in exchange for baking extra rolls?", "options": ["Cash", "A smoked turkey", "Football tickets", "One of Aunt Tess's pumpkin pies"]}, {"id": "S1-q4", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Summary: In 2-3 sentences, tell the most important things that happen in the story. Include ONE short quote from the story in quotation marks."}, {"id": "S1-q5", "type": "multiple_choice", "prompt": "Which sentence best states the THEME of the story?", "options": ["Cooking a big dinner is too hard", "People do better when each person shares what they do best", "History reports are boring", "Big families are always loud"]}, {"id": "S1-q6", "type": "multiple_choice", "prompt": "AUTHOR'S PURPOSE: Why did the author put the 1621 harvest inside June's Thanksgiving story?", "options": ["To teach how to smoke a turkey", "To show that sharing and trading worked long ago and still work today", "To explain the rules of football", "To make the story funnier"]}]}, {"id": "S2", "title": "Write: My Thanksgiving Trade", "tag": "STANDARD", "kind": "writing", "art": {"id": "S2", "label": "Writing paper"}, "banner": null, "notebook": "S2", "questions": [{"id": "S2-q1", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Write TWO short paragraphs (3-4 sentences each). Paragraph 1: Plan your own Thanksgiving trade. What dish or job do you do best, and what would you trade it for? Paragraph 2: What are you thankful for this November, and why? Use one idea from the story."}]}, {"id": "S3", "title": "Cursive Copy Line", "tag": "STANDARD", "kind": "cursive", "art": {"id": "S3", "label": "Cursive guide lines"}, "banner": null, "guide": "S3.svg", "questions": [{"id": "S3-q1", "type": "pencil_write", "prompt": "Copy in cursive: Everyone brings what they do best.", "model_text": "Everyone brings what they do best."}]}, {"id": "S4", "title": "Long Table Math", "tag": "STANDARD", "kind": "math", "hint": "9 × 4 = (9 × 2) + (9 × 2).", "art": {"id": "S4", "label": "Math art"}, "banner": "S4", "questions": [{"id": "S4-q1", "type": "number_typed", "prompt": "7 × 8 = ?"}, {"id": "S4-q2", "type": "number_typed", "prompt": "9 × 3 = ?"}, {"id": "S4-q3", "type": "number_typed", "prompt": "4 × 4 = ?"}, {"id": "S4-q4", "type": "number_typed", "prompt": "5 × 9 = ?"}, {"id": "S4-q5", "type": "number_typed", "prompt": "6 × 4 = ?"}, {"id": "S4-q6", "type": "number_typed", "prompt": "3 × 5 = ?"}, {"id": "S4-q7", "type": "number_typed", "prompt": "4 × 7 = ?"}, {"id": "S4-q8", "type": "number_typed", "prompt": "8 × 5 = ?"}, {"id": "S4-q9", "type": "number_typed", "prompt": "3 × 9 = ?"}, {"id": "S4-q10", "type": "number_typed", "prompt": "5 × 5 = ?"}, {"id": "S4-q11", "type": "number_typed", "prompt": "(6 × 6) + (4 × 5) = ?"}, {"id": "S4-q12", "type": "number_typed", "prompt": "(8 × 7) - (3 × 4) = ?"}, {"id": "S4-q13", "type": "number_typed", "prompt": "325 + (8 × 4) = ?"}, {"id": "S4-q14", "type": "number_typed", "prompt": "700 - (5 × 8) = ?"}, {"id": "S4-q15", "type": "number_typed", "prompt": "486 + 357 = ?"}, {"id": "S4-q16", "type": "number_typed", "prompt": "902 - 468 = ?"}]}, {"id": "S5", "title": "Gentle Practice: US or Metric? (optional)", "tag": "OPTIONAL PRACTICE", "kind": "practice", "encouragement": "You've got this! Kitchens use two families of units. Clue: metric unit names usually end in -liter or -gram. Take your time, and peek at a food label if you have one.", "art": {"id": "S5", "label": "Practice art"}, "banner": null, "questions": [{"id": "S5-q1", "type": "tap_to_sort", "prompt": "Tap each unit, then tap its family.", "buckets": ["US customary", "Metric"], "items": ["cup", "liter", "ounce", "gram", "pound", "milliliter", "teaspoon", "kilogram"], "bucket_art": {"US customary": "S5-bucket-us", "Metric": "S5-bucket-metric"}}, {"id": "S5-q2", "type": "multiple_choice", "prompt": "Which is heavier?", "options": ["1 pound", "1 kilogram", "They weigh the same"]}, {"id": "S5-q3", "type": "multiple_choice", "prompt": "Which holds more?", "options": ["1 cup", "1 liter", "They hold the same"]}]}, {"id": "SA", "title": "ADVANCED • OPTIONAL: Compare and Connect", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "art": {"id": "SA", "label": "Challenge art"}, "banner": "SA", "notebook": "S2", "questions": [{"id": "SA-q1", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Write a thesis sentence that tells how June's Thanksgiving and the 1621 harvest are alike. Then give ONE piece of evidence from June's Thanksgiving (Chapter 2 or 5) and ONE from 1621 (Chapter 3 or 4), with one sentence explaining each."}]}], "lesson_id": "lesson-02", "date": "2026-11-11", "art_dir": "../assets/lesson-02/", "theme_class": "theme-thanksgiving-table", "theme_recipe": "Thanksgiving Table"}</script><script src="../assets/lesso
