<p class="sub">Logan&#x27;s Lessons</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Logan", "grade": 2, "title": "Logan and the Thanksgiving Wagon", "theme_word": "THANKS", "subjects": ["Bible (verse and prayer, said out loud)", "Reading", "Science review (simple machines, thermometers)", "History review (the Pilgrims)", "Math (adding)"], "est_minutes": "12-18", "teacher_box": {"who": "Logan, Grade 2, working on his own on the iPad (finger taps only). REVIEW DAY: no writing today, only tapping, sorting and typing numbers. This lesson stays on the iPad; no real baking or crafts. Virtue of the week: GRATITUDE (saying thank you to God and to people). Today's verse: Genesis 8:22 (KJV), the key phrase. Verse of the week Psalm 107:1 is still said out loud on Friday.", "materials": ["iPad (Safari, Urwin Homeschool page)", "Finger (no pencil needed today)", "Optional, with Mom or Dad: a real outdoor thermometer to read, and a ruler on a pencil to make a lever (not in the kitchen)"], "steps": ["Tap the chore boxes as you finish them.", "Verse Spot (2-3 min): tap Hear it, say the verse 3 times, answer 2 tap questions, and say the thank-you prayer out loud.", "Read the 5-part story (tap 'Next' for each part).", "Answer 5 tap questions about the story.", "Machine Match: sort 5 Thanksgiving things into the right simple machine, then 3 quick questions.", "Temperature Check: read 2 thermometers, then 2 tap questions.", "Pilgrim Review: 5 tap questions about the Pilgrims.", "Turkey Day Adding: 4 adding problems.", "Optional: Advanced stretch.", "Together, optional: read a real outdoor thermometer with Mom or Dad, and balance a ruler on a pencil to feel a lever work."], "done_looks_like": "All chores checked, verse said 3 times and the prayer said out loud, story read, 5 story questions answered, all 5 machine cards sorted plus 3 machine questions, 2 thermometers read plus 2 questions, 5 Pilgrim questions, 4 adding answers. Nothing written today. Advanced is optional.", "standard_check": "Says the verse phrase with the reference, names a lever, pulley, wedge, ramp and wheel and axle from the story, reads a thermometer counting by 5s and by 2s, tells which place is warmer, remembers the Mayflower and that the Pilgrims thanked God, and adds two-digit numbers (regrouping OK).", "advanced_stretch": "Adding 10 degrees to a temperature, knowing a lever needs a point to turn on, and a fun fact about how Squanto helped the corn grow."}, "chores": [{"id": "chore-1", "label": "Pick up room (a little more than yesterday)"}, {"id": "chore-2", "label": "Brush teeth"}, {"id": "chore-3", "label": "Clean up spot at the table"}, {"id": "chore-4", "label": "Ask Mom if she needs help with anything"}, {"id": "chore-5", "label": "Take out recycling and trash if needed"}, {"id": "chore-6", "label": "Bring Down Water Cups"}], "sections": [{"id": "LF", "title": "Verse Spot: Genesis 8:22", "tag": "STANDARD", "kind": "faith", "verse": {"text": "While the earth remaineth, seedtime and harvest, and cold and heat ...", "ref": "Genesis 8:22", "version": "KJV", "speak": "While the earth remaineth, seedtime and harvest, and cold and heat. Genesis 8, verse 22."}, "helper": "Helper (not the Bible): \"Remaineth\" means is still here. God keeps His promise. Planting time, harvest time, cold days and hot days keep coming.", "card_lines": [{"label": "Say it:", "text": "Tap Hear it. Then say the verse 3 times."}, {"label": "Pray (out loud):", "text": "Dear God, thank you for ____. Amen. Fill the blank with your own words."}, {"label": "Talk:", "text": "Ask Mom or Dad: Was it cold or hot on Thanksgiving when you were a kid?"}], "art": {"id": "LF", "label": "Verse card"}, "banner": null, "questions": [{"id": "LF-q1", "type": "multiple_choice", "prompt": "God made a promise. What will keep coming?", "options": ["Snow every day", "Planting time and harvest time", "Only summer", "Only night"]}, {"id": "LF-q2", "type": "multiple_choice", "prompt": "Which words in the verse are about temperature?", "options": ["The earth", "Seedtime", "Cold and heat", "Remaineth"]}]}, {"id": "L1", "title": "Story: Logan and the Thanksgiving Wagon", "tag": "STANDARD", "kind": "reading", "pages": ["It is Thanksgiving Day! Logan and his family drive to Grandma Tina and Grandpa Duane's house. It is cold outside. The grass is white with frost. Logan sees the thermometer on the porch. The red line is low. \"Brr!\" says Logan. Inside, the house is warm. Mom Katie hangs up his coat.", "Grandpa Duane needs help. \"We need more chairs,\" he says. Logan puts chairs in his red wagon. The wagon wheels turn on a rod. The rod is an axle. Uncle Nick lays a long board on the back steps. Now it is a ramp. Logan rolls the wagon up the ramp. \"A ramp makes it easy!\" he says.", "The back door keeps closing. Aunt Abby slides a doorstop under it. \"A doorstop is a wedge,\" she says. Now the door stays open. Uncle Michael and Aunt Mackenzie come in. Grandpa Randy and Grandma Lana bring pies. In the garage, Grandpa Duane pulls down on a rope. The rope goes over a pulley. A big box goes up to the top shelf.", "Logan and Grandpa Randy play on the old seesaw. \"A seesaw is a lever,\" says Grandpa Randy. \"It turns on the middle.\" Then Grandpa Randy tells a story. \"Long ago, the Pilgrims came on the Mayflower. Their new friends, the Wampanoag, helped them. In the fall, they had a big harvest. They thanked God.\"", "At dinner, Grandpa Duane reads from the Bible: \"While the earth remaineth, seedtime and harvest, and cold and heat.\" \"God keeps the seasons coming,\" says Mom Katie. Dad Randall prays. Logan says, \"Thank you, God, for my family and the food!\" After dinner, Aunt Mackenzie runs a quiz game. Logan's team gets a point. Everyone cheers."], "art": {"id": "L1", "label": "Story pictures"}, "banner": "L1", "panels": ["L1-1", "L1-2", "L1-3", "L1-4", "L1-5"], "questions": [{"id": "L1-q1", "type": "multiple_choice", "prompt": "WHERE is the family on Thanksgiving Day?", "options": ["At church", "At Grandma Tina and Grandpa Duane's house", "At the park", "At school"]}, {"id": "L1-q2", "type": "multiple_choice", "prompt": "WHAT does Logan put in his red wagon?", "options": ["Pies", "Leaves", "Chairs", "Coats"]}, {"id": "L1-q3", "type": "multiple_choice", "prompt": "WHO slides a doorstop under the door?", "options": ["Logan", "Grandpa Randy", "Aunt Abby", "Uncle Nick"]}, {"id": "L1-q4", "type": "multiple_choice", "prompt": "HOW does the big box go up to the top shelf?", "options": ["Logan throws it", "Grandpa Duane pulls a rope over a pulley", "Uncle Nick climbs a tree", "It rolls up a ramp"]}, {"id": "L1-q5", "type": "multiple_choice", "prompt": "WHO prays at dinner?", "options": ["Aunt Mackenzie", "Logan's team", "Dad Randall", "Grandma Lana"]}]}, {"id": "L2", "title": "Machine Match", "tag": "STANDARD", "kind": "activity", "art": {"id": "L2", "label": "Sort cards"}, "banner": "L2", "questions": [{"id": "L2-q1", "type": "tap_to_sort", "prompt": "Match it! Tap each Thanksgiving thing, then tap the simple machine it is.", "buckets": ["Lever", "Pulley", "Wedge", "Ramp", "Wheel and axle"], "items": ["The doorstop under the door", "The wagon wheels and rod", "The seesaw in the yard", "The board up the back steps", "The rope and wheel in the garage"]}, {"id": "L2-q2", "type": "multiple_choice", "prompt": "A simple machine helps us...", "options": ["sleep", "make work easier", "eat pie", "stay warm"]}, {"id": "L2-q3", "type": "multiple_choice", "prompt": "Grandpa Duane pulls DOWN on the rope. Which way does the box go?", "options": ["Down", "Up", "Sideways", "It does not move"]}, {"id": "L2-q4", "type": "multiple_choice", "tf": true, "prompt": "True or false: A ramp helps you roll a heavy wagon up the steps.", "options": ["True", "False"]}]}, {"id": "L3", "title": "Temperature Check", "tag": "STANDARD", "kind": "practice", "hint": "Find the big number just below the red line. Then count the little lines up to the red line.", "art": {"id": "L3", "label": "Practice art"}, "banner": null, "questions": [{"id": "L3-q1", "type": "number_typed", "prompt": "Look at the porch thermometer. Each little line counts by 5. What temperature is it (°F)?", "figure": {"src": "L3-thermo-a.svg", "alt": "Porch thermometer", "kind": "thermo"}}, {"id": "L3-q2", "type": "number_typed", "prompt": "Look at the living room thermometer. Each little line counts by 2. What temperature is it (°F)?", "figure": {"src": "L3-thermo-b.svg", "alt": "Living room thermometer", "kind": "thermo"}}, {"id": "L3-q3", "type": "multiple_choice", "prompt": "Which place is warmer?", "options": ["The porch", "Inside the living room", "They are the same"]}, {"id": "L3-q4", "type": "multiple_choice", "prompt": "Water freezes at 32°F. Look at the porch thermometer again. Is the porch above or below freezing?", "options": ["Below freezing", "Above freezing"]}], "layout": "thermo"}, {"id": "L4", "title": "Pilgrim Review", "tag": "STANDARD", "kind": "activity", "art": {"id": "L4", "label": "Sort cards"}, "banner": null, "questions": [{"id": "L4-q1", "type": "multiple_choice", "prompt": "What was the name of the Pilgrims' ship?", "options": ["The Big Boat", "The Mayflower", "The Sea Star", "The Ark"]}, {"id": "L4-q2", "type": "multiple_choice", "tf": true, "prompt": "True or false: The trip across the sea was short and easy.", "options": ["True", "False"]}, {"id": "L4-q3", "type": "multiple_choice", "tf": true, "prompt": "True or false: When the Pilgrims got to land, they thanked God.", "options": ["True", "False"]}, {"id": "L4-q4", "type": "multiple_choice", "prompt": "Who helped the Pilgrims learn to plant corn?", "options": ["The king", "Squanto, a Native friend", "A sailor", "A store owner"]}, {"id": "L4-q5", "type": "multiple_choice", "prompt": "In the fall of 1621, the Pilgrims and the Wampanoag...", "options": ["went to school", "shared a big harvest meal", "sailed far away", "built a castle"]}]}, {"id": "L5", "title": "Turkey Day Adding", "tag": "STANDARD", "kind": "math", "art": {"id": "L5", "label": "Math art"}, "banner": null, "questions": [{"id": "L5-q1", "type": "number_typed", "prompt": "Uncle Nick brings 27 rolls. Aunt Abby brings 15 rolls. How many rolls in all? 27 + 15 = ?"}, {"id": "L5-q2", "type": "number_typed", "prompt": "38 + 46 = ?"}, {"id": "L5-q3", "type": "number_typed", "prompt": "53 + 29 = ?"}, {"id": "L5-q4", "type": "number_typed", "prompt": "16 + 23 + 18 = ?"}]}, {"id": "LA", "title": "ADVANCED • OPTIONAL", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "art": {"id": "LA", "label": "Challenge art"}, "banner": null, "questions": [{"id": "LA-q1", "type": "number_typed", "prompt": "A thermometer says 41°F. By lunch it is 10 degrees warmer. What does it say now? 41 + 10 = ?"}, {"id": "LA-q2", "type": "multiple_choice", "prompt": "Grandpa Duane wants to lift a big rock with a long board. What does the board need under it?", "options": ["A pillow", "A log or block to turn on", "A rope", "Some water"]}, {"id": "LA-q3", "type": "multiple_choice", "prompt": "Fun fact! Squanto showed the Pilgrims a trick. What did they bury with the corn seeds?", "options": ["Rocks", "A fish", "A shoe", "Snow"]}]}], "lesson_id": "lesson-06", "date": "2026-11-17", "art_dir": "../assets/lesson-06/", "theme_class": "theme-grandmas-thanksgiving", "theme_recipe": "Grandma's Thanksgiving", "review_day": true, "no_writing": true}</script><script src="../assets/hs-submit.js?v=6"></script><script src="../assets/lesson.js?v=6"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
