<p class="sub">Logan&#x27;s Lessons</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Logan", "grade": 2, "title": "Milo and the Flagpole Crew", "theme_word": "SERVICE", "subjects": ["Reading", "Writing", "Science (weather, simple machines)", "Math", "Art"], "est_minutes": "15-25", "teacher_box": {"who": "Logan, Grade 2, working on his own on the iPad (pencil for writing and drawing).", "materials": ["iPad (Safari, Urwin Homeschool page)", "Apple Pencil or finger", "Optional: real coins for counting"], "steps": ["Tap the chore boxes as you finish them.", "Read the 6-part story (tap 'Next' for each part).", "Answer the who/what/where/when/why/how questions.", "Put the story in order: beginning, middle, end.", "Read the weather log, sort the simple machines, write 2 sentences, and draw the pulley.", "Do Flag Math (adding, subtracting, place value, clocks, counting coins).", "Optional: Advanced stretch."], "done_looks_like": "All chores checked, story read, 6 story questions answered, all 6 story cards sorted, both weather-log questions answered, all 4 machine cards sorted, 2 complete sentences written, a pulley drawing saved, 12 math answers filled in. Advanced is optional.", "standard_check": "Answers who/what/where/when/why/how, puts the story in beginning-middle-end order, reads the weather log, spots a pulley, lever, ramp, and wedge, and gets most Flag Math answers right without help.", "advanced_stretch": "Telling time 15 minutes before 11:00, 3-digit place-value strategies, and a 'think like Mr. Hayes' pulley question."}, "chores": [{"id": "chore-1", "label": "Pick up room (a little more than yesterday)"}, {"id": "chore-2", "label": "Brush teeth"}, {"id": "chore-3", "label": "Clean up spot at the table"}, {"id": "chore-4", "label": "Ask Mom if she needs help with anything"}, {"id": "chore-5", "label": "Take out recycling and trash if needed"}, {"id": "chore-6", "label": "Bring Down Water Cups"}], "sections": [{"id": "L1", "title": "Story: Milo and the Flagpole Crew", "tag": "STANDARD", "kind": "reading", "pages": ["It is Veterans Day morning in Massillon, Ohio. The sky is gray and cloudy, and a cold west wind tugs at Milo's mustard sweater. He walks to the town square with June and Grandpa Joe. At eleven o'clock, the town will raise the flag and say thank you to people who have served.", "The flagpole in the square is very tall. A folded flag sits in a cloth bag at the bottom. Milo looks up and up. \"How do we get the flag all the way to the top?\" he asks.", "Grandpa Joe's friend Mr. Hayes is in charge of the flag crew. He points to a small wheel at the top of the pole with a rope over it. \"That wheel is a pulley,\" he says. \"We pull down on this end of the rope, and the flag goes up. A pulley helps us lift something high.\"", "The wind grows stronger. A wind sock by the library stands out straight. Mr. Hayes says, \"We'll wait for a calmer moment so the flag does not wrap around the pole.\" While they wait, Milo helps with other jobs. They roll a wagon of chairs up a wooden ramp onto the platform. Mr. Hayes uses a long board to lift a heavy crate of programs. A rubber doorstop, shaped like a wedge, holds the platform door open.", "The wind eases. Milo, June, and Mr. Hayes clip the flag to the rope. They pull together. The pulley turns, and the flag climbs the pole, snapping in the leftover breeze. Milo's arms get tired, but he does not let go.", "At eleven o'clock, the square grows quiet. The flag waves at the top. Mr. Hayes whispers, \"We raise it for everyone who served, so we remember to be grateful.\" After the ceremony, Grandpa Joe buys cocoa, and Milo watches the orange-and-black Tigers caps in the crowd. He feels proud he helped."], "art": {"id": "L1", "label": "Story pictures"}, "banner": "L1", "panels": ["L1-1", "L1-2", "L1-3", "L1-4", "L1-5", "L1-6"], "questions": [{"id": "L1-q1", "type": "multiple_choice", "prompt": "WHO is in charge of the flag crew?", "options": ["Grandpa Joe", "Milo", "Mr. Hayes", "June"]}, {"id": "L1-q2", "type": "multiple_choice", "prompt": "WHERE does the story happen?", "options": ["At Grandma Rose's farmhouse", "At a football stadium", "At the town square in Massillon", "At school"]}, {"id": "L1-q3", "type": "multiple_choice", "prompt": "WHEN does the town raise the flag?", "options": ["At eight o'clock", "At noon", "At eleven o'clock", "At three o'clock"]}, {"id": "L1-q4", "type": "multiple_choice", "prompt": "WHAT does the pulley do?", "options": ["It rings a bell", "It holds the door open", "It helps lift the flag up the pole", "It measures the wind"]}, {"id": "L1-q5", "type": "multiple_choice", "prompt": "HOW did they get the chairs onto the platform?", "options": ["They carried each chair up a ladder", "They left the chairs on the sidewalk", "They rolled a wagon up a wooden ramp", "They threw them up"]}, {"id": "L1-q6", "type": "short_typed", "prompt": "WHY did they wait before raising the flag? Answer in a complete sentence."}]}, {"id": "L2", "title": "Story Order: Beginning, Middle, End", "tag": "STANDARD", "kind": "activity", "art": {"id": "L2", "label": "Sort cards"}, "banner": "L2", "questions": [{"id": "L2-q1", "type": "tap_to_sort", "prompt": "Tap each story card, then tap the part of the story where it happens.", "buckets": ["Beginning", "Middle", "End"], "items": ["They wait for the wind to ease and use a ramp and a lever.", "It is Veterans Day morning, and the flag will go up at eleven o'clock.", "Everyone pulls, and the flag climbs to the top.", "Mr. Hayes shows Milo the pulley on the flagpole.", "Milo wonders how the flag will get up the tall pole.", "The square is quiet at eleven o'clock, and Mr. Hayes talks about being grateful."], "bucket_art": {"Beginning": "L2-bucket-beginning", "Middle": "L2-bucket-middle", "End": "L2-bucket-end"}}]}, {"id": "L3", "title": "Weather, Machines, Write and Draw", "tag": "STANDARD", "kind": "writing", "art": {"id": "L3", "label": "Writing paper"}, "banner": null, "notebook": "L3", "canvas_bg": "L3", "questions": [{"id": "L3-q1", "type": "multiple_choice", "prompt": "Look at the weather log. What was the sky like on Wednesday?", "options": ["Sunny", "Foggy", "Cloudy", "Icy"], "figure": {"src": "L3-weather-log.svg", "alt": "A weather log for three days", "kind": "chart"}}, {"id": "L3-q2", "type": "multiple_choice", "prompt": "Look at the weather log. Which day had the strongest wind?", "options": ["Monday", "Tuesday", "Wednesday"], "figure": {"src": "L3-weather-log.svg", "alt": "A weather log for three days", "kind": "chart"}}, {"id": "L3-q3", "type": "tap_to_sort", "prompt": "Tap each tool from the story, then tap the simple machine it is.", "buckets": ["Pulley", "Lever", "Ramp", "Wedge"], "items": ["The ramp for the chair wagon", "The wheel and rope that lift the flag", "The doorstop that holds the door open", "The long board that lifts the crate"], "bucket_art": {"Pulley": "L3-bucket-pulley", "Lever": "L3-bucket-lever", "Ramp": "L3-bucket-ramp", "Wedge": "L3-bucket-wedge"}}, {"id": "L3-q4", "type": "short_typed", "alt_type": "pencil_write", "prompt": "Write 2 complete sentences. Tell one way Milo helped, and why the town raises the flag on Veterans Day."}, {"id": "L3-q5", "type": "pencil_draw", "prompt": "Draw the flag going up the pole. Show the pulley and the rope, and show the wind in the flag."}]}, {"id": "L4", "title": "Flag Math", "tag": "STANDARD", "kind": "math", "art": {"id": "L4", "label": "Math art"}, "banner": "L4", "questions": [{"id": "L4-q1", "type": "number_typed", "prompt": "The crew sets out 35 chairs, then 27 more. How many chairs in all? 35 + 27 = ?"}, {"id": "L4-q2", "type": "number_typed", "prompt": "68 + 19 = ?"}, {"id": "L4-q3", "type": "number_typed", "prompt": "91 - 48 = ?"}, {"id": "L4-q4", "type": "number_typed", "prompt": "100 - 29 = ?"}, {"id": "L4-q5", "type": "number_typed", "prompt": "16 + 34 + 28 = ?"}, {"id": "L4-q6", "type": "number_typed", "prompt": "Type the number: 4 hundreds, 0 tens, 6 ones"}, {"id": "L4-q7", "type": "multiple_choice", "prompt": "Look at the clock. What time is it?", "options": ["8:50", "10:08", "10:40", "11:40"], "figure": {"src": "L4-clock-a.svg", "alt": "Clock showing a time", "kind": "clock"}}, {"id": "L4-q8", "type": "multiple_choice", "prompt": "Look at the clock. What time is it?", "options": ["3:40", "8:03", "8:15", "9:15"], "figure": {"src": "L4-clock-b.svg", "alt": "Clock showing a time", "kind": "clock"}}, {"id": "L4-q9", "type": "multiple_choice", "prompt": "Look at the clock. What time is it?", "options": ["10:10", "2:10", "3:50", "2:50"], "figure": {"src": "L4-clock-c.svg", "alt": "Clock showing a time", "kind": "clock"}}, {"id": "L4-q10", "type": "number_typed", "prompt": "Count the coins: 1 quarter, 3 dimes, 2 nickels, 1 penny. How many cents?", "coins": ["quarter", "dime", "dime", "dime", "nickel", "nickel", "penny"]}, {"id": "L4-q11", "type": "number_typed", "prompt": "Count the coins: 2 quarters, 1 nickel, 3 pennies. How many cents?", "coins": ["quarter", "quarter", "nickel", "penny", "penny", "penny"]}, {"id": "L4-q12", "type": "number_typed", "prompt": "Count the coins: 2 quarters, 2 dimes, 1 nickel, 2 pennies. How many cents?", "coins": ["quarter", "quarter", "dime", "dime", "nickel", "penny", "penny"]}]}, {"id": "LA", "title": "ADVANCED • OPTIONAL", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "art": {"id": "LA", "label": "Challenge art"}, "banner": "LA", "questions": [{"id": "LA-q1", "type": "multiple_choice", "prompt": "The ceremony starts at 11:00. They raise the flag 15 minutes before. What time do they raise the flag?", "options": ["10:15", "11:15", "10:45", "9:45"]}, {"id": "LA-q2", "type": "number_typed", "prompt": "What number is 100 more than 368?"}, {"id": "LA-q3", "type": "number_typed", "prompt": "200 + 40 + 9 = ?"}, {"id": "LA-q4", "type": "short_typed", "prompt": "Think like Mr. Hayes: why does a pulley make it easier to raise a heavy flag?"}]}], "lesson_id": "l
