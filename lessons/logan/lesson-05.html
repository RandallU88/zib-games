0. There is a long table in the big room. It has apples, corn, squash, and round orange pumpkins. \"We will fill baskets for our neighbors,\" Uncle Nick says. \"Some families need a little help this fall.\" Logan counts the empty baskets. There are 12 baskets in a row.", "Logan puts 5 apples in each basket. Then he puts in 2 ears of corn. Mom Katie cuts a pan of corn bread into 4 equal parts. \"Each part is one fourth,\" she says. Logan has his own red apple in his coat. It is his apple. Logan thinks. Then he puts it in a basket too. He chose to give it. It feels good to give.", "On the wall is a big paper tree. It has no leaves yet. Mom Katie hands Logan a paper leaf. \"Write one thing you thank God for,\" she says. Logan thinks hard. He writes, \"My family.\" Grandpa Duane and Grandma Tina write leaves too. Soon the Thankful Tree is full of leaves.", "Then Uncle Nick shows Logan a little wood ship. He made it himself. \"This is the Mayflower,\" he says. \"Long ago, the Pilgrims sailed on it across the sea. The trip was long and hard. When they got to land, they got down on their knees. They thanked God.\" Logan looks at the tiny sails. \"They said thank you, even when it was hard,\" he says.", "At 3:45, Mom Katie leads a thank-you song. Then Dad Randall and Logan take the baskets to the neighbors. A lady at the door smiles big. \"Thank you!\" she says. Logan grins. \"God gave us the food. We just carry it!\" On the way home, Logan looks at the gold leaves. He says his verse: \"O give thanks unto the Lord, for he is good.\""], "art": {"id": "L1", "label": "Story pictures"}, "banner": "L1", "panels": ["L1-1", "L1-2", "L1-3", "L1-4", "L1-5", "L1-6"], "questions": [{"id": "L1-q1", "type": "multiple_choice", "prompt": "WHO asks Logan to be a helper?", "options": ["Grandpa Duane", "Uncle Nick", "Dad Randall", "Savannah"]}, {"id": "L1-q2", "type": "multiple_choice", "prompt": "WHERE does Harvest Day happen?", "options": ["At the farm", "At school", "At church", "At the store"]}, {"id": "L1-q3", "type": "multiple_choice", "prompt": "WHEN does the story happen?", "options": ["On a hot summer day", "On a Sunday in the fall", "On a snowy night", "On a spring morning"]}, {"id": "L1-q4", "type": "multiple_choice", "prompt": "WHAT do they fill for the neighbors?", "options": ["Boxes of toys", "Bags of leaves", "Baskets of food", "Cups of water"]}, {"id": "L1-q5", "type": "multiple_choice", "prompt": "HOW did the Pilgrims thank God when they got to land?", "options": ["They sang on the ship", "They got down on their knees", "They had a big party", "They wrote a letter"]}, {"id": "L1-q6", "type": "short_typed", "prompt": "WHY did Logan give his own red apple? Answer in a complete sentence."}]}, {"id": "L2", "title": "Story Order: Beginning, Middle, End", "tag": "STANDARD", "kind": "activity", "art": {"id": "L2", "label": "Sort cards"}, "banner": "L2", "questions": [{"id": "L2-q1", "type": "tap_to_sort", "prompt": "Tap each story card, then tap the part of the story where it happens.", "buckets": ["Beginning", "Middle", "End"], "items": ["Logan puts a leaf on the Thankful Tree.", "Uncle Nick asks Logan to help.", "Uncle Nick shows the little ship.", "Logan gives his own red apple.", "Logan counts the empty baskets.", "Logan and Dad take the baskets to the neighbors."], "bucket_art": {"Beginning": "L2-bucket-beginning", "Middle": "L2-bucket-middle", "End": "L2-bucket-end"}}]}, {"id": "L3", "title": "Harvest Words: Read, Think, Write, Draw", "tag": "STANDARD", "kind": "writing", "art": {"id": "L3", "label": "Writing paper"}, "banner": null, "notebook": "L3", "canvas_bg": "L3", "questions": [{"id": "L3-q1", "type": "multiple_choice", "prompt": "What does HARVEST mean?", "options": ["A kind of boat", "The food we pick in the fall", "A song at church", "A cold winter day"]}, {"id": "L3-q2", "type": "multiple_choice", "prompt": "Which word means people who live near you?", "options": ["Pilgrims", "Baskets", "Neighbors", "Leaves"]}, {"id": "L3-q3",
