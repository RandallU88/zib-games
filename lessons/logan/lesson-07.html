<p class="sub">Logan&#x27;s Lessons</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Logan", "grade": 2, "title": "Logan and the Great Pie Rescue", "theme_word": "FORGIVE", "subjects": ["Bible (verse and prayer, said out loud)", "Reading (comic story, beginning, middle and end)", "Math (adding, time, coins, halves and fourths, even and odd)"], "est_minutes": "12-18", "teacher_box": {"who": "Logan, Grade 2, working on his own on the iPad (finger taps only). FUN REVIEW DAY: no writing today, only tapping, sorting and typing numbers. This lesson stays on the iPad; the pies are only in the story (no baking or kitchen work). Virtues: HONESTY and FORGIVENESS. Today's verse: Ephesians 4:32 (KJV), the key phrase. Verse of the week Psalm 107:1 is still said out loud on Friday.", "materials": ["iPad (Safari, Urwin Homeschool page)", "Finger (no pencil needed today)"], "steps": ["Tap the chore boxes as you finish them.", "Verse Spot (2-3 min): tap Hear it, say the verse 3 times, answer 2 tap questions, and say the one-line prayer out loud.", "Read the 5-part comic story (tap 'Next' for each part).", "Answer 5 tap questions, then sort the story into beginning, middle and end.", "Clue Math: 4 adding clues and 1 even or odd clue.", "Pie Truck Clock: read the clock, then 1 time question.", "Bakery Coins: count 2 sets of coins.", "Pie Pieces: 3 tap questions about halves and fourths.", "Optional: Advanced stretch."], "done_looks_like": "All chores checked, verse said 3 times and the prayer said out loud, story read, 5 story questions plus the beginning, middle and end sort, 5 clue math answers, 2 time answers, 2 coin answers, 3 pie piece answers. Nothing written today. Advanced is optional.", "standard_check": "Says the verse phrase with the reference and tells what forgive means, retells the story in order (beginning, middle, end), adds two-digit numbers (regrouping OK), tells even from odd, reads a clock to 5 minutes, counts quarters, dimes, nickels and pennies, and knows halves and fourths of a pie.", "advanced_stretch": "Adding three numbers, a clock time 20 minutes later, a bigger coin count, and a true-or-false about the story."}, "chores": [{"id": "chore-1", "label": "Pick up room (a little more than yesterday)"}, {"id": "chore-2", "label": "Brush teeth"}, {"id": "chore-3", "label": "Clean up spot at the table"}, {"id": "chore-4", "label": "Ask Mom if she needs help with anything"}, {"id": "chore-5", "label": "Take out recycling and trash if needed"}, {"id": "chore-6", "label": "Bring Down Water Cups"}], "sections": [{"id": "LF", "title": "Verse Spot: Ephesians 4:32", "tag": "STANDARD", "kind": "faith", "verse": {"text": "And be ye kind one to another, tenderhearted, forgiving one another ...", "ref": "Ephesians 4:32", "version": "KJV", "speak": "And be ye kind one to another, tenderhearted, forgiving one another. Ephesians 4, verse 32."}, "helper": "Helper (not the Bible): \"Tenderhearted\" means having a soft, kind heart. God forgives us, so we forgive others too.", "card_lines": [{"label": "Say it:", "text": "Tap Hear it. Then say the verse 3 times."}, {"label": "Pray (out loud):", "text": "Dear God, help me tell the truth and forgive others. Amen."}], "art": {"id": "LF", "label": "Verse card"}, "banner": null, "questions": [{"id": "LF-q1", "type": "multiple_choice", "prompt": "What does it mean to forgive?", "options": ["To stay mad", "To let go of the wrong and be kind again", "To hide", "To yell"]}, {"id": "LF-q2", "type": "multiple_choice", "prompt": "Tenderhearted means...", "options": ["having a hard heart", "having a soft, kind heart", "being very tall", "being very fast"]}]}, {"id": "L1", "title": "Comic Story: Logan and the Great Pie Rescue", "tag": "STANDARD", "kind": "reading", "pages": ["It is the day before Thanksgiving. Logan and Savannah are at Grandma Tina's house. Grandma Tina made four pies. She sets them on the porch table to cool. Then she looks again. \"My pies are gone!\" she says. Logan fixes his blue glasses. \"We will find them!\" he says.", "Logan looks on the porch steps. He sees pie crumbs! The crumbs go down the walk. Next to the crumbs is a big boot print. \"Who has big feet?\" asks Logan. Savannah gets out a notebook. Grandpa Duane gets the car keys. \"Let's go to town,\" says Dad Randall.", "The family drives to the bakery in Massillon. The baker smiles. \"A tall man came in,\" she says. \"He wanted a pie box. He paid with coins.\" Logan counts the coins on the counter. Mom Katie looks at the clock. \"He was here a little while ago,\" says the baker.", "Next they go to the park. Grandpa Duane looks under a bench. He finds a pie tin. It is empty! A thread is stuck on it. The thread is black and orange. \"I know who wears black and orange!\" says Savannah. Logan laughs. \"Uncle Nick!\"", "They go back to Grandma Tina's house. Uncle Nick's truck is there. He opens the door. Three pies sit on the seat. \"I wanted to taste-test,\" says Uncle Nick. \"I ate a whole pie. I should have asked. I am sorry.\" Grandma Tina hugs him. \"I forgive you,\" she says. \"Thank you for telling the truth.\" Dad Randall prays. \"Thank you, God, for pies and for forgiveness!\""], "art": {"id": "L1", "label": "Story pictures"}, "banner": "L1", "panels": ["L1-1", "L1-2", "L1-3", "L1-4", "L1-5"], "questions": [{"id": "L1-q1", "type": "multiple_choice", "prompt": "WHAT is missing at the start?", "options": ["Grandma's cane", "Grandma Tina's pies", "Logan's glasses", "The car keys"]}, {"id": "L1-q2", "type": "multiple_choice", "prompt": "WHAT does Logan see on the porch steps?", "options": ["Snow", "Pie crumbs", "A cat", "A ball"]}, {"id": "L1-q3", "type": "multiple_choice", "prompt": "WHERE does Grandpa Duane find the empty pie tin?", "options": ["At church", "Under a bench at the park", "In the bakery", "On the roof"]}, {"id": "L1-q4", "type": "multiple_choice", "prompt": "WHY did Uncle Nick take the pies?", "options": ["He wanted to hide them", "He wanted to taste-test", "He wanted to sell them", "He was cold"]}, {"id": "L1-q5", "type": "multiple_choice", "prompt": "WHAT does Grandma Tina say to Uncle Nick?", "options": ["Go home", "I forgive you", "No more pie", "You are in trouble"]}, {"id": "L1-q6", "type": "tap_to_sort", "prompt": "Retell it! Tap each part, then tap BEGINNING, MIDDLE or END.", "buckets": ["Beginning", "Middle", "End"], "items": ["The family finds an empty pie tin at the park", "Grandma Tina's pies are gone", "Uncle Nick says sorry, and Grandma forgives him", "The baker tells about a tall man with coins"]}]}, {"id": "L2", "title": "Clue Math", "tag": "STANDARD", "kind": "math", "hint": "Add the ones first. If the ones make 10 or more, carry 1 ten.", "art": {"id": "L2", "label": "Math art"}, "banner": null, "questions": [{"id": "L2-q1", "type": "number_typed", "prompt": "Clue 1: 34 + 25 = ?"}, {"id": "L2-q2", "type": "number_typed", "prompt": "Clue 2: 47 + 36 = ?"}, {"id": "L2-q3", "type": "number_typed", "prompt": "Clue 3: 28 + 28 = ?"}, {"id": "L2-q4", "type": "number_typed", "prompt": "Clue 4: 15 + 22 + 31 = ?"}, {"id": "L2-q5", "type": "multiple_choice", "prompt": "Clue 5: The big boot print is size 13. Is 13 even or odd?", "options": ["Even", "Odd"]}]}, {"id": "L3", "title": "Pie Truck Clock", "tag": "STANDARD", "kind": "practice", "hint": "The short hand tells the hour. The long hand tells the minutes: count by 5s.", "art": {"id": "L3", "label": "Practice art"}, "banner": null, "questions": [{"id": "L3-q1", "type": "multiple_choice", "prompt": "Look at the bakery clock. What time is it?", "options": ["5:20", "4:25", "4:05", "5:25"], "figure": {"src": "L3-clock.svg", "alt": "Bakery clock", "kind": "clock"}}, {"id": "L3-q2", "type": "multiple_choice", "prompt": "The family gets to the park at 3:10. They find the pie tin 5 minutes later. What time is it?", "options": ["3:20", "3:15", "4:10", "3:05"]}]}, {"id": "L4", "title": "Bakery Coins", "tag": "STANDARD", "kind": "ma
