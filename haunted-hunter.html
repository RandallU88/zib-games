<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#07040d;overflow:hidden;overscroll-behavior:none;touch-action:none;-ms-touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}

#cv{position:fixed;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated;background:#000;touch-action:none}
#pad{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}

#pad.land .pb,#pad.land #dpad{opacity:.72}

.pb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:3px solid rgba(255,255,255,.38);background:rgba(34,16,52,.5);color:#fff;
  font-weight:900;display:flex;align-items:center;justify-content:center;flex-direction:column;letter-spacing:.04em;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.5)}

.pb.dn{background:rgba(255,154,74,.62);border-color:#ffd166;transform:scale(.94)}
.pb.jump{background:rgba(255,138,42,.45);border-color:rgba(255,209,102,.7)}
.pb.whip{background:rgba(216,50,47,.42);border-color:rgba(255,150,140,.7)}
.pb.shoot{background:rgba(94,200,240,.36);border-color:rgba(160,230,255,.7)}
.pb.swap{background:rgba(182,156,255,.36);border-color:rgba(200,180,255,.7)}
#dpad{position:absolute;pointer-events:auto;touch-action:none;border-radius:26px;border:3px solid rgba(255,255,255,.38);background:rgba(34,16,52,.5);display:flex}

.chrome.on{display:block}
#hint{position:fixed;left:0;right:0;text-align:center;color:#cbb8ff;font-weight:800;font-size:15px;display:none;z-index:4;pointer-events:none}
#hint.on{display:block}
#ov{position:fixed;inset:0;display:none;z-index:10;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at center,rgba(24,8,36,.5),rgba(5,2,10,.86));padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

  text-shadow:4px 4px 0 #3a0a3a,8px 8px 0 rgba(0,0,0,.45),0 0 30px rgba(255,140,40,.55)}

.keys b{color:#ffd166}
.small{font-size:13px!important;color:#a99bd0!important}

<body>

<script>
(()=>{
'use strict';
// ---------- basics ----------
const H=216, TS=16;
let W=384;
const cv=document.getElementById('cv');
let ctx=cv.getContext('2d');
const DEBUG=/debug/.test(location.hash);
const SAVE_KEY='hauntedHunter.v1';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sgn=v=>v>0?1:v<0?-1:0;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function rng(seed){return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function loadSave(){let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){}
  const d={v:1,beaten:{},diff:'normal',sound:false,best:0,won:false};
  if(!s||typeof s!=='object')return d; return Object.assign(d,s,{beaten:Object.assign({},s.beaten||{})});}
let save=loadSave();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const easy=()=>save.diff==='easy';

const STAGES=[
 {id:'fields',name:'PUMPKIN FIELDS',boss:'PUMPKIN KING',reward:'bomb',song:0,icon:'🎃'},
 {id:'graveyard',name:'MOONLIT GRAVEYARD',boss:'BONE BARON',reward:'corn',song:1,icon:'💀'},
 {id:'forest',name:'HOWLING FOREST',boss:'WOLFGANG',reward:'bats',song:2,icon:'🐺'},
 {id:'mansion',name:'HAUNTED MANSION',boss:'GRIMELDA',reward:null,song:3,icon:'🏚️'},
];
const WEAPONS={lantern:{name:'LANTERN',cost:0},bomb:{name:'PUMPKIN BOMB',cost:3},corn:{name:'CANDY CORN',cost:2},bats:{name:'BAT SWARM',cost:4}};
function owned(){const w=['lantern'];if(save.beaten.fields)w.push('bomb');if(save.beaten.graveyard)w.push('corn');if(save.beaten.forest)w.push('bats');return w;}

// ---------- levels ----------
function makeLevel(id){
  const cols={fields:190,graveyard:200,forest:210,mansion:220}[id];
  const L={id,cols,rows:14,t:new Uint8Array(cols*14),ents:[],props:[],cps:[],plats:[],arena:cols-30};
  const set=(x,y,v)=>{if(x>=0&&x<cols&&y>=0&&y<14)L.t[y*cols+x]=v;};
  const G=(a,b,top)=>{for(let x=a;x<b;x++)for(let y=top;y<14;y++)set(x,y,1);};
  const P=(a,b,row)=>{for(let x=a;x<b;x++)set(x,row,2);};
  const S=(a,b,row)=>{for(let x=a;x<b;x++)set(x,row,3);};
  const E=(type,x,row)=>L.ents.push({type,cx:x,row});
  const C=(x,row,drop)=>L.props.push({x:x*16+4,y:row*16-16,w:8,h:16,drop:drop||null});
  const K=x=>L.cps.push({x:x*16+2,y:11*16-26,w:12,h:26,lit:false});
  const M=(x,row,ax,range,spd,ph)=>L.plats.push({bx:x*16,by:row*16,ax,range:range*16,spd:spd||0.02,ph:ph||0});
  if(id==='fields'){
    G(0,24,11);C(7,11);C(15,11,'spark');E('pumpkin',21,11);
    G(27,52,11);P(31,35,8);C(33,8,'heart');E('bat',38,6);G(41,46,9);C(43,9);E('pumpkin',50,11);
    G(52,72,11);K(53);S(58,61,11);E('skeleton',66,11);C(63,11,'candy');
    M(72,9,'x',4,0.018);
    G(78,100,11);E('bat',82,5);E('bat',90,6);G(85,90,8);C(87,8,'spark');E('pumpkin',97,11);
    G(103,132,11);E('witch',112,4);P(112,116,8);P(118,122,5);C(120,5,'heart');E('pumpkin',127,11);K(129);
    G(132,140,11);S(135,137,11);
    M(140,9,'x',3,0.02);
    G(146,190,11);E('skeleton',150,11);E('bat',154,5);C(152,11,'heart');K(157);
  } else if(id==='graveyard'){
    G(0,20,11);C(6,11);E('skeleton',16,11);G(20,23,10);
    G(26,46,11);E('ghost',32,8);P(34,38,8);C(36,8,'spark');S(40,43,11);E('bat',44,5);
    G(46,50,9);G(50,54,7);C(52,7,'heart');
    G(54,74,11);K(56);E('skeleton',62,11);E('skeleton',70,11);C(66,11,'candy');
    M(74,10,'x',3,0.02);
    G(80,96,11);E('ghost',86,7);E('bat',90,6);C(84,11);
    G(96,110,8);E('skeleton',104,8);C(100,8,'spark');
    G(110,130,11);S(112,115,11);E('ghost',120,7);E('pumpkin',126,11);K(128);
    G(130,134,11);M(134,11,'y',4,0.02);G(138,150,7);E('witch',145,4);C(142,7,'heart');
    G(150,200,11);E('skeleton',156,11);E('bat',162,5);C(160,11,'heart');K(166);
  } else if(id==='forest'){
    G(0,22,11);C(8,11);E('wolf',18,11);
    G(25,40,11);E('bat',30,5);P(30,34,8);P(36,40,6);C(38,6,'spark');
    G(43,60,11);E('ghost',50,7);E('pumpkin',57,11);G(52,55,9);
    G(60,64,11);K(61);
    M(64,10,'x',2,0.02);M(70,10,'x',2,0.02,1.2);
    G(74,95,11);E('witch',80,4);E('wolf',88,11);C(84,11,'heart');S(91,94,11);
    G(95,99,8);G(99,103,6);C(101,6,'candy');
    G(103,125,11);E('bat',108,6);E('bat',112,4);E('pumpkin',118,11);K(122);
    G(125,140,11);S(128,131,11);E('wolf',136,11);
    G(143,160,11);E('ghost',148,7);E('witch',154,4);P(146,150,8);C(148,8,'spark');
    G(160,210,11);E('wolf',165,11);E('bat',170,5);C(168,11,'heart');K(176);
  } else {
    for(let x=0;x<cols;x++)set(x,0,1);
    G(0,30,11);C(5,11);C(12,11,'spark');P(14,18,8);C(16,8,'heart');E('ghost',15,7);E('skeleton',22,11);E('bat',26,5);
    G(33,56,11);E('witch',40,4);S(44,47,11);E('pumpkin',48,11);C(52,11,'spark');
    G(56,62,8);G(62,80,11);K(64);E('ghost',70,7);E('wolf',76,11);C(68,11,'candy');
    M(80,9,'x',3,0.022);M(86,9,'x',2,0.03);
    G(90,110,11);E('bat',94,5);E('bat',100,6);E('skeleton',106,11);
    G(110,130,11);S(113,116,11);S(120,123,11);P(112,117,8);P(119,124,8);C(121,8,'heart');E('ghost',118,5);K(128);
    G(130,134,11);M(134,11,'y',4,0.02);G(138,150,7);E('witch',145,4);C(141,7,'spark');
    G(150,220,11);E('wolf',156,11);E('skeleton',164,11);E('ghost',170,7);E('bat',176,5);C(160,11,'heart');C(172,11,'spark');K(186);
  }
  G(L.arena,cols,11);
  return L;
}
// ---------- themes (tiles + parallax), drawn in code ----------
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const THEMES={};
const PAL={
 fields:{sky:['#1a0f3a','#5a2a5a','#e0703a'],moon:'#ffcf7a',mr:24,d:'#5a3a22',d2:'#4a2e1a',g:'#4f7a2a',g2:'#e0a43a',p:'#8a5a2b',p2:'#5a3a1a',s:'#2f4a1a',s2:'#9aba5a'},
 graveyard:{sky:['#060a1a','#1a2a4a','#3a4a6a'],moon:'#e8f0ff',mr:16,d:'#3a3644',d2:'#2c2834',g:'#3f5a4a',g2:'#7a9a8a',p:'#6a6774',p2:'#4a4754',s:'#8a8f9a',s2:'#d8dce8'},
 forest:{sky:['#070d10','#14262a','#2e4440'],moon:'#d8f0c0',mr:13,d:'#3a2a1a',d2:'#2c1f12',g:'#2f6a3a',g2:'#6ab04a',p:'#6a4424',p2:'#3a2412',s:'#5a3a3a',s2:'#c88a6a'},
 mansion:{sky:['#120818','#24122e','#3a1a40'],moon:'#c8d8ff',mr:14,d:'#3a2232',d2:'#2a1824',g:'#8a2a3a',g2:'#c84a4a',p:'#7a4a2a',p2:'#ffd166',s:'#a0a0b8',s2:'#ececf8'}
};
function genTheme(id){
  const p=PAL[id], r=rng(id.length*977+13);
  const g=(c)=>c.getContext('2d');
  const rect=(x2,x,y,w,h,c)=>{x2.fillStyle=c;x2.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
  const fill=mk(16,16),top=mk(16,16),plat=mk(16,8),spike=mk(16,16);
  let f=g(fill);rect(f,0,0,16,16,p.d);
  if(id==='mansion'||id==='graveyard'){rect(f,0,7,16,1,p.d2);rect(f,0,15,16,1,p.d2);rect(f,7,0,1,7,p.d2);rect(f,3,8,1,7,p.d2);rect(f,12,8,1,7,p.d2);}
  for(let i=0;i<9;i++)rect(f,r()*15,r()*15,1+(r()*2|0),1,p.d2);
  let t=g(top);t.drawImage(fill,0,0);
  if(id==='mansion'){rect(t,0,0,16,4,p.g);rect(t,0,0,16,1,p.g2);rect(t,0,4,16,1,'#ffd166');}
  else{rect(t,0,0,16,4,p.g);for(let i=0;i<6;i++)rect(t,r()*15,0,1,1,p.g2);for(let i=0;i<5;i++)rect(t,r()*15,4,1,1+(r()*3|0),p.g);
    if(id==='fields')for(let i=0;i<3;i++)rect(t,r()*14,r()*2,1,2,p.g2);}
  let pl=g(plat);rect(pl,0,0,16,6,p.p);rect(pl,0,6,16,2,p.p2);rect(pl,0,0,16,1,'rgba(255,255,255,.25)');rect(pl,7,1,1,5,p.p2);rect(pl,2,2,1,1,p.p2);rect(pl,12,3,1,1,p.p2);
  if(id==='mansion')rect(pl,0,5,16,1,p.p2);
  let sp=g(spike);for(let i=0;i<4;i++){for(let k=0;k<12;k++){const w=Math.max(1,Math.floor(k/3)+1);rect(sp,i*4+2-Math.floor(w/2),3+k,w,1,k<2?p.s2:p.s);}}rect(sp,0,14,16,2,p.d2);
  const sky=mk(1,H);const sg=g(sky);const gr=sg.createLinearGradient(0,0,0,H);gr.addColorStop(0,p.sky[0]);gr.addColorStop(.6,p.sky[1]);gr.addColorStop(1,p.sky[2]);sg.fillStyle=gr;sg.fillRect(0,0,1,H);
  const far=mk(512,H),mid=mk(512,H),fa=g(far),mi=g(mid);
  const hill=(x2,base,amp,col,k1,k2)=>{for(let x=0;x<512;x++){const y=base+Math.sin(x/512*Math.PI*2*k1)*amp+Math.sin(x/512*Math.PI*2*k2+1.3)*amp*.5;rect(x2,x,y,1,H-y,col);}};
  const tri=(x2,cx,y,h,col)=>{for(let k=0;k<h;k++)rect(x2,cx-k,y+k,k*2+1,1,col);};
  if(id==='fields'){
    hill(fa,140,10,'#2a1838',2,5);
    rect(fa,300,108,44,34,'#2a1838');tri(fa,322,86,22,'#2a1838');rect(fa,316,120,12,22,'#e0a050');rect(fa,321,120,2,22,'#2a1838');
    rect(fa,118,90,4,52,'#2a1838');for(let a=0;a<4;a++){const ang=a*Math.PI/2+.4;for(let k=0;k<18;k++)rect(fa,120+Math.cos(ang)*k,92+Math.sin(ang)*k,2,2,'#2a1838');}
    hill(mi,172,5,'#1d1028',3,7);
    for(let x=0;x<512;x+=7){const hh=26+r()*16;rect(mi,x,170-hh,2,hh+10,'#2a1a14');rect(mi,x-3,170-hh+8,3,2,'#3a2a14');rect(mi,x+2,170-hh+14,3,2,'#3a2a14');rect(mi,x,170-hh-3,2,3,'#c8963a');}
    for(let x=20;x<512;x+=64){const y=176;rect(mi,x,y-10,12,9,'#e8742a');rect(mi,x+1,y-11,10,1,'#e8742a');rect(mi,x+5,y-13,2,3,'#3f6a2a');rect(mi,x+2,y-7,2,2,'#ffe96a');rect(mi,x+8,y-7,2,2,'#ffe96a');rect(mi,x+3,y-4,6,1,'#ffe96a');}
    for(let x=0;x<512;x+=24){rect(mi,x,150,3,26,'#3a2416');}rect(mi,0,156,512,2,'#3a2416');rect(mi,0,166,512,2,'#3a2416');
    rect(mi,250,124,2,40,'#2a1a14');rect(mi,240,132,22,2,'#2a1a14');rect(mi,246,118,10,9,'#c89a5a');rect(mi,243,116,16,3,'#2a1a14');rect(mi,247,134,8,14,'#6a3a2a');
  } else if(id==='graveyard'){
    hill(fa,150,8,'#121a2a',2,3);
    rect(fa,360,96,30,56,'#121a2a');tri(fa,375,70,26,'#121a2a');rect(fa,374,58,2,14,'#121a2a');rect(fa,370,62,10,2,'#121a2a');rect(fa,372,110,6,10,'#e0c070');

function handleShoot(){
  const w=curWeapon();
  if(w==='lantern'){
    if(inp.pressed.shoot){if(shots.filter(s=>s.k==='lan').length<3)fire('lan');P.charge=1;}
    else if(inp.down.shoot&&P.charge>0){P.charge++;if(P.charge===CHARGE)sfx('charged');}
    else if(!inp.down.shoot&&P.charge>0){if(P.charge>=CHARGE)fire('big');P.charge=0;}
  } else if(inp.pressed.shoot){const c=WEAPONS[w].cost;if(ammo>=c){ammo-=c;fire(w);}else{sfx('empty');popup(P.x-20,P.y-8,'NEED SPARKS','#7cc8ff');}}
}
function fire(k){
  const f=P.face,cx=P.x+P.w/2;P.shootPose=12;
  if(k==='lan'){shots.push({k,x:f>0?P.x+P.w:P.x-6,y:P.y+8,w:6,h:4,vx:f*4.2,vy:0,g:0,life:60,dmg:1});sfx('lan');}
  else if(k==='big'){shots.push({k,x:f>0?P.x+P.w:P.x-12,y:P.y+4,w:12,h:12,vx:f*4.6,vy:0,g:0,life:90,dmg:4,pierce:true,hits:new Set()});sfx('big');shake=Math.max(shake,2);}
  else if(k==='bomb'){shots.push({k,x:cx-4,y:P.y+2,w:8,h:8,vx:f*2.3,vy:-4.2,g:.25,life:140,dmg:4,boom:true});sfx('throw');}
  else if(k==='corn'){for(const a of [-.22,0,.22])shots.push({k,x:cx-3,y:P.y+8,w:6,h:6,vx:Math.cos(a)*3.4*f,vy:Math.sin(a)*3.4,g:0,life:75,dmg:2});sfx('throw');}
  else if(k==='bats'){for(let i=0;i<3;i++)shots.push({k:'bat',x:cx-4,y:P.y+4+i*4,w:8,h:6,vx:f*2,vy:(i-1)*1.1,g:0,life:170,dmg:2,homing:true});sfx('cast');}
}
function updatePlayer(){
  const p=P;
  if(p.dead){p.deadT++;if(p.deadT===100)afterDeath();return;}
  if(p.inv>0)p.inv--;if(p.shootPose>0)p.shootPose--;
  if(p.ride){p.x+=p.ride.dx;p.y+=p.ride.dy;}
  const mv=(inp.down.right?1:0)-(inp.down.left?1:0);
  if(inp.pressed.jump)p.jbuf=7;else if(p.jbuf>0)p.jbuf--;
  if(p.stun>0){p.stun--;p.vx*=.92;}
  else{
    p.vx=(p.atk>0&&p.onGround)?0:mv*RUN;
    if(mv&&p.atk===0)p.face=mv;
    if(p.jbuf>0&&(p.onGround||p.coyote>0)){p.vy=JUMPV;p.onGround=false;p.coyote=0;p.jbuf=0;p.ride=null;sfx('jump');}
    if(!inp.down.jump&&p.vy<-2.2)p.vy=-2.2;
    if(inp.pressed.whip&&p.atk===0){p.atk=20;p.atkHit=new Set();sfx('whip');}
    if(inp.pressed.swap)swapWeapon();
    handleShoot();
  }
  if(p.atk>0)p.atk--;
  p.vy=Math.min(MAXF,p.vy+GRAV);
  const pb=p.y+p.h;
  moveBody(p);
  p.ride=null;
  for(const m of plats){if(p.vy>=0&&pb<=m.py+2&&p.y+p.h>=m.y&&p.x+p.w>m.x&&p.x<m.x+m.w){p.y=m.y-p.h;p.vy=0;p.onGround=true;p.ride=m;}}
  if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
  if(lockCam){const l=cam.x+2,r=cam.x+W-p.w-2;if(p.x<l)p.x=l;if(p.x>r)p.x=r;}
  if(p.onGround&&!p.ride){const cy=Math.floor((p.y+p.h+1)/TS);for(let cx=Math.floor(p.x/TS);cx<=Math.floor((p.x+p.w-.01)/TS);cx++)if(tileAt(cx,cy)===3){
    if(p.inv===0&&!god){hurtPlayer(dmg(3),p.x+p.w/2+p.face*8);if(!p.dead)p.vy=-5;}break;}}
  if(p.y>lvl.rows*TS+24){p.hp=0;killPlayer();return;}
  if(p.atk>=6&&p.atk<=13){const b=whipBox();hitTargets(b,2,'whip',p.atkHit);
    for(const s of eshots)if(!s.dead&&ov(b,s)){s.dead=true;burst(s.x+3,s.y+3,'#ffd166',5);score+=10;}}
  for(let i=0;i<lvl.cps.length;i++){const c=lvl.cps[i];if(!c.lit&&ov(p,c)){c.lit=true;cpIndex=i;p.hp=Math.min(p.max,p.hp+4);sfx('cp');popup(c.x-14,c.y-10,'CHECKPOINT','#ffd166');burst(c.x+6,c.y+3,'#ffd166',12);}}
}

// ---------- combat ----------
function damageEnemy(e,d){e.hp-=d;e.flash=8;sfx('hit');burst(e.x+e.w/2,e.y+e.h/2,'#fff',4);
  if(e.hp<=0){e.dead=true;const C={bat:'#6a3a8a',skeleton:'#ece6d6',ghost:'#dfe8ff',pumpkin:'#ff8a2a',witch:'#8fd16a',wolf:'#8a84a0'}[e.type];
    burst(e.x+e.w/2,e.y+e.h/2,[C,'#ffd166','#fff'],14);score+=e.score;popup(e.x,e.y-4,''+e.score,'#ffe08a');sfx('kill');
    if(Math.random()<(easy()?.35:.22))spawnDrop(randomDrop(),e.x+e.w/2,e.y);}}
function randomDrop(){const r=Math.random();return r<.45?'candy':r<.75?'spark':'heart';}
function spawnDrop(k,x,y){drops.push({k,x:x-4,y:y-4,w:8,h:8,vx:0,vy:-2,life:k==='orb'?1e9:600});}
function breakProp(p){p.dead=true;burst(p.x+4,p.y+4,['#ffd166','#ff8a2a','#fff'],10);sfx('brk');spawnDrop(p.drop||randomDrop(),p.x+4,p.y+4);score+=20;}
function hitTargets(box,d,kind,set){
  let any=false;
  for(const e of ents){if(e.dead||!e.act||e.phased)continue;if(set&&set.has(e))continue;if(ov(box,e)){any=true;if(set)set.add(e);damageEnemy(e,d);if(!set)return true;}}
  for(const p of props){if(p.dead)continue;if(set&&set.has(p))continue;if(ov(box,p)){any=true;if(set)set.add(p);breakProp(p);if(!set)return true;}}
  if(boss&&!(set&&set.has(boss))&&ov(box,boss)&&boss.fade>.5){if(set)set.add(boss);hitBoss(d,kind);any=true;}
  return any;
}
function explode(s){const a={x:s.x+s.w/2-22,y:s.y+s.h/2-22,w:44,h:44};hitTargets(a,4,'bomb',new Set());burst(a.x+22,a.y+22,['#ff8a2a','#ffd166','#fff','#c84a1a'],26,1.6);shake=Math.max(shake,4);sfx('boom');}
function updateShots(){
  for(const s of shots){
    s.life--;if(s.life<=0){s.dead=true;continue;}
    if(s.homing){let best=null,bd=1e9;const cx=s.x+4,cy=s.y+3;for(const e of ents){if(e.dead||!e.act||e.phased)continue;const d=Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy);if(d<bd&&d<240){bd=d;best=e;}}
      if(boss&&boss.st!=='dying'&&boss.fade>.5){const d=Math.hypot(boss.x+boss.w/2-cx,boss.y+boss.h/2-cy);if(d<bd){bd=d;best=boss;}}
      if(best){const dx=best.x+best.w/2-cx,dy=best.y+best.h/2-cy,d=Math.hypot(dx,dy)||1;s.vx+=dx/d*.28;s.vy+=dy/d*.28;}
      const sp=Math.hypot(s.vx,s.vy);if(sp>3){s.vx*=3/sp;s.vy*=3/sp;}}
    s.vy+=s.g;s.x+=s.vx;s.y+=s.vy;
    if(s.k!=='bat'&&solidAt(Math.floor((s.x+s.w/2)/TS),Math.floor((s.y+s.h/2)/TS))){if(s.boom)explode(s);else burst(s.x+s.w/2,s.y+s.h/2,'#ffd166',3);s.dead=true;continue;}
    if(s.x<cam.x-30||s.x>cam.x+W+30||s.y>lvl.rows*TS+20){s.dead=true;continue;}
    const hit=hitTargets(s,s.dmg,s.k,s.pierce?s.hits:null);
    if(hit&&!s.pierce){if(s.boom)explode(s);s.dead=true;}
    if(s.k==='big'&&frame%2===0)parts.push({x:s.x+6-s.vx,y:s.y+6+Math.random()*4-2,vx:-s.vx*.1,vy:0,life:12,c:'#ffd166',s:2,g:0});
  }
  shots=shots.filter(s=>!s.dead);
}
function updateEShots(){
  for(const s of eshots){s.life--;s.vy+=s.g||0;s.x+=s.vx;s.y+=s.vy;s.rot=(s.rot||0)+1;
    if(s.life<=0||s.x<cam.x-60||s.x>cam.x+W+60||s.y>lvl.rows*TS+20||s.y<-60){s.dead=true;continue;}
    if((s.k==='bone'||s.k==='seed')&&s.vy>0&&solidAt(Math.floor((s.x+s.w/2)/TS),Math.floor((s.y+s.h)/TS))){s.dead=true;burst(s.x+4,s.y+6,'#bbb',4);continue;}
    if(!P.dead&&ov(s,{x:P.x+1,y:P.y+2,w:P.w-2,h:P.h-2})){hurtPlayer(dmg(s.dmg),s.x+s.w/2);s.dead=true;}}
  eshots=eshots.filter(s=>!s.dead);
}
function updateDrops(){
  for(const d of drops){d.life--;if(d.life<=0){d.dead=true;continue;}
    if(d.k==='orb'){d.y+=Math.sin(frame*.08)*.3;}else{d.vy=Math.min(3,d.vy+.2);moveBody(d);}
    if(!P.dead&&ov(d,P)){d.dead=true;collect(d.k);}}
  drops=drops.filter(d=>!d.dead);
}
function collect(k){
  if(k==='heart'){P.hp=Math.min(P.max,P.hp+4);popup(P.x,P.y-6,'+HP','#ff6a8a');}
  else if(k==='candy'){score+=100;popup(P.x,P.y-6,'100','#ffe08a');}
  else if(k==='spark'){ammo=Math.min(30,ammo+5);popup(P.x-12,P.y-6,'+5 SPARKS','#7cc8ff');}
  else if(k==='orb'){sfx('get');bossCleared();return;}
  sfx('pick');
}
// ---------- enemies ----------
function updEnemies(){
  const px=P.x+P.w/2,py=P.y+P.h/2;
  for(const e of ents){
    if(e.dead)continue;
    if(!e.act){if(e.x+e.w>cam.x-24&&e.x<cam.x+W+24)e.act=true;else continue;}
    if(e.x<cam.x-200||e.x>cam.x+W+200){if(e.type==='bat'&&e.st===1)e.dead=true;continue;}
    e.t++;if(e.flash>0)e.flash--;
    const ex=e.x+e.w/2,ey=e.y+e.h/2,dx=px-ex,dy=py-ey;
    switch(e.type){
      case 'bat':
        if(e.st===0){if(Math.abs(dx)<120&&Math.abs(dy)<150){e.st=1;e.face=sgn(dx)||-1;}}
        else{e.x+=e.face*(easy()?.95:1.15);e.y+=clamp((py-ey)*.03,-.8,.8)+Math.sin(e.t*.12)*.9;}
        break;
      case 'skeleton':{
        e.vy=Math.min(MAXF,e.vy+GRAV);
        if(Math.abs(dx)<170){e.face=sgn(dx)||e.face;e.cd--;if(e.cd<=0){e.cd=easy()?150:110;e.throwT=14;
          eshots.push({k:'bone',x:ex-4,y:e.y+2,w:8,h:8,vx:clamp(dx/52,-2.3,2.3)*(easy()?.85:1),vy:-4.2,g:.16,life:240,dmg:2});sfx('throw');}}
        if(e.throwT>0){e.throwT--;e.vx=0;}
        else{e.vx=e.dir*.45;const ahead=e.dir>0?e.x+e.w+1:e.x-1;const t=tileAt(Math.floor(ahead/TS),Math.floor((e.y+e.h+2)/TS));
          if(e.onGround&&(t===0||t===3))e.dir*=-1;if(Math.abs(e.x-e.hx)>40)e.dir=e.x>e.hx?-1:1;}
        moveBody(e);if(e.hitWall)e.dir*=-1;if(e.throwT<=0&&Math.abs(dx)>=170)e.face=e.dir;break;}
      case 'ghost':
        if(!e.awake&&Math.abs(dx)<150)e.awake=true;
        if(e.awake){const sp=easy()?.35:.45,d=Math.hypot(dx,dy)||1;e.x+=dx/d*sp;e.y+=dy/d*sp*.7+Math.sin(e.t*.07)*.3;e.face=sgn(dx)||1;}
        e.phased=e.awake&&(e.t%220)>150;break;
      case 'pumpkin':
        if(e.st===0){e.st=1;e.dir=sgn(dx)||-1;}
        e.vx=e.dir*(easy()?.9:1.1);e.vy=Math.min(MAXF,e.vy+GRAV);moveBody(e);if(e.hitWall)e.dir*=-1;e.roll=(e.roll||0)+e.vx;
        if(e.y>lvl.rows*TS+20)e.dead=true;break;
      case 'witch':
        e.x=e.hx+Math.sin(e.t*.015)*70;e.y=e.hy+Math.sin(e.t*.05)*8;e.face=sgn(dx)||-1;e.cd--;
        if(e.cd<=0&&Math.abs(dx)<W*.7){e.cd=easy()?170:130;const d=Math.hypot(dx,dy)||1,s=easy()?1:1.3;
          eshots.push({k:'star',x:ex-3,y:ey-3,w:6,h:6,vx:dx/d*s,vy:dy/d*s,g:0,life:300,dmg:2});e.cast=15;sfx('cast');}
        if(e.cast>0)e.cast--;break;
      case 'wolf':
        e.vy=Math.min(MAXF,e.vy+GRAV);
        if(e.onGround){e.vx*=.8;if(Math.abs(e.vx)<.05)e.vx=0;if(Math.abs(dx)<150){e.face=sgn(dx)||-1;e.cd--;if(e.cd<=0){e.vy=-4.6;e.vx=e.face*(easy()?2:2.6);e.cd=easy()?70:50;sfx('growl');}}}
        moveBody(e);if(e.hitWall)e.vx=-e.vx*.5;if(e.y>lvl.rows*TS+20)e.dead=true;break;
    }
    if(!e.phased&&!e.dead&&ov(e,{x:P.x+1,y:P.y+2,w:P.w-2,h:P.h-2}))hurtPlayer(dmg(2),ex);
  }
  ents=ents.filter(e=>!e.dead);
}

// ---------- bosses ----------

  forest:{name:'WOLFGANG',w:30,h:28,weak:'corn'},mansion:{name:'GRIMELDA',w:24,h:32,weak:'corn',fly:true}};
const arenaL=()=>lockX+4, arenaR=()=>lockX+Math.min(W,30*16)-4;
function makeBoss(id){const m=BOSSMETA[id],max=easy()?20:28;
  const b=Object.assign({id,hp:max,max,t:0,st:'intro',face:-1,inv:0,vx:0,vy:0,onGround:false,k:0,fade:1,phase2:false},m);
  b.x=arenaR()-b.w-40;b.y=m.fly?11*16-90:11*16-b.h-70;return b;}
function nextB(b,list){b.st=list[b.k++%list.length];b.t=0;}
function hitBoss(d,kind){const b=boss;if(!b||b.st==='intro'||b.st==='dying'||b.fade<.5)return;
  if(b.inv>0){sfx('clink');return;}
  let dd=d;if(kind===b.weak){dd=d*2;popup(b.x+b.w/2-12,b.y-8,'WEAK!','#ff6a6a');}
  b.hp-=dd;b.inv=12;sfx('bosshit');burst(b.x+b.w/2,b.y+b.h/2,'#fff',6);
  if(b.hp<=0){b.hp=0;b.st='dying';b.t=0;b.fade=1;eshots.length=0;for(const e of ents){if(!e.dead){e.dead=true;burst(e.x+6,e.y+6,'#fff',8);}}stopMusic();sfx('boom');}}

 graveyard(b,dx){

    R(7,4,20,3,'#1a1022');R(11,-4,12,8,'#1a1022');R(13,-8,8,4,'#1a1022');R(16,-12,5,4,'#1a1022');R(19,-14,4,2,'#1a1022');R(11,2,12,2,'#b69cff');R(16,2,2,2,'#ffd166');
    R(26,6,2,26,'#8a5a2b');R(25,2,4,4,b.cast>0?'#ffffff':'#5ef0e0');ctx.globalAlpha=b.fade*.3;R(23,0,8,8,'#5ef0e0');ctx.globalAlpha=b.fade;R(22,16,4,3,'#8fd16a');});
  ctx.globalAlpha=1;
}
function drawShot(s){
  const x=Math.round(s.x),y=Math.round(s.y);
  switch(s.k){
    case 'lan':R(x,y,6,4,'#ffd166');R(x+1,y+1,4,2,'#fff');break;
    case 'big':ctx.globalAlpha=.4;R(x-3,y-3,18,18,'#ff8a2a');ctx.globalAlpha=1;R(x,y+2,12,8,'#ffb347');R(x+2,y,8,12,'#ffb347');R(x+3,y+3,6,6,'#fff6c0');break;
    case 'bomb':R(x,y+1,8,7,'#ff8a2a');R(x+3,y-1,2,2,'#3f6a2a');R(x+2,y+3,1,1,'#ffe96a');R(x+5,y+3,1,1,'#ffe96a');if(frame%4<2)R(x+4,y-3,1,2,'#fff');break;
    case 'corn':R(x,y+4,6,2,'#ffd166');R(x+1,y+2,4,2,'#ff8a2a');R(x+2,y,2,2,'#fff');break;
    case 'bat':R(x+3,y+2,3,3,'#b69cff');if((frame>>2)%2){R(x,y,3,2,'#b69cff');R(x+6,y,3,2,'#b69cff');}else{R(x,y+4,3,2,'#b69cff');R(x+6,y+4,3,2,'#b69cff');}break;
  }
}
function drawEShot(s){const x=Math.round(s.x),y=Math.round(s.y);
  if(s.k==='bone'){const r=(s.rot>>3)%2;if(r){R(x,y+3,8,2,'#ece6d6');R(x,y+2,2,4,'#ece6d6');R(x+6,y+2,2,4,'#ece6d6');}else{R(x+3,y,2,8,'#ece6d6');R(x+2,y,4,2,'#ece6d6');R(x+2,y+6,4,2,'#ece6d6');}}
  else if(s.k==='star'){const c=(frame>>2)%2?'#ff7ad8':'#ffd166';R(x+2,y,2,6,c);R(x,y+2,6,2,c);R(x+2,y+2,2,2,'#fff');}
  else{R(x+1,y,4,6,'#ffe08a');R(x,y+1,6,4,'#ffe08a');R(x+2,y+1,2,2,'#fff');}}
function drawDrop(d){if(d.life<120&&(frame>>2)%2)return;const x=Math.round(d.x),y=Math.round(d.y);
  if(d.k==='heart'){R(x,y+1,3,3,'#ff4a6a');R(x+5,y+1,3,3,'#ff4a6a');R(x,y+2,8,3,'#ff4a6a');R(x+1,y+5,6,1,'#ff4a6a');R(x+2,y+6,4,1,'#ff4a6a');R(x+3,y+7,2,1,'#ff4a6a');R(x+1,y+2,1,1,'#fff');}
  else if(d.k==='candy'){R(x+2,y+2,4,4,'#ff8a2a');R(x,y+3,2,2,'#ffd166');R(x+6,y+3,2,2,'#ffd166');R(x+3,y+3,1,1,'#fff');}
  else if(d.k==='spark'){const f=(frame>>2)%2;R(x+2,y+2,4,6,'#7cc8ff');R(x+3,y+f,2,3,'#7cc8ff');R(x+3,y+4,2,3,'#e8f8ff');}
  else{const r=7+Math.sin(frame*.15)*1.5;ctx.globalAlpha=.35;ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(x+4,y+4,r+5,0,7);ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(x+4,y+4,r,0,7);ctx.fill();R(x+2,y+1,2,2,'#fff');}}
function drawProp(p,id){if(p.dead)return;const x=p.x,y=p.y,fl=(frame>>2)%2;
  ctx.globalAlpha=.15+.05*fl;ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(x+4,y+4,9,0,7);ctx.fill();ctx.globalAlpha=1;
  if(id==='fields'){R(x+3,y+8,2,8,'#5a3a1a');R(x,y+2,8,7,'#ff8a2a');R(x+3,y,2,2,'#3f6a2a');R(x+1,y+4,2,2,'#ffe96a');R(x+5,y+4,2,2,'#ffe96a');R(x+2,y+7,4,1,'#ffe96a');}
  else if(id==='graveyard'){R(x+1,y+13,6,3,'#6a6774');R(x+3,y+6,2,7,'#ece6d6');R(x+3,y+2+fl,2,3,'#ffd166');R(x+3,y+5,2,1,'#ff8a2a');R(x,y+14,8,1,'#8a8f9a');}
  else if(id==='forest'){R(x+3,y+9,2,7,'#3a2a1a');R(x+1,y+2,6,7,'#2a2a2a');R(x+2,y+3,4,5,fl?'#ffcf5a':'#ffb347');R(x+3,y,2,2,'#2a2a2a');}
  else{R(x+3,y+8,2,8,'#c9a04a');R(x,y+8,8,1,'#c9a04a');R(x,y+4,1,4,'#ece6d6');R(x+7,y+4,1,4,'#ece6d6');R(x+3,y+3,2,5,'#ece6d6');
    R(x,y+2+fl,1,2,'#ffd166');R(x+7,y+2+fl,1,2,'#ffd166');R(x+3,y+1+fl,2,2,'#ffd166');}}
function drawCP(c){const x=c.x,y=c.y;R(x+5,y+6,2,20,'#3a2a2a');R(x+2,y+24,8,2,'#2a1a1a');R(x+1,y-2,10,2,'#2a1a1a');R(x+2,y,8,7,c.lit?'#ffd166':'#4a4458');
  R(x+4,y+1,4,5,c.lit?'#fff6c0':'#2a2438');if(c.lit){ctx.globalAlpha=.25;ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(x+6,y+3,12,0,7);ctx.fill();ctx.globalAlpha=1;}}
function drawPlat(m,th){const x=Math.round(m.x),y=Math.round(m.y);for(let i=0;i<3;i++)ctx.drawImage(th.plat,x+i*16,y);if(m.ax==='y'){R(x+6,0,1,y,'#5a5a6a');R(x+41,0,1,y,'#5a5a6a');}}
function weaponIcon(k,x,y){
  if(k==='lantern'){R(x+2,y,4,1,'#c9a04a');R(x+1,y+1,6,6,'#c9a04a');R(x+2,y+2,4,4,'#ffe96a');}
  else if(k==='bomb'){R(x,y+2,8,6,'#ff8a2a');R(x+3,y,2,2,'#3f6a2a');R(x+2,y+4,1,1,'#ffe96a');R(x+5,y+4,1,1,'#ffe96a');}
  else if(k==='corn'){R(x,y+5,8,2,'#ffd166');R(x+1,y+3,6,2,'#ff8a2a');R(x+3,y+1,2,2,'#fff');}
  else{R(x+3,y+2,3,3,'#b69cff');R(x,y,3,2,'#b69cff');R(x+6,y,3,2,'#b69cff');}}
function drawHUD(){
  const showB=!!boss;R(3,3,98,showB?33:24,'rgba(10,4,20,.6)');
  txt('HP',6,4,'#ffd166');for(let i=0;i<16;i++)R(22+i*4,5,3,6,i<P.hp?'#ff5a6a':'#3a2030');
  if(showB){const v=Math.ceil(boss.hp/boss.max*16);txt('BOSS',6,13,'#ff9a3a');for(let i=0;i<16;i++)R(30+i*4,14,3,6,i<v?'#ff9a3a':'#3a2030');}
  const wy=showB?23:14,w=curWeapon();weaponIcon(w,6,wy+1);txt(w==='lantern'?'LANTERN':WEAPONS[w].name.split(' ').pop()+' '+ammo,17,wy,'#9ef0ff');
  if(w==='lantern')txt(''+ammo,58,wy,'#7cc8ff');
  R(77,wy+1,5,5,'#f2c9a0');R(76,wy,7,2,'#4a3122');txt('x'+lives,84,wy,'#fff');
  txt('SCORE '+String(score).padStart(6,'0'),Math.max(W/2+10,160),4,'#fff','center');
  if(banner){const a=Math.min(1,banner.t/20);ctx.globalAlpha=a;R(0,H/2-26,W,40,'rgba(10,4,20,.6)');txt(banner.a,W/2,H/2-22,banner.a==='WARNING'?'#ff5a5a':'#ffd166','center',10);txt(banner.b,W/2,H/2-8,'#fff','center',14);ctx.globalAlpha=1;}
}
function render(){
  const playing=lvl&&state!=='title'&&state!=='select';
  const L=playing?lvl:attract,th=THEMES[L.id];
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  let sx=0,sy=0;if(shake>0){sx=(Math.random()*2-1)*shake;sy=(Math.random()*2-1)*shake;}
  const camx=Math.round(cam.x+sx),camy=Math.round(cam.y+sy);
  drawSky(th,camx);drawLayer(th.far,camx,.2,camy);drawLayer(th.mid,camx,.5,camy);
  ctx.translate(-camx,-camy);
  drawTiles(L,th,camx);
  if(playing){
    for(const p of props)drawProp(p,L.id);for(const c of lvl.cps)drawCP(c);for(const m of plats)drawPlat(m,th);
    for(const d of drops)drawDrop(d);for(const e of ents)drawEnemy(e);if(boss)drawBoss(boss);drawPlayer();
    for(const s of shots)drawShot(s);for(const s of eshots)drawEShot(s);
    for(const p of parts){if(p.text){txt(p.text,Math.round(p.x),Math.round(p.y),p.c);}else{ctx.globalAlpha=Math.min(1,p.life/10);R(Math.round(p.x),Math.round(p.y),p.s,p.s,p.c);ctx.globalAlpha=1;}}
  }
  ctx.setTransform(1,0,0,1,0,0);
  if(L.id==='graveyard'||L.id==='forest'){ctx.globalAlpha=L.id==='graveyard'?.10:.06;ctx.fillStyle='#cfe0ff';for(let i=0;i<4;i++){const y=150+i*14+Math.sin(frame*.01+i)*4;ctx.fillRect(0,y,W,8);}ctx.globalAlpha=1;}
  if(playing)drawHUD();
}
// ---------- UI / overlays ----------
const OV=document.getElementById('ov'),PAD=document.getElementById('pad'),SND=document.getElementById('snd'),PAUSE=document.getElementById('pause'),HINT=document.getElementById('hint');
let portrait=false;
function showOv(html){OV.innerHTML='<div class="panel">'+html+'</div>';OV.classList.add('on');OV.scrollTop=0;refreshSound();updateChrome();
  const b=OV.querySelector('button:not([disabled])');if(b&&!touchMode)try{b.focus({preventScroll:true});}catch(e){}}
function hideOv(){OV.classList.remove('on');OV.innerHTML='';updateChrome();}
function refreshSound(){OV.querySelectorAll('[data-act=sound]').forEach(b=>b.textContent='Sound: '+(save.sound?'On':'Off'));SND.textContent=save.sound?'🔊':'🔇';}
function updateChrome(){const play=state==='play';PAD.classList.toggle('on',play&&(touchMode||portrait));SND.classList.toggle('on',play);PAUSE.classList.toggle('on',play);HINT.classList.toggle('on',portrait);}
const keyHelp='<div class="keys"><span><b>Move</b></span><span>◀ ▶ or Arrow keys / A D</span><span><b>Jump</b></span><span>JUMP or Space / Z / Up (hold for higher)</span><span><b>Whip</b></span><span>WHIP or X / J</span><span><b>Shoot</b></span><span>SHOOT or C / K (hold, then let go, for a big lantern blast)</span><span><b>Swap weapon</b></span><span>SWAP or Shift / Q / E</span><span><b>Pause</b></span><span>II button or P / Esc</span><span><b>Gamepad</b></span><span>A jump, X whip, B shoot, bumpers swap, Start pause</span></div>';
function showTitle(){state='title';lvl=null;playSong(4);
  showOv('<div class="logo">HAUNTED<br>HUNTER</div><div class="sub">Night of the Witch Queen</div>'+
  '<p>Grimelda the Witch Queen put a spooky spell on Hollow Hill. Beat her three champions, win their powers, then storm her mansion!</p>'+
  '<div><button class="b" data-act="start">▶ Play</button></div>'+
  '<div><button class="b alt" data-act="diff">Mode: '+(easy()?'Easy':'Normal')+'</button><button class="b alt" data-act="sound">Sound: Off</button><button class="b alt" data-act="help">Controls</button></div>'+
  (save.best?'<p class="small">Best score: '+save.best+'</p>':''));}
function showHelp(){showOv('<h2>How to Play</h2>'+keyHelp+'<p>Break lanterns and candles for hearts, candy, and blue sparks. Sparks power the special weapons you win from bosses. Every boss has a weak spot weapon!</p><button class="b" data-act="back">Got it</button>');}
function showSelect(){state='select';lvl=null;playSong(4);const three=save.beaten.fields&&save.beaten.graveyard&&save.beaten.forest;
  let h='<h2>Pick a Stage</h2><div class="grid">';
  for(const s of STAGES){const locked=s.id==='mansion'&&!three;const rw=s.reward?'Win: '+WEAPONS[s.reward].name:'Final boss';
    h+='<button class="card" data-act="go:'+s.id+'"'+(locked?' disabled':'')+'><span class="ci">'+(locked?'🔒':s.icon)+'</span><span class="cn">'+s.name+'</span><span class="cb">Boss: '+s.boss+'</span><span class="cr">'+(locked?'Beat the other 3 bosses':rw)+'</span>'+(save.beaten[s.id]?'<span class="ok">Cleared!</span>':'')+'</button>';}
  h+='</div><div><button class="b alt" data-act="title">Title</button><button class="b alt" data-act="diff">Mode: '+(easy()?'Easy':'Normal')+'</button><button class="b alt" data-act="sound">Sound: Off</button></div>';
  if(owned().length>1)h+='<p class="small">Your weapons: '+owned().map(w=>WEAPONS[w].name).join(', ')+'</p>';
  showOv(h);}
function pauseGame(){if(state!=='play')return;state='pause';for(const k in tc)tc[k]=false;
  showOv('<h2>Paused</h2><div><button class="b" data-act="resume">Resume</button></div><div><button class="b alt" data-act="sound">Sound: Off</button><button class="b alt" data-act="phelp">Controls</button><button class="b alt" data-act="quit">Stage Select</button></div>');}
function resume(){hideOv();state='play';updateChrome();}
function showOver(){showOv('<h2>Game Over</h2><p>Score: '+score+'</p><div><button class="b" data-act="continue">Continue from checkpoint</button></div><div><button class="b alt" data-act="quit">Stage Select</button></div>');}
function showGet(){const w=WEAPONS[stage.reward];
  showOv('<h2>Boss Beaten!</h2><p style="font-size:22px">You got the <b style="color:#ffd166">'+w.name+'</b>!</p><p>Tap SWAP to pick it, then SHOOT to use it. It uses '+w.cost+' blue sparks each time.</p><p>Score: '+score+'</p><button class="b" data-act="select">Continue</button>');}
function showWin(){showOv('<div class="logo" style="font-size:clamp(30px,7vmin,64px)">YOU WIN!</div><p>Grimelda is beaten and the spell is broken. The sun comes up over Hollow Hill, and everyone gets to go trick or treating after all. Happy Halloween, hunter!</p><p>Final score: <b>'+score+'</b></p>'+
  '<p class="small">HAUNTED HUNTER. Game, art, and music made in code by Forge for Randall and the kids.</p><div><button class="b" data-act="select">Play Again</button><button class="b alt" data-act="title">Title</button></div>');}
OV.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;sfx('select');
  if(a==='start'){score=0;showSelect();}
  else if(a==='diff'){save.diff=easy()?'normal':'easy';persist();if(state==='select')showSelect();else showTitle();}
  else if(a==='sound'){setSound(!save.sound);if(save.sound)playSong(state==='pause'?(boss?5:stage.song):4);}
  else if(a==='help')showHelp();else if(a==='back')showTitle();else if(a==='phelp')showOv('<h2>Controls</h2>'+keyHelp+'<button class="b" data-act="resume">Resume</button>');
  else if(a==='title')showTitle();else if(a==='select'||a==='quit')showSelect();
  else if(a.startsWith('go:'))startStage(a.slice(3));
  else if(a==='resume')resume();
  else if(a==='continue'){lives=easy()?5:3;hideOv();respawn();}
});
SND.addEventListener('click',()=>{setSound(!save.sound);if(save.sound)playSong(boss?5:stage?stage.song:4);});
PAUSE.addEventListener('click',()=>pauseGame());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});

// ---------- layout ----------
function place(el,o){const s=el.style;s.left=o.l!=null?o.l+'px':'';s.right=o.r!=null?o.r+'px':'';s.bottom=o.b!=null?o.b+'px':'';s.top='';s.width=o.w+'px';s.height=o.h+'px';if(o.fs)s.fontSize=o.fs+'px';}
function layout(){
  const vw=innerWidth,vh=innerHeight;portrait=vh>vw*1.05;
  let cw,ch,cx,cy;
  if(!portrait){W=clamp(Math.round(H*vw/vh),300,480);ch=vh;cw=vh*W/H;if(cw>vw){cw=vw;ch=vw*H/W;}cx=(vw-cw)/2;cy=(vh-ch)/2;}
  else{W=384;cw=vw;ch=vw*H/W;cx=0;cy=Math.min(Math.max(0,(vh-ch)*.12),70);}
  if(cv.width!==W){cv.width=W;cv.height=H;ctx=cv.getContext('2d');}
  Object.assign(cv.style,{width:cw+'px',height:ch+'px',left:cx+'px',top:cy+'px'});
  PAUSE.style.right=(vw-cx-cw+8)+'px';PAUSE.style.top=(cy+8)+'px';SND.style.right=(vw-cx-cw+62)+'px';SND.style.top=(cy+8)+'px';
  HINT.style.top=(cy+ch+10)+'px';
  const m=16;let u;
  if(!portrait)u=Math.min(vh/5.6,100);else u=Math.min(vw/5,(vh-cy-ch-40)/2.7,140);
  u=Math.max(u,56);
  place(document.getElementById('dpad'),{l:m,b:m,w:(portrait?2.1:2.3)*u,h:1.15*u,fs:u*.42});
  const q=k=>PAD.querySelector('[data-k='+k+']');
  if(portrait){
    place(q('jump'),{r:m,b:m,w:1.1*u,h:1.1*u,fs:u*.2});
    place(q('whip'),{r:m+1.22*u,b:m,w:u,h:u,fs:u*.2});
    place(q('shoot'),{r:m+.58*u,b:m+1.18*u,w:u,h:u,fs:u*.19});
    place(q('swap'),{r:m+1.72*u,b:m+1.3*u,w:.74*u,h:.74*u,fs:u*.16});
  } else {
    place(q('jump'),{r:m,b:m,w:1.05*u,h:1.05*u,fs:u*.2});
    place(q('shoot'),{r:m+1.15*u,b:m+.32*u,w:u,h:u,fs:u*.19});
    place(q('whip'),{r:m+2.25*u,b:m,w:u,h:u,fs:u*.2});
    place(q('swap'),{r:m+3.35*u,b:m+.1*u,w:.66*u,h:.66*u,fs:u*.15});
  }
  PAD.classList.toggle('land',!portrait);
  updateChrome();
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
layout();

// ---------- loop ----------
let last=performance.now(),acc=0;
function loop(now){requestAnimationFrame(loop);let dt=(now-last)/1000;last=now;if(dt>.25)dt=.25;if(dt<0)dt=0;acc+=dt;let n=0;
  while(acc>=1/60&&n<5){pollInput();update();acc-=1/60;n++;}if(n===5)acc=0;render();}
if(save.sound){save.sound=false;}
showTitle();
requestAnimationFrame(loop);

if(DEBUG)window.HH={
  get state(){return state},get P(){return P},get boss(){return boss},get ents(){return ents},get lvl(){return lvl},get save(){return save},get cam(){return cam},
  get score(){return score},get lives(){return lives},get W(){return W},get drops(){return drops},get ammo(){return ammo},get weapon(){return curWeapon()},get frame(){return frame},
  start:id=>startStage(id),
  warp:(col,row)=>{P.x=col*16+3;P.y=(row||11)*16-P.h-1;P.vy=0;P.ride=null;cam.x=clamp(P.x-W/2,0,lvl.cols*16-W);},
  toBoss:()=>{P.x=(lvl.arena+5)*16;P.y=11*16-P.h-1;cam.x=clamp(P.x-W/2,0,lvl.cols*16-W);},
  hurtBoss:n=>{if(boss){boss.inv=0;hitBoss(n,'whip');}},
  input:(a,v)=>{kb[a]=!!v;if(v)latch[a]=true;},god:v=>{god=!!v;},setAmmo:n=>{ammo=n;},
  step:n=>{for(let i=0;i<n;i++){pollInput();update();}render();}
};
})();
