<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3a1f12">
<title>Turkey Escape</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #2a160c;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    position: fixed; inset: 0;
    font-family: "Trebuchet MS", system-ui, -apple-system, sans-serif;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: absolute; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .tbtn {
    position: absolute; border: 3px solid rgba(255, 236, 200, 0.85); border-radius: 50%;
    background: rgba(60, 28, 12, 0.55); color: #fff3dc; font-weight: bold;
    display: flex; align-items: center; justify-content: center; text-align: center;
    touch-action: none; -webkit-user-select: none; user-select: none; padding: 0;
    font-family: inherit; box-shadow: 0 4px 0 rgba(0,0,0,0.35);
  }
  .tbtn.on { background: rgba(230, 120, 40, 0.8); transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .tbtn small { display: block; font-size: 11px; letter-spacing: 1px; opacity: 0.9; }
  #bHover { border-color: rgba(255, 214, 120, 0.95); background: rgba(80, 42, 12, 0.6); }
  #bHover.on { background: rgba(240, 180, 50, 0.85); color: #3a1f12; }
  #touch { display: none; }
  #touch.show { display: block; }
  #bPause { display: none; border-radius: 14px; }
  #bPause.show { display: flex; }
</style>
<link rel="stylesheet" href="../hs-home.css?v=1">
</head>
<body>
<a class="hs-home hs-home--float" href="../" data-hs-home aria-label="Urwin Homeschool home"><svg class="hs-home-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 3.2 2.8 11.2a1 1 0 0 0 1.3 1.52L5.2 11.7V20a1 1 0 0 0 1 1h4.3v-5.5h3V21h4.3a1 1 0 0 0 1-1v-8.3l1.1 1.02A1 1 0 1 0 21.2 11L12 3.2z"/></svg><span class="hs-home-label">Home</span></a>
<canvas id="game" aria-label="Turkey Escape game"></canvas>
<div id="safe"></div>
<div id="touch">
  <button class="tbtn" id="bL" aria-label="Slow down"><span>&#9664;<small>SLOW</small></span></button>
  <button class="tbtn" id="bR" aria-label="Dash"><span>&#9654;<small>DASH</small></span></button>
  <button class="tbtn" id="bSlide" aria-label="Slide"><span>&#9660;<small>SLIDE</small></span></button>
  <button class="tbtn" id="bJump" aria-label="Jump, hold to hover"><span>&#9650;<small>JUMP</small></span></button>
  <button class="tbtn" id="bHover" aria-label="Hold to hover"><span>&#8673;<small>HOVER</small></span></button>
</div>
<button class="tbtn" id="bPause" aria-label="Pause">II</button>
<script src="game.js?v=3"></script>
<script src="../hs-home.js?v=1" defer></script>
</body>
</html>
