<script>
"use strict";
const $=id=>document.getElementById(id), st=$("stage");
let S=1;function fit(){const w=innerWidth,h=innerHeight;S=Math.min(w/1180,h/820);st.style.transform=`translate(${(w-1180*S)/2}px,${(h-820*S)/2}px) scale(${S})`}
addEventListener("resize",fit);fit();
const sp=e=>{const r=st.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}};
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id))}
// shared profile store (Keyboard Academy). Read it, add only our own games.clockTower key.
const SK="kbAcademy.v1";
function loadDB(){let d=null;try{d=JSON.parse(localStorage.getItem(SK)||"null")}catch(e){}
 if(!d||!d.profiles)d={profiles:{Logan:{av:"🦖",les:{},best:0,acc:0,games:{}},Savannah:{av:"🦄",les:{},best:0,acc:0,games:{}}},muted:false};
 if(!d.profiles.Parent)d.profiles.Parent={av:"🧑‍🏫",les:{},best:0,acc:0,games:{},test:true};return d}
let me=null,grade=2;
function prog(){const d=loadDB(),p=d.profiles[me];p.games=p.games||{};return p.games.clockTower||(p.games.clockTower={g2:{},g5:{}})}
function saveProg(lv,stars){const d=loadDB(),p=d.profiles[me];p.games=p.games||{};const g=p.games.clockTower||(p.games.clockTower={g2:{},g5:{}});const k="g"+grade;g[k]=g[k]||{};
 g[k][lv]=Math.max(g[k][lv]||0,stars);localStorage.setItem(SK,JSON.stringify(d))}
function gradeFor(n){return /savannah/i.test(n)?5:/logan/i.test(n)?2:null}
function titleScr(){show("s-title");const d=loadDB();
 $("profs").innerHTML=Object.entries(d.profiles).map(([n,p])=>{const g=gradeFor(n);return `<div class="pcard" data-n="${encodeURIComponent(n)}"><span class="av">${p.av||"⭐"}</span>${n.replace(/</g,"")}<small>${g?"Grade "+g:"Pick a grade"}</small></div>`}).join("");
 $("profs").querySelectorAll(".pcard").forEach(c=>c.onclick=()=>{me=decodeURIComponent(c.dataset.n);const g=gradeFor(me);
  if(g){grade=g;levels()}else pickGrade()})}
function pickGrade(){$("profs").innerHTML=`<div class="pcard" id="pg2"><span class="av">🕒</span>Grade 2<small>Logan's version</small></div><div class="pcard" id="pg5"><span class="av">⏱️</span>Grade 5<small>Savannah's version</small></div>`;
 $("pg2").onclick=()=>{grade=2;levels()};$("pg5").onclick=()=>{grade=5;levels()}}
const LV={2:[["Hours and Halves","Clock: o'clock and half past. Coins to $1."],["Quarter Hours","Clock: quarter past and quarter to. Coins to $1."],["Five Minutes","Clock: 5 minute steps. Coins and $1 bills."],["Big Spender","5 minute clocks. Bills and coins to $10."],["Market Day","Everything mixed, up to $10."]],
 5:[["To the Minute","Set and read clocks to the minute. Pay up to $10."],["Elapsed Time","How much later? Make change from $5."],["Change from $10","Elapsed minutes. Make change from $10."],["Long Shifts","Elapsed time across hours. Change from $10."],["Tower Master","Everything mixed."]]};
function levels(){show("s-levels");const g=prog()["g"+grade]||{};$("lvTitle").textContent=`${me}: pick a level (Grade ${grade})`;
 $("lvGrid").innerHTML=LV[grade].map((l,i)=>{const n=i+1,open=n==1||g[n-1]>0,s=g[n]||0;const x=70+i*212;
  return `<div class="lcard ${open?"":"lock"}" data-l="${n}" style="left:${x}px;top:270px;height:260px"><b>Level ${n}</b><span style="font-weight:700;color:#f3dfa8">${l[0]}</span><span>${l[1]}</span><div class="stars">${[1,2,3].map(k=>`<img src="a/ui_star-${k<=s?"reward":"empty"}.webp" alt="">`).join("")}</div>${open?"":"<span>Locked</span>"}</div>`}).join("");
 $("lvGrid").querySelectorAll(".lcard:not(.lock)").forEach(c=>c.onclick=()=>start(+c.dataset.l))}
$("lvBack").onclick=titleScr;$("pHome").onclick=levels;
// ---------- task generation ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const fmtT=(h,m)=>`${h}:${String(m).padStart(2,"0")}`, money=c=>"$"+(c/100).toFixed(2);
function randTime(step){let h=R(1,12),m=step==30?pick([0,30]):step==15?pick([0,15,30,45]):R(0,59/step|0)*step;if(h==12&&m==0)h=R(1,11);return{h,m}}
function stepFor(l){return grade==5?1:[30,15,5,5,5][l-1]}
function payRange(l){return grade==2?[[5,95],[10,99],[105,300],[200,1000],[50,1000]][l-1]:[[150,1000],[100,450],[150,950],[110,990],[100,990]][l-1]}
function makeTasks(l){const T=[],scenes=[["bg-clock-square","gus"],["bg-bakery","hazel"],["bg-general-store","walt"],["bg-toy-shop","iris"],["bg-mail-counter","gus"]];
 let types;
 if(grade==2)types=["set","pay","read","count","set","pay","read","pay"];
 else if(l==1)types=["set","pay","read","pay","set","pay","read","pay"];
 else types=["elapsed","change","set","change","elapsed","pay","elapsed","change"];
 if(grade==5&&l==5)types=["set","change","elapsed","pay","read","change","elapsed","change"];
 types.forEach((t,i)=>{const timeT=["set","read","elapsed"].includes(t);const sc=timeT?(i%2?scenes[1]:scenes[0]):pick(scenes.slice(2));
  const o={t,bg:sc[0],who:sc[1]};
  if(t=="set"||t=="read"){Object.assign(o,randTime(stepFor(l)))}
  if(t=="elapsed"){const s=randTime(5);const add=l==2?R(1,3)*60+R(0,11)*5:l==3?R(10,55):R(1,4)*60+R(1,59);o.s=s;o.add=add;let tot=s.h*60+s.m+add;o.h=Math.floor(tot/60)%12||12;o.m=tot%60;}
  const [a,b]=payRange(l);
  if(t=="pay"||t=="count"){o.c=R(a,b);if(grade==2&&l<=2)o.c=R(1,19)*5+(l==2?R(0,4):0)}
  if(t=="change"){o.paid=l==2?500:1000;o.c=R(Math.min(a,o.paid-50),Math.min(b,o.paid-5));if(l==2)o.c=R(105,480)}
  T.push(o)});return T}
const NAMES={gus:"Mr. Gus",hazel:"Mrs. Hazel",walt:"Mr. Walt",iris:"Miss Iris"};
// ---------- play ----------
let tasks=[],ti=0,lvl=1,score=0,firstTry=0,tries=0,cur=null,busy=false;
function start(l){lvl=l;tasks=makeTasks(l);ti=0;score=0;firstTry=0;show("s-play");next()}
function say(t){$("dlgT").textContent=t}
function next(){if(ti>=tasks.length)return results();cur=tasks[ti];tries=0;busy=false;$("fb").textContent="";
 $("hTask").textContent=`${ti+1} / ${tasks.length}`;$("hScore").textContent=score;
 $("pbg").src=`a/scenes_${cur.bg}.webp`;$("keeper").src=`a/characters_${cur.who}-idle.webp`;$("dlgP").src=`a/characters_${cur.who}-bust.webp`;$("dlgN").textContent=NAMES[cur.who];
 const sq=cur.bg=="bg-clock-square";$("tower").style.display=sq?"block":"none";const P=$("panel");P.innerHTML="";
 Object.assign(P.style,sq?{left:"440px",top:"276px",transform:"scale(.66)"}:{left:"250px",top:"92px",transform:"none"});$("fb").style.top=sq?"110px":"30px";setTower(10,10);
 ({set:taskSet,read:taskRead,elapsed:taskElapsed,pay:taskPay,count:taskCount,change:taskChange})[cur.t](P)}
function addBtn(P,label,x,y,fn,img){const b=document.createElement("button");b.className=img?"imgbtn":"btn";if(img)b.style.backgroundImage=`url(a/ui_btn-${img}-normal.webp)`;else b.textContent=label;b.setAttribute("aria-label",label);b.style.left=x+"px";b.style.top=y+"px";b.onclick=fn;P.appendChild(b);return b}
function good(){if(busy)return;busy=true;if(tries==0){firstTry++;score+=100}else score+=50;$("hScore").textContent=score;
 $("fb").style.color="#9fe08f";$("fb").textContent=pick(["Right on time!","Exactly right!","Nice work!","Spot on!"]);$("keeper").src=`a/characters_${cur.who}-celebrate.webp`;
 setTimeout(()=>{ti++;next()},1300)}
function bad(el,reveal){tries++;$("fb").style.color="#ffb0a0";if(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
 if(tries>=2){busy=true;$("fb").textContent="Here is the answer.";reveal&&reveal();setTimeout(()=>{ti++;next()},2600)}else $("fb").textContent="Not quite. Try again!"}
// clock widget
function clockEl(P,x,y,size,h,m,drag,step){const c=document.createElement("div");c.className="clock";Object.assign(c.style,{left:x+"px",top:y+"px",width:size+"px",height:size+"px"});
 c.innerHTML=`<img src="a/clock_clock-face.webp" alt=""><img class="hh" src="a/clock_hand-hour.webp" alt=""><img class="mh" src="a/clock_hand-minute.webp" alt=""><img src="a/clock_hand-cap.webp" alt="">`;
 c.st={tot:(h%12)*60+m};const draw=()=>{if(drag)setTower(Math.floor(c.st.tot/60),c.st.tot%60);const t=c.st.tot;const hh=Math.floor(t/60),mm=t%60;c.querySelector(".hh").style.transform=`rotate(${(hh%12)*30+mm*.5}deg)`;c.querySelector(".mh").style.transform=`rotate(${mm*6}deg)`;
  if(c.onset)c.onset()};c.draw=draw;draw();
 if(!drag){c.style.cursor="default";P.appendChild(c);return c}
 c.tabIndex=0;let mode=null,lastM=0;
 const ang=e=>{const p=sp(e),r=c.getBoundingClientRect(),cx=(r.left+r.width/2-st.getBoundingClientRect().left)/S,cy=(r.top+r.height/2-st.getBoundingClientRect().top)/S;return((Math.atan2(p.x-cx,cy-p.y)*180/Math.PI)+360)%360};
 c.addEventListener("pointerdown",e=>{e.preventDefault();c.setPointerCapture(e.pointerId);const a=ang(e),t=c.st.tot,ma=(t%60)*6,ha=((Math.floor(t/60)%12)*30+(t%60)*.5);
  const d=(x,y)=>Math.min(Math.abs(x-y),360-Math.abs(x-y));mode=d(a,ha)+8<d(a,ma)?"h":"m";lastM=t%60;move(e)});
 const move=e=>{if(!mode)return;const a=ang(e);let t=c.st.tot;
  if(mode=="m"){let m=Math.round(a/6/step)*step%60;const old=t%60;let h=Math.floor(t/60);if(old>=45&&m<15)h++;else if(old<15&&m>=45)h--;t=((h%12+12)%12)*60+m}
  else{const h=Math.floor(((a+15)%360)/30)%12;t=h*60+t%60}
  c.st.tot=t;draw()};
 c.addEventListener("pointermove",move);c.addEventListener("pointerup",()=>mode=null);c.addEventListener("pointercancel",()=>mode=null);
 c.addEventListener("keydown",e=>{const k=e.key;let d=k=="ArrowRight"||k=="ArrowUp"?step:k=="ArrowLeft"||k=="ArrowDown"?-step:k=="]"?60:k=="["?-60:0;if(!d)return;e.preventDefault();c.st.tot=((c.st.tot+d)%720+720)%720;draw()});
 P.appendChild(c);return c}
function neutral(h,m){const tgt=(h%12)*60+m,d=x=>{const k=Math.abs(x-tgt)%720;return Math.min(k,720-k)};if(d(0)>=120)return{h:12,m:0};
 const c=[];for(let x=0;x<720;x+=5)if(d(x)>=120)c.push(x);const x=c[Math.floor(Math.random()*c.length)];return{h:Math.floor(x/60)||12,m:x%60}}
const clkMatch=(c,h,m)=>c.st.tot==((h%12)*60+m);
function setTower(h,m){$("tH").style.transform=`rotate(${(h%12)*30+m*.5}deg)`;$("tM").style.transform=`rotate(${m*6}deg)`}
function taskSet(P){const t=cur;say(`Set the clock to ${fmtT(t.h,t.m)}. Drag the long hand for minutes and the short hand for hours.`);
 const L=document.createElement("div");L.className="lab";L.style.cssText+="left:500px;top:40px;width:380px;font:400 52px var(--ct-font-display);color:#f3dfa8";L.textContent=fmtT(t.h,t.m);P.appendChild(L);
 const M=document.createElement("div");M.className="mini";M.style.cssText="left:520px;top:120px;width:340px";M.textContent=grade==2?"Minute hand snaps every 5 minutes.":"Minute hand moves one minute at a time.";if(stepFor(lvl)>=15)M.textContent=`Minute hand snaps every ${stepFor(lvl)} minutes.`;P.appendChild(M);
 const n0=neutral(t.h,t.m),c=clockEl(P,60,40,420,n0.h,n0.m,true,stepFor(lvl));c.id="setClock";
 addBtn(P,"Check",560,330,()=>clkMatch(c,t.h,t.m)?good():bad(c,()=>{c.st.tot=(t.h%12)*60+t.m;c.draw()}),"check")}

function nearTimes(h,m,step){const s=new Set([fmtT(h,m)]),out=[];const cand=[[h%12+1,m],[h,(m+step*R(1,3))%60],[(h+10)%12+1,m],[m/5||12,h*5%60]];
 for(const [a,b] of cand){const k=fmtT(a||12,b);if(!s.has(k)){s.add(k);out.push(k)}if(out.length==3)break}
 while(out.length<3){const r=randTime(step),k=fmtT(r.h,r.m);if(!s.has(k)){s.add(k);out.push(k)}}return out}

  const up=ev=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);g.remove();tray.classList.remove("hot");
   const r=tray.getBoundingClientRect();const inside=ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom;
   if(inside||!moved){if(inTray.length<24){inTray.push({...it});render()}}};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up)}
 render();return{total:()=>inTray.reduce((s,x)=>s+x.v,0),tray}}
