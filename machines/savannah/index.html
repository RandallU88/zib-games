<p class="sub">Machine Works</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Savannah", "grade": 5, "title": "Machine Works", "theme_word": "WORK", "subjects": ["Science (force and motion)", "Reading", "Writing", "Art"], "est_minutes": "20-35", "lesson_id": "simple-machine-shop", "date": "2026-11-11", "art_dir": "../assets/", "theme_class": "theme-workshop", "kick": "Simple Machine Shop · Theme word: WORK", "hero": "hero.svg", "note": "This is a standalone learning page, not a morning lesson, so there is no chore checklist.", "teacher_box": {"who": "Savannah, Grade 5, working on her own on the iPad (pencil for writing and drawing).", "materials": ["iPad (Safari, Urwin Homeschool page)", "Apple Pencil or finger"], "steps": ["Read about force, work, and all six simple machines.", "Answer the reading questions.", "Match each machine to a real object.", "Name the machine in each picture.", "Find simple machines in the workshop scene.", "Solve the ramp puzzle.", "Design an invention and explain how it works.", "Optional: Advanced stretch on fixed and movable pulleys."], "done_looks_like": "Reading questions answered, all 6 match cards sorted, all 6 pictures named, 5 workshop finds checked, all ramp questions answered, an invention drawing saved, and a short explanation written. Advanced is optional.", "standard_check": "Names all six simple machines, matches each to an object, and explains that they make work easier by changing the size or direction of a force, with a trade of force for distance.", "advanced_stretch": "Compares a fixed pulley and a movable pulley: 20-pound load, half the pull, twice the rope for a 4-foot lift."}, "sections": [{"id": "S1", "title": "Read: Machine Works", "tag": "STANDARD", "kind": "reading", "questions": [{"id": "S1-q1", "type": "multiple_choice", "prompt": "What does a simple machine do?", "options": ["It removes all of the work so you do nothing", "It makes work easier by changing the size or direction of a force", "It only works outdoors", "It adds weight to a load"]}, {"id": "S1-q2", "type": "multiple_choice", "prompt": "If you push with less force on a ramp, what do you usually have to do in return?", "options": ["Push for a shorter distance", "Make the load heavier", "Remove the ramp", "Push over a longer distance"]}, {"id": "S1-q3", "type": "multiple_choice", "prompt": "A screw is best described as:", "options": ["A pulley with no rope", "A lever with two fulcrums", "An inclined plane wrapped around a cylinder", "A wheel that does not turn"]}, {"id": "S1-q4", "type": "multiple_choice", "prompt": "What is one thing a fixed pulley does NOT do?", "options": ["Change the direction of the force", "Let you pull down to lift a load up", "Make the pull smaller", "Use a wheel and a rope"]}, {"id": "S1-q5", "type": "short_typed", "prompt": "In your own words, explain the trade that a gentle ramp makes. Use one detail from the reading."}], "pages": ["The workshop door is open, and a long workbench is covered with tools. Today you will study all six simple machines and how they change a force.", "A simple machine is a tool with few or no moving parts that makes work easier. Work means using a force (a push or a pull) to move something. Simple machines can change how big a force you need, or change its direction. There is a trade: if you push with less force, you usually have to push over a longer distance.", "The six simple machines are the inclined plane (ramp), the wedge, the pulley, the lever, the wheel and axle, and the screw. A wedge is a moving inclined plane. A screw is an inclined plane wrapped around a cylinder.", "A ramp lets you use less force to raise a load, but the load travels farther. Both a steep ramp and a gentle ramp can lift a crate to the same height. The gentle ramp needs less push and a longer path. Simple machines do not get rid of the work. They trade force for distance.", "A fixed pulley stays in one place. It does not make the pull smaller, but it lets you pull down to lift a load up. A movable pulley rides up with the load. It cuts the pull in half, but you must pull twice as much rope (if we pretend there is no friction).", "A lever turns on a fulcrum. A wheel and axle turn together, so a turn of the big wheel gives a strong turn at the axle, like a doorknob. Look around a workshop, a playground, or a kitchen, and you will find these machines hiding in ordinary tools."], "panels": ["workshop-door.svg", "workbench.svg", "six-machines.svg", "two-ramps.svg", "pulleys-crate.svg", "wagon.svg"]}, {"id": "S2", "title": "Match the Machine", "tag": "STANDARD", "kind": "activity", "questions": [{"id": "S2-q1", "type": "tap_to_sort", "prompt": "Tap each object, then tap the simple machine it uses.", "buckets": ["Ramp", "Wedge", "Pulley", "Lever", "Wheel and axle", "Screw"], "items": ["Wheelchair ramp", "Doorstop", "Window blinds", "Bottle opener", "Doorknob", "Jar lid"], "item_art": {"Wheelchair ramp": "wheelchair-ramp.svg", "Doorstop": "doorstop.svg", "Window blinds": "window-blinds.svg", "Bottle opener": "bottle-opener.svg", "Doorknob": "doorknob.svg", "Jar lid": "jar-lid.svg"}}]}, {"id": "S3", "title": "Name the Picture", "tag": "STANDARD", "kind": "activity", "questions": [{"id": "S3-q1", "type": "multiple_choice", "prompt": "Picture 1 is a seesaw. Which simple machine is it?", "options": ["Pulley", "Screw", "Lever", "Wedge"], "figure": {"src": "S3-pic-1.svg", "alt": "A seesaw", "kind": "machine"}}, {"id": "S3-q2", "type": "multiple_choice", "prompt": "Picture 2 is a screw turning into wood. Which simple machine is it?", "options": ["Pulley", "Lever", "Wedge", "Screw"], "figure": {"src": "S3-pic-2.svg", "alt": "A screw in wood", "kind": "machine"}}, {"id": "S3-q3", "type": "multiple_choice", "prompt": "Picture 3 is a flagpole with a wheel and rope at the top. Which simple machine is it?", "options": ["Ramp", "Pulley", "Wheel and axle", "Lever"], "figure": {"src": "S3-pic-3.svg", "alt": "A flagpole with a rope", "kind": "machine"}}, {"id": "S3-q4", "type": "multiple_choice", "prompt": "Picture 4 is an axe. Which simple machine is the blade?", "options": ["Lever", "Screw", "Wedge", "Pulley"], "figure": {"src": "S3-pic-4.svg", "alt": "An axe", "kind": "machine"}}, {"id": "S3-q5", "type": "multiple_choice", "prompt": "Picture 5 is a wagon. The wheels turn with a thin rod through the center. Which simple machine is that?", "options": ["Wedge", "Wheel and axle", "Pulley", "Screw"], "figure": {"src": "S3-pic-5.svg", "alt": "A wagon", "kind": "machine"}}, {"id": "S3-q6", "type": "multiple_choice", "prompt": "Picture 6 is a playground slide. Which simple machine is it?", "options": ["Pulley", "Screw", "Lever", "Inclined plane (ramp)"], "figure": {"src": "S3-pic-6.svg", "alt": "A playground slide", "kind": "machine"}}]}, {"id": "S4", "title": "Workshop Hunt", "tag": "STANDARD", "kind": "activity", "questions": [{"id": "S4-q1", "type": "tap_to_sort", "prompt": "Find five simple machines in the workshop scene. Tap each one, then tap its name. (You only need five. One extra object may fit more than one machine.)", "buckets": ["Ramp", "Wedge", "Pulley", "Lever", "Wheel and axle", "Screw"], "items": ["Loading ramp", "Doorstop", "Rope and wheel on the beam", "Pry bar", "Wagon wheels", "Jar lid"], "item_art": {"Loading ramp": "truck-ramp.svg", "Doorstop": "doorstop.svg", "Rope and wheel on the beam": "flagpole.svg", "Pry bar": "pry-bar.svg", "Wagon wheels": "wagon.svg", "Jar lid": "jar-lid.svg"}}], "figure": {"src": "workshop-hunt.svg", "alt": "A workshop and yard with tools, a ramp, a wagon, a rope over a beam, and a jar.", "kind": "workshop"}}, {"id": "S5", "title": "Ramp Puzzle", "tag": "STANDARD", "kind": "activity", "questions": [{"id": "S5-q1", "type": "multiple_choice", "prompt": "Both ramps lift the crate to the same height. Which ramp needs LESS force?", "options": ["Ramp A (steep)", "Ramp B (gentle)", "They need the same force", "Neither can lift it"]}, {"id": "S5-q2", "type": "multiple_choice", "prompt": "On which ramp does the crate travel a LONGER path?", "options": ["Ramp A (steep)", "Ramp B (gentle)", "The paths are equal", "The crate does not move"]}, {"id": "S5-q3", "type": "multiple_choice", "prompt": "Which sentence is true?", "options": ["The gentle ramp gets rid of the work completely", "The steep ramp needs less force because the path is shorter", "Simple machines trade force for distance: less force usually means a longer path", "Both ramps need more force than lifting the crate straight up"]}], "figure": {"src": "two-ramps.svg", "alt": "Two ramps to the same height. One is steep and short. One is gentle and long. Each has a crate.", "kind": "machine"}}, {"id": "S6", "title": "Design: Crate into the Loft", "tag": "STANDARD", "kind": "writing", "questions": [{"id": "S6-q1", "type": "pencil_draw", "prompt": "Draw an invention that lifts the heavy apple crate into the loft. Use at least TWO simple machines, and label each one with its name."}, {"id": "S6-q2", "type": "short_typed", "prompt": "Write 2 or 3 complete sentences that explain how each machine helps. Tell whether it changes the size of the force, the direction of the force, or both."}], "canvas_bg": "loft-crate.svg"}, {"id": "SA", "title": "ADVANCED • OPTIONAL: Pulley Power", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "questions": [{"id": "SA-q1", "type": "number_typed", "prompt": "The crate weighs 20 pounds. A fixed pulley stays in one place. It does not make the pull smaller. About how many pounds of pull do you need? (Pretend there is no friction.)"}, {"id": "SA-q2", "type": "number_typed", "prompt": "A movable pulley rides up with the crate and cuts your pull in half. How many pounds of pull do you need?"}, {"id": "SA-q3", "type": "number_typed", "prompt": "With that movable pulley, you must pull twice as much rope. The crate must rise 4 feet. How many feet of rope do you pull?"}, {"id": "SA-q4", "type": "short_typed", "prompt": "Why does the movable pulley let you pull with less force, but make you pull more rope? Answer in two or three complete sentences."}], "figure": {"src": "pulleys-crate.svg", "alt": "A fixed pulley and a movable pulley, each lifting a crate. No numbers are on the picture.", "kind": "machine"}, "blurb": "The crate weighs 20 pounds. It must rise 4 feet. Pretend there is no friction."}]}</script><script src="../../lessons/assets/hs-submit.js?v=5"></script><script src="../page.js?v=2"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
