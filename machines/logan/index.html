<p class="sub">Workshop Helpers</p></header><main id="app" class="lesson"></main><script id="lesson-data" type="application/json">{"kid": "Logan", "grade": 2, "title": "Workshop Helpers", "theme_word": "FORCE", "subjects": ["Science (forces and motion)", "Reading", "Writing", "Art"], "est_minutes": "15-25", "lesson_id": "simple-machine-shop", "date": "2026-11-11", "art_dir": "../assets/", "theme_class": "theme-workshop", "kick": "Simple Machine Shop · Theme word: FORCE", "hero": "hero.svg", "note": "This is a standalone learning page, not a morning lesson, so there is no chore checklist.", "teacher_box": {"who": "Logan, Grade 2, working on his own on the iPad (pencil for writing and drawing).", "materials": ["iPad (Safari, Urwin Homeschool page)", "Apple Pencil or finger"], "steps": ["Read about force and the four simple machines (tap Next for each part).", "Answer the story questions.", "Match each machine to a real object.", "Name the machine in each picture.", "Solve the ramp puzzle.", "Draw an invention that uses two machines, then write how it works.", "Optional: Advanced stretch (two more machines, and a pulley puzzle)."], "done_looks_like": "Story read, 5 story questions answered, all 4 match cards sorted, all 4 pictures named, all 3 ramp questions answered, an invention drawing saved, and 2 complete sentences written. Advanced is optional.", "standard_check": "Names a ramp, wedge, pulley, and lever, matches each to a real object, and can say that a gentle ramp needs less push but a longer path.", "advanced_stretch": "Meets the wheel and axle and the screw, and compares a fixed pulley with a movable pulley using a 10-pound bag."}, "sections": [{"id": "L1", "title": "Read: Workshop Helpers", "tag": "STANDARD", "kind": "reading", "questions": [{"id": "L1-q1", "type": "multiple_choice", "prompt": "WHAT is a force?", "options": ["A color of paint", "A kind of machine with six wheels", "A push or a pull", "A type of rope"]}, {"id": "L1-q2", "type": "multiple_choice", "prompt": "WHERE might you see a ramp?", "options": ["Only inside a clock", "On a truck or at a playground slide", "Only at the bottom of a lake", "On a pencil eraser"]}, {"id": "L1-q3", "type": "multiple_choice", "prompt": "WHAT does a doorstop work as?", "options": ["A pulley", "A wedge", "A wheel and axle", "A screw"]}, {"id": "L1-q4", "type": "multiple_choice", "prompt": "HOW does a fixed pulley help you lift something?", "options": ["It makes the load heavier", "It melts the rope", "It lets you pull down to lift a load up", "It hides the load"]}, {"id": "L1-q5", "type": "short_typed", "prompt": "WHY does a ramp make lifting a crate easier? Answer in a complete sentence."}], "pages": ["You step into a workshop on a cool November afternoon. Boxes, ropes, ramps, and tools are everywhere. Today you will find out how simple machines help people move heavy things.", "A simple machine is a tool with few or no moving parts that makes work easier. Work means using a force (a push or a pull) to move something. Simple machines can change how big a force you need, or change its direction. There is a trade: if you push with less force, you usually have to push over a longer distance. Today you will meet four of them: the ramp, the wedge, the pulley, and the lever.", "A ramp is a flat, slanted surface. Pushing a crate up a ramp takes less force than lifting it straight up, but the crate travels a longer path. You might see a ramp on a truck or at a playground slide.", "A wedge is two ramps back to back with a thin edge. Push down, and it pushes sideways to split things apart or hold a door still. A doorstop is a wedge. A knife is a wedge too.", "A pulley is a wheel with a groove and a rope over it. A pulley that stays in one place lets you pull down to lift a load up. A flagpole uses a pulley. So do window blinds.", "A lever is a stiff bar that turns on a point called the fulcrum. Push down on one end, and the other end lifts a load. A seesaw is a lever. A bottle opener is a lever too."], "panels": ["workshop-door.svg", "workbench.svg", "ramp-crate.svg", "doorstop.svg", "flagpole.svg", "bottle-opener.svg"]}, {"id": "L2", "title": "Match the Machine", "tag": "STANDARD", "kind": "activity", "questions": [{"id": "L2-q1", "type": "tap_to_sort", "prompt": "Tap each object, then tap the simple machine it uses.", "buckets": ["Ramp", "Wedge", "Pulley", "Lever"], "items": ["Truck ramp", "Doorstop", "Window blinds", "Bottle opener"], "item_art": {"Truck ramp": "truck-ramp.svg", "Doorstop": "doorstop.svg", "Window blinds": "window-blinds.svg", "Bottle opener": "bottle-opener.svg"}}]}, {"id": "L3", "title": "Name the Picture", "tag": "STANDARD", "kind": "activity", "questions": [{"id": "L3-q1", "type": "multiple_choice", "prompt": "Picture 1 is a playground slide. Which simple machine is it?", "options": ["Pulley", "Wedge", "Inclined plane (ramp)", "Lever"], "figure": {"src": "L3-pic-1.svg", "alt": "A playground slide", "kind": "machine"}}, {"id": "L3-q2", "type": "multiple_choice", "prompt": "Picture 2 is an axe splitting a log. Which simple machine is the blade?", "options": ["Lever", "Wedge", "Pulley", "Ramp"], "figure": {"src": "L3-pic-2.svg", "alt": "An axe and a log", "kind": "machine"}}, {"id": "L3-q3", "type": "multiple_choice", "prompt": "Picture 3 is a flagpole with a wheel and a rope at the top. Which simple machine is it?", "options": ["Wedge", "Lever", "Ramp", "Pulley"], "figure": {"src": "L3-pic-3.svg", "alt": "A flagpole with a rope", "kind": "machine"}}, {"id": "L3-q4", "type": "multiple_choice", "prompt": "Picture 4 is a seesaw. Which simple machine is it?", "options": ["Ramp", "Pulley", "Wedge", "Lever"], "figure": {"src": "L3-pic-4.svg", "alt": "A seesaw", "kind": "machine"}}]}, {"id": "L4", "title": "Ramp Puzzle", "tag": "STANDARD", "kind": "activity", "questions": [{"id": "L4-q1", "type": "multiple_choice", "prompt": "Both ramps lift the crate to the same height. Which ramp needs LESS push to move the crate up?", "options": ["Ramp A (the steep one)", "They need the same push", "Ramp B (the gentle one)", "Neither ramp can move it"]}, {"id": "L4-q2", "type": "multiple_choice", "prompt": "On which ramp does the crate travel a LONGER path?", "options": ["Ramp A (the steep one)", "Ramp B (the gentle one)", "They are the same length", "The crate does not move"]}, {"id": "L4-q3", "type": "multiple_choice", "prompt": "Fill in the idea: The gentle ramp needs _____ force, but the crate goes a _____ distance.", "options": ["more; shorter", "less; longer", "less; shorter", "more; longer"]}], "figure": {"src": "two-ramps.svg", "alt": "Two ramps to the same height. One is steep and short. One is gentle and long. Each has a crate.", "kind": "machine"}}, {"id": "L5", "title": "Invent: Crate on the Porch", "tag": "STANDARD", "kind": "writing", "questions": [{"id": "L5-q1", "type": "pencil_draw", "prompt": "Draw an invention that gets the heavy apple crate up onto the porch. Use at least TWO simple machines, and label each one."}, {"id": "L5-q2", "type": "short_typed", "prompt": "Write 2 complete sentences that tell how your invention works."}], "canvas_bg": "porch-crate.svg"}, {"id": "LA", "title": "ADVANCED • OPTIONAL: Two More Machines and Pulley Power", "tag": "ADVANCED • OPTIONAL", "kind": "stretch", "questions": [{"id": "LA-q1", "type": "multiple_choice", "prompt": "A doorknob is a big wheel fixed to a thin rod. Which simple machine is that?", "options": ["A wedge", "A pulley", "A wheel and axle", "A ramp"]}, {"id": "LA-q2", "type": "multiple_choice", "prompt": "A screw is which of these, wrapped around a post?", "options": ["A pulley", "A ramp (an inclined plane)", "A lever", "A doorstop"]}, {"id": "LA-q3", "type": "number_typed", "prompt": "A bag of apples weighs 10 pounds. A movable pulley cuts your pull in half (pretend there is no friction). How many pounds of pull do you need?"}, {"id": "LA-q4", "type": "number_typed", "prompt": "That same movable pulley lifts the bag 2 feet. You must pull twice as much rope. How many feet of rope do you pull?"}], "figure": {"src": "la-machines.svg", "alt": "A doorknob, a jar lid, a fixed pulley lifting a crate, and a movable pulley lifting a bag.", "kind": "machine"}, "blurb": "The bag in the pulley pictures weighs 10 pounds. Pretend there is no friction."}]}</script><script src="../../lessons/assets/hs-submit.js?v=5"></script><script src="../page.js?v=2"></script><script src="../../hs-home.js?v=1" defer></script></body></html>
