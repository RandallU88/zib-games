<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#141414;overflow:hidden;overscroll-behavior:none;touch-action:none;-ms-touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#f4ecff;-webkit-text-size-adjust:100%}
#cv{position:fixed;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated;background:#000;touch-action:none}
#pad{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#pad.on{display:block}
#pad.land .pb,#pad.land #dpad{opacity:.72}
#pad.land .pb.dn{opacity:.95}
.pb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:3px solid rgba(255,255,255,.38);background:rgba(20,20,20,.5);color:#fff;
  font-weight:900;display:flex;align-items:center;justify-content:center;flex-direction:column;letter-spacing:.04em;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.pb small{font-size:.62em;opacity:.85;font-weight:800;margin-top:2px}
.pb.dn{background:rgba(255,154,74,.62);border-color:#ffd166;transform:scale(.94)}
.pb.jump{background:rgba(255,255,255,.22);border-color:rgba(242,101,34,.85)}
.pb.whip{background:rgba(20,20,20,.55);border-color:rgba(242,101,34,.85)}
.pb.shoot{background:rgba(242,101,34,.45);border-color:rgba(255,255,255,.75)}
.pb.swap{background:rgba(182,156,255,.36);border-color:rgba(200,180,255,.7)}
#dpad{position:absolute;pointer-events:auto;touch-action:none;border-radius:26px;border:3px solid rgba(255,255,255,.38);background:rgba(20,20,20,.5);display:flex}
#dpad::before{content:"";position:absolute;inset:-16px;border-radius:36px}
#dpad div{position:relative;flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
#dpad div+div{border-left:2px solid rgba(255,255,255,.25)}
#dpad div.dn{background:rgba(255,154,74,.6)}
#dpad div:first-child{border-radius:23px 0 0 23px}
#dpad div:last-child{border-radius:0 23px 23px 0}
.pb::before{content:"";position:absolute;inset:-10px;border-radius:50%}
.chrome{position:fixed;z-index:6;display:none;width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:rgba(20,10,32,.6);color:#fff;font-size:20px;font-weight:900;touch-action:manipulation;padding:0}
.chrome.on{display:block}
#hint{position:fixed;left:0;right:0;text-align:center;color:#cbb8ff;font-weight:800;font-size:15px;display:none;z-index:4;pointer-events:none}
#hint.on{display:block}
#ov{position:fixed;inset:0;display:none;z-index:10;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at center,rgba(30,14,6,.5),rgba(8,6,4,.88));padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#ov.on{display:flex}
.panel{max-width:820px;width:100%;margin:auto;text-align:center}
.logo{font-family:"Courier New",Courier,monospace;font-weight:900;font-size:clamp(34px,9vmin,84px);line-height:.92;color:#F26522;letter-spacing:.05em;
  text-shadow:4px 4px 0 #000,8px 8px 0 rgba(0,0,0,.45),0 0 30px rgba(242,101,34,.55)}
.sub{font-family:"Courier New",monospace;font-weight:900;color:#fff;font-size:clamp(15px,3vmin,24px);letter-spacing:.12em;text-transform:uppercase;margin:8px 0 6px}
.panel p{font-size:clamp(15px,2.4vmin,19px);line-height:1.4;color:#e4dafa;max-width:600px;margin:8px auto;font-weight:600}

button.b{font-family:inherit;font-weight:900;font-size:clamp(17px,2.6vmin,22px);padding:12px 22px;border-radius:16px;border:3px solid #fff;background:#F26522;color:#141414;
  box-shadow:0 5px 0 #7a2a00;margin:6px;cursor:pointer;min-height:52px;touch-action:manipulation}
button.b:active{transform:translateY(3px);box-shadow:0 2px 0 #7a2a00}
button.b.alt{background:#1e1e1e;color:#fff;border-color:#F26522;box-shadow:0 5px 0 #000}
button.b:focus-visible{outline:4px solid #7cf0ff;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
@media (max-aspect-ratio:1/1){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
button.card{font-family:inherit;color:#f4ecff;border-radius:18px;border:3px solid rgba(255,209,102,.5);background:linear-gradient(160deg,rgba(242,101,34,.4),rgba(20,20,20,.94) 65%);
  padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:150px;touch-action:manipulation;box-shadow:0 6px 0 rgba(0,0,0,.4)}
button.card:active{transform:translateY(3px)}
button.card:focus-visible{outline:4px solid #7cf0ff}
button.card[disabled]{opacity:.55;filter:grayscale(.6);cursor:default}
.card .ci{font-size:40px;line-height:1}
.card .cn{font-family:"Courier New",monospace;font-weight:900;font-size:clamp(14px,2.2vmin,18px);color:#ffd166}
.card .cb{font-size:13px;font-weight:700;color:#d6c8f5}
.card .cr{font-size:12px;font-weight:800;color:#9ef0ff}
.card .ok{font-size:13px;font-weight:900;color:#5ef0a0}
.keys{display:grid;grid-template-columns:auto auto;gap:6px 16px;justify-content:center;text-align:left;font-weight:700;font-size:clamp(14px,2.2vmin,17px);margin:10px auto;max-width:620px}
.keys b{color:#ffd166}
.small{font-size:13px!important;color:#a99bd0!important}
</style>

<body>
<canvas id="cv" width="384" height="216"></canvas>
<div id="hint">Tip: turn sideways for the big screen</div>
<button id="snd" class="chrome" aria-label="Sound">🔇</button>

<div id="pad">
  <div id="dpad"><div data-s="-1">◀</div><div data-s="1">▶</div></div>
  <div class="pb shoot" data-k="shoot">THROW<small id="wlab">HOLD</small></div>
  <div class="pb whip" data-k="whip">TACKLE</div>
  <div class="pb jump" data-k="jump">JUMP</div>

<script>
(()=>{
'use strict';
// ---------- basics ----------
const H=216, TS=16;
let W=384;
const cv=document.getElementById('cv');
let ctx=cv.getContext('2d');
const DEBUG=/debug/.test(location.hash);
const SAVE_KEY='obieBlitz.v1';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sgn=v=>v>0?1:v<0?-1:0;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function rng(seed){return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function loadSave(){let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){}
  const d={v:1,beaten:{},diff:'normal',sound:false,best:0,won:false};
  if(!s||typeof s!=='object')return d; return Object.assign(d,s,{beaten:Object.assign({},s.beaten||{})});}
let save=loadSave();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const easy=()=>save.diff==='easy';

const STAGES=[
 {id:'fields',name:'PUMPKIN PATCH PRACTICE',boss:'ZOMBIE COACH',song:0,icon:'🎃',q:'1ST QUARTER'},
 {id:'forest',name:'HAUNTED CORN MAZE',boss:'GIANT SCARECROW',song:1,icon:'🌽',q:'2ND QUARTER'},
 {id:'graveyard',name:'GRAVEYARD TAILGATE',boss:'HEADLESS QB',song:2,icon:'👻',q:'3RD QUARTER'},
 {id:'mansion',name:'THE NIGHT GAME',boss:'MONSTER MASCOT',song:3,icon:'🏈',q:'4TH QUARTER'},
];
const WEAPONS={lantern:{name:'FOOTBALL',cost:0}};
function owned(){return ['lantern'];}

// ---------- levels ----------
function makeLevel(id){
  const cols={fields:190,graveyard:200,forest:210,mansion:220}[id];
  const L={id,cols,rows:14,t:new Uint8Array(cols*14),ents:[],props:[],cps:[],plats:[],arena:cols-30};
  const set=(x,y,v)=>{if(x>=0&&x<cols&&y>=0&&y<14)L.t[y*cols+x]=v;};
  const G=(a,b,top)=>{for(let x=a;x<b;x++)for(let y=top;y<14;y++)set(x,y,1);};
  const P=(a,b,row)=>{for(let x=a;x<b;x++)set(x,row,2);};
  const S=(a,b,row)=>{for(let x=a;x<b;x++)set(x,row,3);};
  const E=(type,x,row)=>L.ents.push({type,cx:x,row});
  const C=(x,row,drop)=>L.props.push({x:x*16+4,y:row*16-16,w:8,h:16,drop:drop||null});
  const K=x=>L.cps.push({x:x*16+2,y:11*16-26,w:12,h:26,lit:false});
  const M=(x,row,ax,range,spd,ph)=>L.plats.push({bx:x*16,by:row*16,ax,range:range*16,spd:spd||0.02,ph:ph||0});
  if(id==='fields'){
    G(0,24,11);C(7,11);C(15,11,'spark');E('zombie',20,11);
    G(27,52,11);P(31,35,8);C(33,8,'heart');E('bat',38,6);G(41,46,9);C(43,9);E('pumpkin',50,11);
    G(52,72,11);K(53);S(58,61,11);E('zombie',66,11);C(63,11,'candy');
    M(72,9,'x',4,0.018);
    G(78,100,11);E('bat',82,5);E('zombie',93,11);G(85,90,8);C(87,8,'spark');E('pumpkin',97,11);
    G(103,132,11);E('mascot',112,4);P(112,116,8);P(118,122,5);C(120,5,'heart');E('lineback',127,11);K(129);
    G(132,140,11);S(135,137,11);
    M(140,9,'x',3,0.02);
    G(146,190,11);E('lineback',150,11);E('bat',154,5);C(152,11,'heart');K(157);
  } else if(id==='graveyard'){
    G(0,20,11);C(6,11);E('ref',16,11);G(20,23,10);
    G(26,46,11);E('cheer',32,8);P(34,38,8);C(36,8,'spark');S(40,43,11);E('bat',44,5);
    G(46,50,9);G(50,54,7);C(52,7,'heart');
    G(54,74,11);K(56);E('ref',62,11);E('lineback',70,11);C(66,11,'candy');
    M(74,10,'x',3,0.02);
    G(80,96,11);E('cheer',86,7);E('zombie',91,11);C(84,11);
    G(96,110,8);E('ref',104,8);C(100,8,'spark');
    G(110,130,11);S(112,115,11);E('cheer',120,7);E('rb',126,11);K(128);
    G(130,134,11);M(134,11,'y',4,0.02);G(138,150,7);E('mascot',145,4);C(142,7,'heart');
    G(150,200,11);E('lineback',156,11);E('bat',162,5);C(160,11,'heart');K(166);
  } else if(id==='forest'){
    G(0,22,11);C(8,11);E('rb',18,11);
    G(25,40,11);E('bat',30,5);E('lineman',34,11);P(30,34,8);P(36,40,6);C(38,6,'spark');
    G(43,60,11);E('cheer',50,7);E('pumpkin',57,11);G(52,55,9);
    G(60,64,11);K(61);
    M(64,10,'x',2,0.02);M(70,10,'x',2,0.02,1.2);
    G(74,95,11);E('mascot',80,4);E('rb',88,11);C(84,11,'heart');S(91,94,11);
    G(95,99,8);G(99,103,6);C(101,6,'candy');
    G(103,125,11);E('bat',108,6);E('lineman',115,11);E('pumpkin',120,11);K(122);
    G(125,140,11);S(128,131,11);E('rb',136,11);
    G(143,160,11);E('cheer',148,7);E('lineman',156,11);P(146,150,8);C(148,8,'spark');
    G(160,210,11);E('zombie',165,11);E('bat',170,5);C(168,11,'heart');K(176);
  } else {
    G(0,30,11);C(5,11);C(12,11,'spark');P(14,18,8);C(16,8,'heart');E('cheer',15,7);E('ref',22,11);E('bat',26,5);
    G(33,56,11);E('mascot',40,4);S(44,47,11);E('rb',50,11);C(52,11,'spark');
    G(56,62,8);G(62,80,11);K(64);E('cheer',70,7);E('lineback',76,11);C(68,11,'candy');
    M(80,9,'x',3,0.022);M(86,9,'x',2,0.03);
    G(90,110,11);E('bat',94,5);E('lineman',100,11);E('ref',106,11);
    G(110,130,11);S(113,116,11);S(120,123,11);P(112,117,8);P(119,124,8);C(121,8,'heart');E('cheer',118,5);K(128);
    G(130,134,11);M(134,11,'y',4,0.02);G(138,150,7);E('mascot',145,4);C(141,7,'spark');
    G(150,220,11);E('lineback',156,11);E('zombie',164,11);E('cheer',170,7);E('lineman',176,11);C(160,11,'heart');C(172,11,'spark');K(186);
  }
  G(L.arena,cols,11);
  return L;
}


// ---------- themes (tiles + parallax), drawn in code ----------
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const THEMES={};
const PAL={
 fields:{sky:['#1a0f3a','#5a2a5a','#e0703a'],moon:'#ffcf7a',mr:24,d:'#5a3a22',d2:'#4a2e1a',g:'#3f8a36',g2:'#7ac85a',p:'#8a5a2b',p2:'#5a3a1a',s:'#2f4a1a',s2:'#9aba5a'},
 graveyard:{sky:['#060a1a','#1a2a4a','#3a4a6a'],moon:'#e8f0ff',mr:16,d:'#3a3644',d2:'#2c2834',g:'#3f5a4a',g2:'#7a9a8a',p:'#6a6774',p2:'#4a4754',s:'#8a8f9a',s2:'#d8dce8'},
 forest:{sky:['#0d0818','#2a1636','#6a3040'],moon:'#ffe9b0',mr:18,d:'#4a3420',d2:'#3a2816',g:'#8a7a2a',g2:'#e0c050',p:'#c8a050',p2:'#8a6a2a',s:'#5a3a1a',s2:'#c8a050'},
 mansion:{sky:['#02040f','#0a1434','#1a2a50'],moon:'#e8f0ff',mr:9,d:'#2a5a24',d2:'#244e20',g:'#3f8a36',g2:'#6ac85a',p:'#9aa0aa',p2:'#5a606a',s:'#F26522',s2:'#ffffff'}
};
function genTheme(id){
  const p=PAL[id], r=rng(id.length*977+13);
  const g=(c)=>c.getContext('2d');
  const rect=(x2,x,y,w,h,c)=>{x2.fillStyle=c;x2.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
  const fill=mk(16,16),top=mk(16,16),plat=mk(16,8),spike=mk(16,16);
  let f=g(fill);rect(f,0,0,16,16,p.d);
  if(id==='graveyard'){rect(f,0,7,16,1,p.d2);rect(f,0,15,16,1,p.d2);rect(f,7,0,1,7,p.d2);rect(f,3,8,1,7,p.d2);rect(f,12,8,1,7,p.d2);}
  for(let i=0;i<9;i++)rect(f,r()*15,r()*15,1+(r()*2|0),1,p.d2);
  let t=g(top);t.drawImage(fill,0,0);
  rect(t,0,0,16,4,p.g);for(let i=0;i<6;i++)rect(t,r()*15,0,1,1,p.g2);for(let i=0;i<5;i++)rect(t,r()*15,4,1,1+(r()*3|0),p.g);
  if(id==='mansion'){rect(t,0,0,16,16,p.d);rect(t,0,0,16,2,p.g2);for(let x=0;x<16;x+=4)rect(t,x,2,2,14,p.d2);}
  let pl=g(plat);
  if(id==='forest'){rect(pl,0,0,16,8,p.p);for(let i=0;i<10;i++)rect(pl,r()*15,r()*7,2,1,p.p2);rect(pl,0,7,16,1,p.p2);rect(pl,5,0,1,8,'#a07a30');}
  else{rect(pl,0,0,16,6,p.p);rect(pl,0,6,16,2,p.p2);rect(pl,0,0,16,1,'rgba(255,255,255,.25)');rect(pl,7,1,1,5,p.p2);rect(pl,2,2,1,1,p.p2);rect(pl,12,3,1,1,p.p2);}
  let sp=g(spike);
  if(id==='mansion'){for(let i=0;i<2;i++){const x=i*8;for(let k=0;k<11;k++){const w=1+Math.floor(k/2);rect(sp,x+4-Math.floor(w/2),4+k,w,1,(k===4||k===5)?p.s2:p.s);}rect(sp,x,14,8,2,'#222');}}
  else{for(let i=0;i<4;i++){for(let k=0;k<12;k++){const w=Math.max(1,Math.floor(k/3)+1);rect(sp,i*4+2-Math.floor(w/2),3+k,w,1,k<2?p.s2:p.s);}}rect(sp,0,14,16,2,p.d2);}
  const sky=mk(1,H);const sg=g(sky);const gr=sg.createLinearGradient(0,0,0,H);gr.addColorStop(0,p.sky[0]);gr.addColorStop(.6,p.sky[1]);gr.addColorStop(1,p.sky[2]);sg.fillStyle=gr;sg.fillRect(0,0,1,H);
  const far=mk(512,H),mid=mk(512,H),fa=g(far),mi=g(mid);
  const hill=(x2,base,amp,col,k1,k2)=>{for(let x=0;x<512;x++){const y=base+Math.sin(x/512*Math.PI*2*k1)*amp+Math.sin(x/512*Math.PI*2*k2+1.3)*amp*.5;rect(x2,x,y,1,H-y,col);}};
  const tri=(x2,cx,y,h,col)=>{for(let k=0;k<h;k++)rect(x2,cx-k,y+k,k*2+1,1,col);};
  const goal=(x2,x,y)=>{rect(x2,x,y+40,3,46,'#ffd23a');rect(x2,x-20,y+40,43,3,'#ffd23a');rect(x2,x-20,y,3,42,'#ffd23a');rect(x2,x+20,y,3,42,'#ffd23a');};
  if(id==='fields'){
    hill(fa,140,10,'#2a1838',2,5);
    rect(fa,300,108,44,34,'#2a1838');tri(fa,322,86,22,'#2a1838');rect(fa,316,120,12,22,'#e0a050');rect(fa,321,120,2,22,'#2a1838');
    hill(mi,172,5,'#1d1028',3,7);
    for(let x=20;x<512;x+=48){const y=176;rect(mi,x,y-10,12,9,'#e8742a');rect(mi,x+1,y-11,10,1,'#e8742a');rect(mi,x+5,y-13,2,3,'#3f6a2a');rect(mi,x+2,y-7,2,2,'#ffe96a');rect(mi,x+8,y-7,2,2,'#ffe96a');rect(mi,x+3,y-4,6,1,'#ffe96a');}
    goal(mi,140,80);
    for(let i=0;i<3;i++){const x=300+i*26;rect(mi,x,150,14,26,'#3a2a5a');rect(mi,x+2,144,10,6,'#c8c8c8');rect(mi,x+3,156,8,2,'#F26522');}rect(mi,296,172,80,4,'#555');
    for(let x=0;x<512;x+=24){rect(mi,x,160,3,16,'#3a2416');}rect(mi,0,164,512,2,'#3a2416');
  } else if(id==='forest'){
    hill(fa,120,6,'#1e1426',3,7);
    for(let x=0;x<512;x+=5){const hh=60+r()*30;rect(fa,x,150-hh,2,hh+20,'#2a1c2e');rect(fa,x-2,150-hh+10,2,1,'#2a1c2e');}
    rect(fa,200,70,2,40,'#1e1426');rect(fa,190,78,22,2,'#1e1426');rect(fa,195,64,12,8,'#1e1426');
    for(let x=0;x<512;x+=6){const hh=80+r()*40,y=176-hh;rect(mi,x,y,3,hh,'#4a3a18');rect(mi,x+3,y+20+r()*30,5,2,'#5a4a1e');rect(mi,x-4,y+40+r()*30,5,2,'#5a4a1e');rect(mi,x,y-4,3,5,'#d8b44a');}

function edgeAhead(e,dir){const ahead=dir>0?e.x+e.w+1:e.x-1;const t=tileAt(Math.floor(ahead/TS),Math.floor((e.y+e.h+2)/TS));return t===0||t===3;}
function updEnemies(){
  const px=P.x+P.w/2,py=P.y+P.h/2;
  for(const e of ents){
    if(e.dead)continue;

    if(e.x<cam.x-200||e.x>cam.x+W+200){if(e.type==='bat'&&e.st===1)e.dead=true;continue;}
    e.t++;if(e.flash>0)e.flash--;
    const ex=e.x+e.w/2,ey=e.y+e.h/2,dx=px-ex,dy=py-ey;
    switch(e.type){
      case 'bat':
        if(e.st===0){if(Math.abs(dx)<120&&Math.abs(dy)<150){e.st=1;e.face=sgn(dx)||-1;}}
        else{e.x+=e.face*(easy()?.95:1.15);e.y+=clamp((py-ey)*.03,-.8,.8)+Math.sin(e.t*.12)*.9;}
        break;
      case 'ref':{
        e.vy=Math.min(MAXF,e.vy+GRAV);
        if(Math.abs(dx)<170){e.face=sgn(dx)||e.face;e.cd--;if(e.cd<=0){e.cd=easy()?150:110;e.throwT=14;
          eshots.push({k:'flag',x:ex-4,y:e.y+2,w:8,h:8,vx:clamp(dx/52,-2.3,2.3)*(easy()?.85:1),vy:-4.2,g:.16,life:240,dmg:2});sfx('throw');}}
        if(e.throwT>0){e.throwT--;e.vx=0;}
        else{e.vx=e.dir*.45;if(e.onGround&&edgeAhead(e,e.dir))e.dir*=-1;if(Math.abs(e.x-e.hx)>40)e.dir=e.x>e.hx?-1:1;}
        moveBody(e);if(e.hitWall)e.dir*=-1;if(e.throwT<=0&&Math.abs(dx)>=170)e.face=e.dir;break;}
      case 'cheer':
        if(!e.awake&&Math.abs(dx)<150)e.awake=true;
        if(e.awake){const sp=easy()?.35:.45,d=Math.hypot(dx,dy)||1;e.x+=dx/d*sp;e.y+=dy/d*sp*.7+Math.sin(e.t*.07)*.3;e.face=sgn(dx)||1;}

      case 'pumpkin':
        if(e.st===0){e.st=1;e.dir=sgn(dx)||-1;}

      case 'mascot':
        e.x=e.hx+Math.sin(e.t*.015)*70;e.y=e.hy+Math.sin(e.t*.05)*8;e.face=sgn(dx)||-1;e.cd--;
        if(e.cd<=0&&Math.abs(dx)<W*.7){e.cd=easy()?170:130;const d=Math.hypot(dx,dy)||1,s=easy()?1:1.3;
          eshots.push({k:'star',x:ex-3,y:ey-3,w:6,h:6,vx:dx/d*s,vy:dy/d*s,g:0,life:300,dmg:2});e.cast=15;sfx('cast');}
        if(e.cast>0)e.cast--;break;
      case 'rb':
        e.vy=Math.min(MAXF,e.vy+GRAV);
        if(e.onGround){e.face=sgn(dx)||e.face;e.cd--;

        moveBody(e);if(e.y>lvl.rows*TS+20)e.dead=true;break;
      case 'zombie':

      case 'lineback':

        if(e.st===0){if(Math.abs(dx)<220)e.face=sgn(dx)||e.face;e.vx=Math.abs(dx)<220&&!(e.onGround&&edgeAhead(e,e.face))?e.face*.4:0;
          if(e.onGround&&Math.abs(dx)<130&&Math.abs(dy)<40&&e.cd<=0){e.st=1;e.t2=0;e.vx=0;}}

    if(!e.phased&&!e.dead&&!(P.atk>=6&&P.atk<=15)&&ov(e,{x:P.x+1,y:P.y+2,w:P.w-2,h:P.h-2}))hurtPlayer(dmg(heavy?3:2),ex);
  }

  if(!portrait){W=clamp(Math.round(H*vw/vh),300,480);ch=vh;cw=vh*W/H;if(cw>vw){cw=vw;ch=vw*H/W;}cx=(vw-cw)/2;cy=(vh-ch)/2;}
  else{W=384;cw=vw;ch=vw*H/W;cx=0;cy=Math.min(Math.max(0,(vh-ch)*.12),70);}
  if(cv.width!==W){cv.width=W;cv.height=H;ctx=cv.getContext('2d');}
  Object.assign(cv.style,{width:cw+'px',height:ch+'px',left:cx+'px',top:cy+'px'});
  PAUSE.style.right=(vw-cx-cw+8)+'px';PAUSE.style.top=(cy+8)+'px';SND.style.right=(vw-cx-cw+62)+'px';SND.style.top=(cy+8)+'px';
  HINT.style.top=(cy+ch+10)+'px';
  const m=16;let u;
  if(!portrait)u=Math.min(vh/5.6,100);else u=Math.min(vw/5,(vh-cy-ch-40)/2.7,140);
  u=Math.max(u,56);
  place(document.getElementById('dpad'),{l:m,b:m,w:(portrait?2.1:2.3)*u,h:1.15*u,fs:u*.42});
  const q=k=>PAD.querySelector('[data-k='+k+']');
  if(portrait){
    place(q('jump'),{r:m,b:m,w:1.1*u,h:1.1*u,fs:u*.2});
    place(q('whip'),{r:m+1.22*u,b:m,w:u,h:u,fs:u*.2});
    place(q('shoot'),{r:m+.58*u,b:m+1.18*u,w:u,h:u,fs:u*.19});
  } else {
    place(q('jump'),{r:m,b:m,w:1.05*u,h:1.05*u,fs:u*.2});
    place(q('shoot'),{r:m+1.15*u,b:m+.32*u,w:u,h:u,fs:u*.19});
    place(q('whip'),{r:m+2.25*u,b:m,w:u,h:u,fs:u*.2});
  }
  PAD.classList.toggle('land',!portrait);
  updateChrome();
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
layout();

// ---------- loop ----------
let last=performance.now(),acc=0;
function loop(now){requestAnimationFrame(loop);let dt=(now-last)/1000;last=now;if(dt>.25)dt=.25;if(dt<0)dt=0;acc+=dt;let n=0;
  while(acc>=1/60&&n<5){pollInput();update();acc-=1/60;n++;}if(n===5)acc=0;render();}
if(save.sound){save.sound=false;}
showTitle();
requestAnimationFrame(loop);

if(DEBUG)window.HH={
  get state(){return state},get P(){return P},get boss(){return boss},get ents(){return ents},get lvl(){return lvl},get save(){return save},get cam(){return cam},
  get score(){return score},get lives(){return lives},get W(){return W},get drops(){return drops},get ammo(){return ammo},get weapon(){return curWeapon()},get frame(){return frame},get tds(){return tds},
  start:id=>startStage(id),
  warp:(col,row)=>{P.x=col*16+3;P.y=(row||11)*16-P.h-1;P.vy=0;P.ride=null;cam.x=clamp(P.x-W/2,0,lvl.cols*16-W);},
  toBoss:()=>{P.x=(lvl.arena+5)*16;P.y=11*16-P.h-1;cam.x=clamp(P.x-W/2,0,lvl.cols*16-W);},
  hurtBoss:n=>{if(boss){boss.inv=0;hitBoss(n,'whip');}},
  input:(a,v)=>{kb[a]=!!v;if(v)latch[a]=true;},god:v=>{god=!!v;},setAmmo:n=>{ammo=n;},
  step:n=>{for(let i=0;i<n;i++){pollInput();update();}render();}
};
})();
</script>
